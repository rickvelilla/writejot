<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Writejot | Chat</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f6f8fc;

            color:
                #1f2937;

            display:
                flex;

            flex-direction:
                column;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: white;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                11px 6%;

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            flex-shrink:
                0;
        }

        .back {
            color:
                #4285F4;

            text-decoration:
                none;

            font-weight:
                600;

            white-space:
                nowrap;
        }

        .recipient {
            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            min-width:
                0;
        }

        .recipient img {
            width:
                42px;

            height:
                42px;

            border-radius:
                50%;

            object-fit:
                cover;

            border:
                2px solid #4285F4;

            flex-shrink:
                0;
        }

        .recipient-name {
            font-weight:
                700;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }

        .recipient-username {
            color:
                #4285F4;

            font-size:
                13px;
        }

        /* =========================
           MESSAGE AREA
        ========================= */

        #messages {
            flex:
                1;

            overflow-y:
                auto;

            width:
                100%;

            max-width:
                850px;

            margin:
                0 auto;

            padding:
                25px 20px;

            scroll-behavior:
                smooth;
        }

        /* =========================
           MESSAGE ROW
        ========================= */

        .message-row {
            display:
                flex;

            width:
                100%;

            margin-bottom:
                12px;
        }

        .message-row.mine {
            justify-content:
                flex-end;
        }

        .message-row.theirs {
            justify-content:
                flex-start;
        }

        /* =========================
           ADAPTIVE BUBBLE
        ========================= */

        .bubble-wrapper {
            display:
                flex;

            flex-direction:
                column;

            width:
                auto;

            max-width:
                70%;

            flex:
                0 0 auto;
        }

        .bubble {
            display:
                inline-block;

            width:
                max-content;

            max-width:
                100%;

            padding:
                10px 14px;

            border-radius:
                15px;

            line-height:
                1.45;

            white-space:
                pre-wrap;

            overflow-wrap:
                anywhere;

            word-break:
                break-word;

            text-align:
                left;
        }

        .mine .bubble {
            background:
                #4285F4;

            color:
                white;

            border-bottom-right-radius:
                4px;
        }

        .theirs .bubble {
            background:
                white;

            border:
                1px solid #e1e6ee;

            border-bottom-left-radius:
                4px;
        }

        /* =========================
           IMAGE MESSAGES
        ========================= */

        .message-image {
            display:
                block;

            max-width:
                500px;

            max-height:
                500px;

            width:
                auto;

            height:
                auto;

            border-radius:
                12px;

            object-fit:
                contain;

            cursor:
                pointer;

            margin:
                0;
        }

        .image-message-bubble {
            padding:
                5px;

            overflow:
                hidden;
        }

        .image-message-bubble
        .message-image {
            border-radius:
                10px;
        }

        /* =========================
           MESSAGE TIME
        ========================= */

        .time {
            font-size:
                11px;

            opacity:
                0.65;

            margin-top:
                4px;
        }

        .mine .time {
            text-align:
                right;
        }

        /* =========================
           EMPTY STATE
        ========================= */

        #empty {
            text-align:
                center;

            color:
                #718096;

            padding:
                40px;
        }

        /* =========================
           COMPOSER
        ========================= */

        #composer {
            width:
                100%;

            background:
                white;

            border-top:
                1px solid #e5e7eb;

            padding:
                10px 14px;

            flex-shrink:
                0;
        }

        /* =========================
           IMAGE PREVIEW
        ========================= */

        #imagePreview {
            display:
                none;

            width:
                100%;

            max-width:
                850px;

            margin:
                0 auto 8px;

            padding:
                0 0 2px;
        }

        .preview-wrapper {
            position:
                relative;

            display:
                inline-block;
        }

        #previewImage {
            display:
                block;

            width:
                auto;

            max-width:
                180px;

            max-height:
                140px;

            border-radius:
                10px;

            object-fit:
                cover;

            border:
                1px solid #d8dee8;
        }

        #removeImageButton {
            position:
                absolute;

            top:
                -8px;

            right:
                -8px;

            width:
                24px;

            height:
                24px;

            border:
                none;

            border-radius:
                50%;

            background:
                #ef4444;

            color:
                white;

            cursor:
                pointer;

            font-size:
                16px;

            line-height:
                24px;

            padding:
                0;
        }

        /* =========================
           COMPOSER INNER
        ========================= */

        .composer-inner {
            width:
                100%;

            max-width:
                850px;

            margin:
                0 auto;

            display:
                flex;

            align-items:
                flex-end;

            gap:
                8px;
        }

        /* =========================
           PHOTO BUTTON
        ========================= */

        #photoButton {
            width:
                44px;

            height:
                44px;

            flex-shrink:
                0;

            border:
                1px solid #d8dee8;

            border-radius:
                9px;

            background:
                white;

            font-size:
                20px;

            cursor:
                pointer;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;
        }

        #photoButton:hover {
            background:
                #f3f6fb;
        }

        #imageInput {
            display:
                none;
        }

        /* =========================
           TEXT INPUT
        ========================= */

        #messageInput {
            flex:
                1;

            min-width:
                0;

            width:
                100%;

            min-height:
                44px;

            max-height:
                140px;

            padding:
                11px 14px;

            border:
                1px solid #d8dee8;

            border-radius:
                9px;

            background:
                white;

            font-family:
                inherit;

            font-size:
                14px;

            outline:
                none;

            resize:
                none;

            overflow-y:
                auto;
        }

        #messageInput:focus {
            border-color:
                #4285F4;

            box-shadow:
                0 0 0 3px
                rgba(
                    66,
                    133,
                    244,
                    0.08
                );
        }

        /* =========================
           SEND BUTTON
        ========================= */

        #sendButton {
            flex-shrink:
                0;

            min-height:
                44px;

            padding:
                0 18px;

            border:
                none;

            border-radius:
                9px;

            background:
                #4285F4;

            color:
                white;

            font-weight:
                600;

            cursor:
                pointer;

            white-space:
                nowrap;
        }

        #sendButton:hover {
            background:
                #3367d6;
        }

        #sendButton:disabled {
            opacity:
                0.6;

            cursor:
                not-allowed;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding:
                    10px 12px;
            }

            .back {
                font-size:
                    13px;
            }

            .recipient img {
                width:
                    38px;

                height:
                    38px;
            }

            .recipient-name {
                max-width:
                    170px;
            }

            #messages {
                padding:
                    18px 12px;
            }

            .bubble-wrapper {
                max-width:
                    82%;
            }

            .message-image {
                max-width:
                    100%;

                max-height:
                    360px;
            }

            #composer {
                padding:
                    8px 10px;
            }

            #imagePreview {
                padding:
                    0 2px;
            }

            .composer-inner {
                gap:
                    6px;
            }

            #messageInput {
                min-height:
                    42px;

                max-height:
                    120px;

                padding:
                    10px 12px;
            }

            #photoButton {
                width:
                    42px;

                height:
                    42px;
            }

            #sendButton {
                min-height:
                    42px;

                padding:
                    0 13px;
            }
        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <a
        href="messages.html"
        class="back"
    >
        ← Messages
    </a>


    <div class="recipient">

        <img
            id="recipientPicture"
            src="W.png"
            alt="Profile picture"
        >


        <div>

            <div
                id="recipientName"
                class="recipient-name"
            >
                Loading...
            </div>


            <div
                id="recipientUsername"
                class="recipient-username"
            >
                @username
            </div>

        </div>

    </div>

</header>



<!-- =========================
     MESSAGES
========================= -->

<div
    id="messages"
>

    <div
        id="empty"
    >
        Loading messages...
    </div>

</div>



<!-- =========================
     COMPOSER
========================= -->

<div
    id="composer"
>


    <!-- IMAGE PREVIEW -->

    <div
        id="imagePreview"
    >

        <div
            class="preview-wrapper"
        >

            <img
                id="previewImage"
                src=""
                alt="Selected image"
            >


            <button
                id="removeImageButton"
                type="button"
                onclick="removeSelectedImage()"
            >
                ×
            </button>

        </div>

    </div>



    <div
        class="composer-inner"
    >


        <!-- PHOTO BUTTON -->

        <button
            id="photoButton"
            type="button"
            onclick="openImagePicker()"
            title="Send a photo"
        >
            📷
        </button>


        <input
            id="imageInput"
            type="file"
            accept="image/*"
            onchange="handleImageSelection(event)"
        >



        <!-- TEXT INPUT -->

        <textarea
            id="messageInput"
            maxlength="2000"
            placeholder="Write a message..."
            rows="1"
        ></textarea>



        <!-- SEND -->

        <button
            id="sendButton"
            type="button"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>

</div>



<script>


/* =========================================================
   CONFIG
========================================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


let currentUser =
    null;


let otherUsername =
    "";


let refreshTimer =
    null;


let selectedImage =
    null;


let loadRequestId =
    0;


let pageInitialized =
    false;


let sendInProgress =
    false;


/* =========================================================
   CHAT CACHE
========================================================= */

const CHAT_CACHE_TTL =
    24 * 60 * 60 * 1000;


function getChatCacheKey() {

    if (!currentUser || !otherUsername) {
        return "writejot_chat_cache_unknown";
    }

    return (
        "writejot_chat_cache_" +
        normalizeUsername(currentUser.username) +
        "__" +
        normalizeUsername(otherUsername)
    );

}


function loadCachedMessages() {

    try {

        const raw =
            localStorage.getItem(
                getChatCacheKey()
            );

        if (!raw) {
            return false;
        }

        const cached =
            JSON.parse(raw);

        if (
            !cached ||
            !Array.isArray(cached.messages)
        ) {
            return false;
        }

        if (
            cached.savedAt &&
            Date.now() - Number(cached.savedAt) >
                CHAT_CACHE_TTL
        ) {
            localStorage.removeItem(
                getChatCacheKey()
            );
            return false;
        }

        renderMessages(
            cached.messages
        );

        return true;

    }
    catch (error) {

        console.log(
            "Chat cache could not be read."
        );

        return false;

    }

}


function saveMessagesToCache(
    messages
) {

    try {

        localStorage.setItem(

            getChatCacheKey(),

            JSON.stringify({

                savedAt:
                    Date.now(),

                messages:
                    Array.isArray(messages)
                        ? messages
                        : []

            })

        );

    }
    catch (error) {

        console.log(
            "Chat cache could not be saved."
        );

    }

}


/* =========================================================
   START
========================================================= */

async function initializeChat() {

    const savedUser =
        localStorage.getItem(
            "writejotUser"
        );


    if (
        !savedUser
    ) {

        window.location.href =
            "index.html";

        return;

    }


    try {

        currentUser =
            JSON.parse(
                savedUser
            );

    }

    catch (error) {

        localStorage.removeItem(
            "writejotUser"
        );

        window.location.href =
            "index.html";

        return;

    }


    const params =
        new URLSearchParams(
            window.location.search
        );


    otherUsername =
        normalizeUsername(
            params.get(
                "username"
            )
        );


    if (
        !otherUsername
    ) {

        window.location.href =
            "messages.html";

        return;

    }


    pageInitialized =
        true;


    /*
     * Show cached conversation immediately.
     * The server refresh happens in the background.
     */

    loadCachedMessages();


    loadRecipient();

    markConversationRead();

    loadMessages();


    startRefreshTimer();


    setupMessageInput();

}


window.addEventListener(
    "load",
    initializeChat
);


/* =========================================================
   REFRESH / BFCACHE FIX
========================================================= */

window.addEventListener(
    "pageshow",
    async function () {

        /*
         * Chrome can restore chat.html from its back/forward
         * cache. That restores the old DOM exactly as it was,
         * including a stale "Sending..." message.
         *
         * Always rebuild the conversation from the server when
         * the page becomes visible again.
         */

        if (
            !pageInitialized
        ) {

            return;

        }


        startRefreshTimer();


        /* Keep the restored/cached conversation visible and refresh in background. */
        loadCachedMessages();

        loadRecipient();

        markConversationRead();

        loadMessages();

    }
);


window.addEventListener(
    "focus",
    function () {

        if (
            pageInitialized
        ) {

            loadMessages();

        }

    }
);


window.addEventListener(
    "pagehide",
    function () {

        if (
            refreshTimer
        ) {

            clearInterval(
                refreshTimer
            );

            refreshTimer =
                null;

        }

    }
);


function startRefreshTimer() {

    if (
        refreshTimer
    ) {

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer =
        setInterval(
            function () {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    loadMessages();

                }

            },
            3000
        );

}


/* =========================================================
   RECIPIENT
========================================================= */

async function loadRecipient() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=profile&username=" +
                encodeURIComponent(
                    otherUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !result.success ||
            !result.profile
        ) {

            document
                .getElementById(
                    "recipientName"
                )
                .textContent =
                "User not found";


            document
                .getElementById(
                    "recipientUsername"
                )
                .textContent =
                "@" +
                otherUsername;


            return;

        }


        const profile =
            result.profile;


        document
            .getElementById(
                "recipientName"
            )
            .textContent =
            profile.name ||
            "Writejot User";


        document
            .getElementById(
                "recipientUsername"
            )
            .textContent =
            "@" +
            (
                profile.username ||
                otherUsername
            );


        document
            .getElementById(
                "recipientPicture"
            )
            .src =
            profile.profilePicture ||
            "W.png";


        document
            .getElementById(
                "recipientPicture"
            )
            .onerror =
            function () {

                this.src =
                    "W.png";

            };

    }

    catch (error) {

        console.error(
            "Recipient loading error:",
            error
        );


        document
            .getElementById(
                "recipientName"
            )
            .textContent =
            "Writejot User";


        document
            .getElementById(
                "recipientUsername"
            )
            .textContent =
            "@" +
            otherUsername;

    }

}


/* =========================================================
   MARK AS READ
========================================================= */

async function markConversationRead() {

    try {

        await fetch(

            APPS_SCRIPT_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify({

                        action:
                            "markConversationRead",

                        email:
                            currentUser.email,

                        username:
                            otherUsername

                    })

            }

        );

    }

    catch (error) {

        console.error(
            "Read status error:",
            error
        );

    }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages() {

    const requestId =
        ++loadRequestId;


    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=messages" +
                "&email=" +
                encodeURIComponent(
                    currentUser.email
                ) +
                "&username=" +
                encodeURIComponent(
                    otherUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const result =
            await response.json();


        /* Ignore an older request that finished late. */

        if (
            requestId !==
            loadRequestId
        ) {

            return;

        }


        if (
            !result.success
        ) {

            showMessageError(
                result.error ||
                "Could not load messages."
            );

            return;

        }


        /*
         * This is the source of truth. Re-rendering from the
         * server removes any old optimistic "Sending..." DOM
         * that the browser may have restored.
         */

        const serverMessages =
            result.messages ||
            [];


        saveMessagesToCache(
            serverMessages
        );


        renderMessages(
            serverMessages
        );

    }

    catch (error) {

        console.error(
            "Message loading error:",
            error
        );


        if (
            requestId ===
            loadRequestId
        ) {

            /*
             * Do not destroy a perfectly valid chat UI just
             * because a background refresh failed.
             */

            if (
                !document.querySelector(
                    ".message-row"
                )
            ) {

                showMessageError(
                    "Could not load messages."
                );

            }

        }

    }

}

/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(
    messages
) {

    /* Server data replaces any browser-restored pending DOM. */
    removeAllPendingMessages();


    const container =
        document.getElementById(
            "messages"
        );


    if (
        !messages.length
    ) {

        container.innerHTML =

            `
            <div
                id="empty"
            >
                No messages yet.
                Say hello!
            </div>
            `;


        return;

    }


    const currentUsername =
        normalizeUsername(
            currentUser.username
        );


    container.innerHTML =
        messages
            .map(

                function (
                    message
                ) {

                    const mine =
                        normalizeUsername(
                            message.sender
                        ) ===
                        currentUsername;


                    const time =
                        message.timestamp
                            ? new Date(
                                message.timestamp
                              )
                              .toLocaleString()
                            : "";


                    let content =
                        "";


                    /* =========================
                       IMAGE
                    ========================= */

                    if (
                        message.attachmentType ===
                            "image" &&
                        message.attachmentUrl
                    ) {

                        content +=

                            `
                            <img
                                class="message-image"
                                src="${escapeHtml(
                                    message.attachmentUrl
                                )}"
                                alt="Photo"
                                loading="lazy"
                                onclick="openImage(
                                    '${escapeHtml(
                                        message.attachmentUrl
                                    )}'
                                )"
                                onerror="
                                    this.style.display='none';
                                "
                            >
                            `;

                    }


                    /* =========================
                       TEXT
                    ========================= */

                    if (
                        message.message
                    ) {

                        content +=

                            `
                            <div>
                                ${escapeHtml(
                                    message.message
                                )}
                            </div>
                            `;

                    }


                    const isImageOnly =
                        (
                            message.attachmentType ===
                            "image"
                        ) &&
                        !message.message;


                    return `

                        <div
                            class="message-row
                            ${
                                mine
                                    ? "mine"
                                    : "theirs"
                            }"
                        >

                            <div
                                class="bubble-wrapper"
                            >

                                <div
                                    class="bubble
                                    ${
                                        isImageOnly
                                            ? "image-message-bubble"
                                            : ""
                                    }"
                                >

                                    ${content}

                                </div>


                                <div
                                    class="time"
                                >
                                    ${escapeHtml(
                                        time
                                    )}
                                </div>

                            </div>

                        </div>

                    `;

                }

            )
            .join("");


    container.scrollTop =
        container.scrollHeight;

}


/* =========================================================
   OPEN IMAGE
========================================================= */

function openImage(
    url
) {

    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   OPEN FILE PICKER
========================================================= */

function openImagePicker() {

    document
        .getElementById(
            "imageInput"
        )
        .click();

}


/* =========================================================
   SELECT IMAGE
========================================================= */

function handleImageSelection(
    event
) {

    const file =
        event.target.files &&
        event.target.files[0];


    if (
        !file
    ) {

        return;

    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Please choose an image file."
        );


        event.target.value =
            "";


        return;

    }


    /*
     * Keep original file under 10 MB.
     * The image will be compressed before upload.
     */

    if (
        file.size >
        10 * 1024 * 1024
    ) {

        alert(
            "Please choose an image smaller than 10 MB."
        );


        event.target.value =
            "";


        return;

    }


    selectedImage =
        file;


    const reader =
        new FileReader();


    reader.onload =
        function () {

            document
                .getElementById(
                    "previewImage"
                )
                .src =
                reader.result;


            document
                .getElementById(
                    "imagePreview"
                )
                .style.display =
                "block";

        };


    reader.readAsDataURL(
        file
    );

}


/* =========================================================
   REMOVE SELECTED IMAGE
========================================================= */

function removeSelectedImage() {

    selectedImage =
        null;


    document
        .getElementById(
            "imageInput"
        )
        .value =
        "";


    document
        .getElementById(
            "previewImage"
        )
        .src =
        "";


    document
        .getElementById(
            "imagePreview"
        )
        .style.display =
        "none";

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    if (
        sendInProgress
    ) {

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const message =
        input
            .value
            .trim();


    if (
        !message &&
        !selectedImage
    ) {

        return;

    }


    sendInProgress =
        true;


    button.disabled =
        true;


    button.textContent =
        "Sending...";


    /*
     * Add a temporary message only for immediate feedback.
     * It has a unique class so it can be removed whenever the
     * real server conversation is rendered.
     */

    const pendingId =
        "sending-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2);


    appendPendingMessage(
        message,
        selectedImage,
        pendingId
    );


    try {

        let imageData =
            "";


        let imageType =
            "";


        let imageName =
            "";


        if (
            selectedImage
        ) {

            const compressed =
                await compressImage(
                    selectedImage
                );


            imageData =
                compressed.dataUrl;


            imageType =
                compressed.mimeType;


            imageName =
                compressed.fileName;

        }


        const response =
            await fetch(

                APPS_SCRIPT_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "sendMessage",

                            email:
                                currentUser.email,

                            receiver:
                                otherUsername,

                            message:
                                message,

                            attachmentType:
                                imageData
                                    ? "image"
                                    : "",

                            attachmentData:
                                imageData,

                            attachmentMime:
                                imageType,

                            attachmentName:
                                imageName

                        })

                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Could not send the message."
            );

        }


        input.value =
            "";


        resetTextareaHeight();


        removeSelectedImage();


        /*
         * Immediately remove the temporary bubble. The next
         * render will contain the real database message.
         */

        removePendingMessage(
            pendingId
        );


        /*
         * No artificial 400ms wait. Ask the server immediately.
         */

        await loadMessages();

    }

    catch (error) {

        console.error(
            "Send message error:",
            error
        );


        removePendingMessage(
            pendingId
        );


        alert(
            error.message ||
            "Could not send the message."
        );

    }


    finally {

        sendInProgress =
            false;


        button.disabled =
            false;


        button.textContent =
            "Send";


        input.focus();

    }

}


/* =========================================================
   OPTIMISTIC / PENDING MESSAGE
========================================================= */

function appendPendingMessage(
    text,
    imageFile,
    pendingId
) {

    const container =
        document.getElementById(
            "messages"
        );


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row mine sending-message";


    row.dataset.pendingId =
        pendingId;


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "bubble-wrapper";


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    if (
        imageFile
    ) {

        bubble.classList.add(
            "image-message-bubble"
        );


        const image =
            document.createElement(
                "img"
            );


        image.className =
            "message-image";


        image.alt =
            "Photo";


        const reader =
            new FileReader();


        reader.onload =
            function () {

                image.src =
                    reader.result;

            };


        reader.readAsDataURL(
            imageFile
        );


        bubble.appendChild(
            image
        );

    }


    if (
        text
    ) {

        const textNode =
            document.createElement(
                "div"
            );


        textNode.textContent =
            text;


        bubble.appendChild(
            textNode
        );

    }


    const time =
        document.createElement(
            "div"
        );


    time.className =
        "time";


    time.textContent =
        "Sending...";


    wrapper.appendChild(
        bubble
    );


    wrapper.appendChild(
        time
    );


    row.appendChild(
        wrapper
    );


    container.appendChild(
        row
    );


    container.scrollTop =
        container.scrollHeight;

}


function removePendingMessage(
    pendingId
) {

    const element =
        document.querySelector(
            '[data-pending-id="' +
            pendingId +
            '"]'
        );


    if (
        element
    ) {

        element.remove();

    }

}


function removeAllPendingMessages() {

    document
        .querySelectorAll(
            ".sending-message"
        )
        .forEach(
            function (
                element
            ) {

                element.remove();

            }
        );

}

/* =========================================================
   COMPRESS IMAGE
========================================================= */

function compressImage(
    file
) {

    return new Promise(

        function (
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onerror =
                reject;


            reader.onload =
                function () {

                    const image =
                        new Image();


                    image.onerror =
                        reject;


                    image.onload =
                        function () {

                            const maxSize =
                                1600;


                            let width =
                                image.width;


                            let height =
                                image.height;


                            if (
                                width >
                                maxSize ||
                                height >
                                maxSize
                            ) {

                                if (
                                    width >
                                    height
                                ) {

                                    height =
                                        Math.round(
                                            height *
                                            (
                                                maxSize /
                                                width
                                            )
                                        );


                                    width =
                                        maxSize;

                                }
                                else {

                                    width =
                                        Math.round(
                                            width *
                                            (
                                                maxSize /
                                                height
                                            )
                                        );


                                    height =
                                        maxSize;

                                }

                            }


                            const canvas =
                                document
                                    .createElement(
                                        "canvas"
                                    );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const context =
                                canvas
                                    .getContext(
                                        "2d"
                                    );


                            context.drawImage(

                                image,

                                0,
                                0,

                                width,
                                height

                            );


                            const mimeType =
                                "image/jpeg";


                            const dataUrl =
                                canvas.toDataURL(

                                    mimeType,

                                    0.82

                                );


                            resolve({

                                dataUrl:
                                    dataUrl,

                                mimeType:
                                    mimeType,

                                fileName:
                                    "photo-" +
                                    Date.now() +
                                    ".jpg"

                            });

                        };


                    image.src =
                        reader.result;

                };


            reader.readAsDataURL(
                file
            );

        }

    );

}


/* =========================================================
   ADAPTIVE TEXTBOX
========================================================= */

function setupMessageInput() {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.addEventListener(
        "input",
        function () {

            input.style.height =
                "auto";


            const maxHeight =
                window.innerWidth <=
                    600
                    ? 120
                    : 140;


            input.style.height =
                Math.min(
                    input.scrollHeight,
                    maxHeight
                ) +
                "px";

        }
    );


    /*
     * Enter = send
     * Shift + Enter = new line
     */

    input.addEventListener(
        "keydown",
        function (
            event
        ) {

            if (
                event.key ===
                    "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();


                sendMessage();

            }

        }
    );

}


/* =========================================================
   RESET TEXTBOX
========================================================= */

function resetTextareaHeight() {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.style.height =
        "44px";

}


/* =========================================================
   MESSAGE ERROR
========================================================= */

function showMessageError(
    message
) {

    const container =
        document.getElementById(
            "messages"
        );


    /* Keep existing messages visible during background failures. */

    if (
        container.querySelector(
            ".message-row"
        )
    ) {

        return;

    }


    container.innerHTML =

        `
        <div
            id="empty"
        >
            ${escapeHtml(
                message ||
                "Could not load messages."
            )}
        </div>
        `;

}


/* =========================================================
   HELPERS
========================================================= */

function normalizeUsername(
    username
) {

    return String(
        username ||
        ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /^@/,
        ""
    );

}


function escapeHtml(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function sleep(
    milliseconds
) {

    return new Promise(
        function (
            resolve
        ) {

            setTimeout(
                resolve,
                milliseconds
            );

        }
    );

}
