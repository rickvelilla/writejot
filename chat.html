<script>


/* =========================================================
   CONFIG
========================================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


let currentUser =
    null;


let otherUsername =
    "";


let refreshTimer =
    null;


let selectedImage =
    null;


/* =========================================================
   START
========================================================= */

window.onload =
    async function () {

        const savedUser =
            localStorage.getItem(
                "writejotUser"
            );


        if (
            !savedUser
        ) {

            window.location.href =
                "index.html";

            return;

        }


        try {

            currentUser =
                JSON.parse(
                    savedUser
                );

        }

        catch (error) {

            window.location.href =
                "index.html";

            return;

        }


        const params =
            new URLSearchParams(
                window.location.search
            );


        otherUsername =
            String(
                params.get(
                    "username"
                ) || ""
            )
            .trim()
            .toLowerCase()
            .replace(
                /^@/,
                ""
            );


        if (
            !otherUsername
        ) {

            window.location.href =
                "messages.html";

            return;

        }


        await loadRecipient();

        await markConversationRead();

        await loadMessages();


        refreshTimer =
            setInterval(
                loadMessages,
                3000
            );


        setupMessageInput();

    };


/* =========================================================
   RECIPIENT
========================================================= */

async function loadRecipient() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=profile&username=" +
                encodeURIComponent(
                    otherUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        if (
            !result.success ||
            !result.profile
        ) {

            return;

        }


        const profile =
            result.profile;


        document
            .getElementById(
                "recipientName"
            )
            .textContent =
            profile.name ||
            "Writejot User";


        document
            .getElementById(
                "recipientUsername"
            )
            .textContent =
            "@" +
            (
                profile.username ||
                otherUsername
            );


        document
            .getElementById(
                "recipientPicture"
            )
            .src =
            profile.profilePicture ||
            "W.png";

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =========================================================
   MARK READ
========================================================= */

async function markConversationRead() {

    try {

        await fetch(

            APPS_SCRIPT_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify({

                        action:
                            "markConversationRead",

                        email:
                            currentUser.email,

                        username:
                            otherUsername

                    })

            }

        );

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=messages" +
                "&email=" +
                encodeURIComponent(
                    currentUser.email
                ) +
                "&username=" +
                encodeURIComponent(
                    otherUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            return;

        }


        renderMessages(
            result.messages ||
            []
        );

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(
    messages
) {

    const container =
        document.getElementById(
            "messages"
        );


    if (
        !messages.length
    ) {

        container.innerHTML =

            `
            <div id="empty">
                No messages yet. Say hello!
            </div>
            `;

        return;

    }


    const currentUsername =
        normalizeUsername(
            currentUser.username
        );


    container.innerHTML =
        messages
            .map(
                function (message) {

                    const mine =
                        normalizeUsername(
                            message.sender
                        ) ===
                        currentUsername;


                    const time =
                        message.timestamp
                            ? new Date(
                                message.timestamp
                              )
                              .toLocaleString()
                            : "";


                    const imageHtml =
                        (
                            message.attachmentType ===
                            "image" &&
                            message.attachmentUrl
                        )

                            ? `

                                <img
                                    class="message-image"
                                    src="${escapeHtml(
                                        message.attachmentUrl
                                    )}"
                                    alt="Photo"
                                    loading="lazy"
                                    onclick="openImage('${escapeHtml(
                                        message.attachmentUrl
                                    )}')"
                                >

                              `

                            : "";


                    const textHtml =
                        message.message
                            ? `

                                <div>
                                    ${escapeHtml(
                                        message.message
                                    )}
                                </div>

                              `
                            : "";


                    return `

                        <div
                            class="message-row
                            ${
                                mine
                                    ? "mine"
                                    : "theirs"
                            }"
                        >

                            <div
                                class="bubble-wrapper"
                            >

                                <div
                                    class="bubble"
                                >

                                    ${imageHtml}

                                    ${textHtml}

                                </div>


                                <div
                                    class="time"
                                >
                                    ${escapeHtml(
                                        time
                                    )}
                                </div>

                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    container.scrollTop =
        container.scrollHeight;

}


/* =========================================================
   IMAGE SELECTION
========================================================= */

function handleImageSelection(
    event
) {

    const file =
        event.target.files &&
        event.target.files[0];


    if (
        !file
    ) {

        return;

    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Please choose an image file."
        );

        event.target.value =
            "";

        return;

    }


    /*
     * Keep the original file size
     * reasonably small.
     */

    if (
        file.size >
        10 * 1024 * 1024
    ) {

        alert(
            "Please choose an image smaller than 10 MB."
        );

        event.target.value =
            "";

        return;

    }


    selectedImage =
        file;


    const reader =
        new FileReader();


    reader.onload =
        function () {

            const preview =
                document.getElementById(
                    "previewImage"
                );


            preview.src =
                reader.result;


            document
                .getElementById(
                    "imagePreview"
                )
                .style.display =
                "block";

        };


    reader.readAsDataURL(
        file
    );

}


/* =========================================================
   REMOVE IMAGE
========================================================= */

function removeSelectedImage() {

    selectedImage =
        null;


    document
        .getElementById(
            "imageInput"
        )
        .value =
        "";


    document
        .getElementById(
            "previewImage"
        )
        .src =
        "";


    document
        .getElementById(
            "imagePreview"
        )
        .style.display =
        "none";

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const message =
        input.value.trim();


    if (
        !message &&
        !selectedImage
    ) {

        return;

    }


    button.disabled =
        true;


    button.textContent =
        "Sending...";


    try {

        let imageData =
            "";


        let imageType =
            "";


        let imageName =
            "";


        if (
            selectedImage
        ) {

            const compressed =
                await compressImage(
                    selectedImage
                );


            imageData =
                compressed.dataUrl;


            imageType =
                compressed.mimeType;


            imageName =
                compressed.fileName;

        }


        const response =
            await fetch(

                APPS_SCRIPT_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "sendMessage",

                            email:
                                currentUser.email,

                            receiver:
                                otherUsername,

                            message:
                                message,

                            attachmentType:
                                imageData
                                    ? "image"
                                    : "",

                            attachmentData:
                                imageData,

                            attachmentMime:
                                imageType,

                            attachmentName:
                                imageName

                        })

                }

            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Could not send message."
            );

        }


        input.value =
            "";


        resetTextareaHeight();


        removeSelectedImage();


        await loadMessages();

    }

    catch (error) {

        console.error(
            "Send error:",
            error
        );


        alert(
            error.message ||
            "Could not send the message."
        );

    }


    finally {

        button.disabled =
            false;

        button.textContent =
            "Send";

        input.focus();

    }

}


/* =========================================================
   COMPRESS IMAGE
========================================================= */

function compressImage(
    file
) {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onerror =
                reject;


            reader.onload =
                function () {

                    const image =
                        new Image();


                    image.onerror =
                        reject;


                    image.onload =
                        function () {

                            const maxSize =
                                1600;


                            let width =
                                image.width;


                            let height =
                                image.height;


                            if (
                                width >
                                maxSize ||
                                height >
                                maxSize
                            ) {

                                if (
                                    width >
                                    height
                                ) {

                                    height =
                                        Math.round(
                                            height *
                                            (
                                                maxSize /
                                                width
                                            )
                                        );

                                    width =
                                        maxSize;

                                }
                                else {

                                    width =
                                        Math.round(
                                            width *
                                            (
                                                maxSize /
                                                height
                                            )
                                        );

                                    height =
                                        maxSize;

                                }

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const context =
                                canvas.getContext(
                                    "2d"
                                );


                            context.drawImage(

                                image,

                                0,
                                0,

                                width,
                                height

                            );


                            const mimeType =
                                "image/jpeg";


                            const dataUrl =
                                canvas.toDataURL(

                                    mimeType,

                                    0.82

                                );


                            resolve({

                                dataUrl:
                                    dataUrl,

                                mimeType:
                                    mimeType,

                                fileName:
                                    "photo-" +
                                    Date.now() +
                                    ".jpg"

                            });

                        };


                    image.src =
                        reader.result;

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   OPEN FULL IMAGE
========================================================= */

function openImage(
    url
) {

    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   ADAPTIVE TEXT BOX
========================================================= */

function setupMessageInput() {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.addEventListener(
        "input",
        function () {

            input.style.height =
                "auto";


            const maxHeight =
                window.innerWidth <=
                    600
                    ? 120
                    : 140;


            input.style.height =
                Math.min(
                    input.scrollHeight,
                    maxHeight
                ) +
                "px";

        }
    );


    input.addEventListener(
        "keydown",
        function (
            event
        ) {

            if (
                event.key ===
                    "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );

}


/* =========================================================
   RESET TEXTBOX
========================================================= */

function resetTextareaHeight() {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.style.height =
        "44px";

}


/* =========================================================
   HELPERS
========================================================= */

function normalizeUsername(
    username
) {

    return String(
        username || ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /^@/,
        ""
    );

}


function escapeHtml(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

</script>
