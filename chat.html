<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Writejot | Chat</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

}


/* =========================================================
   BODY
========================================================= */

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f6f8fc;

    color:
        #1f2937;

    display:
        flex;

    flex-direction:
        column;

    overflow:
        hidden;

}


/* =========================================================
   HEADER
========================================================= */

header {

    width: 100%;

    height: 66px;

    flex: 0 0 66px;

    background:
        white;

    border-bottom:
        1px solid #e5e7eb;

    padding:
        10px 6%;

    display:
        flex;

    align-items:
        center;

    gap:
        14px;

    z-index:
        20;

}


.back {

    color:
        #4285F4;

    text-decoration:
        none;

    font-weight:
        600;

    white-space:
        nowrap;

}


.recipient {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    min-width:
        0;

}


.recipient img {

    width:
        42px;

    height:
        42px;

    flex:
        0 0 42px;

    border-radius:
        50%;

    object-fit:
        cover;

    border:
        2px solid #4285F4;

    background:
        #edf2f7;

}


.recipient-info {

    min-width:
        0;

}


.recipient-name {

    font-weight:
        700;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

}


.recipient-username {

    color:
        #4285F4;

    font-size:
        13px;

    white-space:
        nowrap;

}


/* =========================================================
   MESSAGE AREA
========================================================= */

#messages {

    flex:
        1 1 auto;

    min-height:
        0;

    width:
        100%;

    max-width:
        900px;

    margin:
        0 auto;

    padding:
        24px 20px;

    overflow-y:
        auto;

    overflow-x:
        hidden;

    scroll-behavior:
        smooth;

    overscroll-behavior:
        contain;

}


/* =========================================================
   MESSAGE ROW
========================================================= */

.message-row {

    width:
        100%;

    display:
        flex;

    align-items:
        flex-end;

    margin-bottom:
        14px;

    min-height:
        0;

}


.message-row.mine {

    justify-content:
        flex-end;

}


.message-row.theirs {

    justify-content:
        flex-start;

}


/* =========================================================
   MESSAGE CONTENT
========================================================= */

.message-content {

    display:
        flex;

    flex-direction:
        column;

    width:
        fit-content;

    max-width:
        min(
            72%,
            620px
        );

    min-width:
        0;

    flex:
        0 1 auto;

}


.mine .message-content {

    align-items:
        flex-end;

}


.theirs .message-content {

    align-items:
        flex-start;

}


/* =========================================================
   TEXT
   NO TEXT BUBBLE
========================================================= */

.message-text {

    display:
        block;

    width:
        auto;

    max-width:
        100%;

    margin:
        0;

    padding:
        0;

    background:
        transparent;

    border:
        none;

    color:
        #1f2937;

    font-size:
        15px;

    line-height:
        1.5;

    white-space:
        pre-wrap;

    overflow-wrap:
        anywhere;

    word-break:
        break-word;

    text-align:
        left;

}


.mine .message-text {

    text-align:
        right;

}


.theirs .message-text {

    text-align:
        left;

}


/* =========================================================
   IMAGE
========================================================= */

.message-image {

    display:
        block;

    width:
        auto;

    max-width:
        500px;

    max-height:
        500px;

    height:
        auto;

    border-radius:
        12px;

    object-fit:
        contain;

    cursor:
        pointer;

}


.mine .message-image {

    margin-left:
        auto;

}


.theirs .message-image {

    margin-right:
        auto;

}


/* =========================================================
   META
========================================================= */

.message-meta {

    display:
        flex;

    align-items:
        center;

    gap:
        5px;

    margin-top:
        3px;

    font-size:
        10px;

    color:
        #8a94a6;

}


.mine .message-meta {

    justify-content:
        flex-end;

}


.theirs .message-meta {

    justify-content:
        flex-start;

}


/* =========================================================
   SENDING STATE
========================================================= */

.sending-message {

    opacity:
        .60;

}


.sending-message .message-text {

    color:
        #667085;

}


.sending-message .message-meta {

    color:
        #8a94a6;

}


/* =========================================================
   EMPTY
========================================================= */

#empty {

    width:
        100%;

    padding:
        40px 20px;

    text-align:
        center;

    color:
        #718096;

}


/* =========================================================
   COMPOSER
========================================================= */

#composer {

    width:
        100%;

    flex:
        0 0 auto;

    background:
        white;

    border-top:
        1px solid #e5e7eb;

    padding:
        10px 14px;

    z-index:
        30;

}


.composer-inner {

    width:
        100%;

    max-width:
        900px;

    margin:
        0 auto;

    display:
        flex;

    align-items:
        flex-end;

    gap:
        8px;

}


/* =========================================================
   PHOTO BUTTON
========================================================= */

#photoButton {

    width:
        44px;

    height:
        44px;

    flex:
        0 0 44px;

    border:
        1px solid #d8dee8;

    border-radius:
        9px;

    background:
        white;

    font-size:
        20px;

    cursor:
        pointer;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

}


#photoButton:hover {

    background:
        #f3f6fb;

}


#imageInput {

    display:
        none;

}


/* =========================================================
   MESSAGE INPUT
========================================================= */

#messageInput {

    flex:
        1 1 auto;

    min-width:
        0;

    width:
        100%;

    min-height:
        44px;

    max-height:
        140px;

    padding:
        11px 14px;

    border:
        1px solid #d8dee8;

    border-radius:
        9px;

    background:
        white;

    font-family:
        inherit;

    font-size:
        14px;

    line-height:
        1.4;

    outline:
        none;

    resize:
        none;

    overflow-y:
        auto;

}


#messageInput:focus {

    border-color:
        #4285F4;

    box-shadow:
        0 0 0 3px
        rgba(
            66,
            133,
            244,
            .08
        );

}


/* =========================================================
   SEND BUTTON
========================================================= */

#sendButton {

    flex:
        0 0 auto;

    min-height:
        44px;

    padding:
        0 18px;

    border:
        none;

    border-radius:
        9px;

    background:
        #4285F4;

    color:
        white;

    font-weight:
        600;

    cursor:
        pointer;

    white-space:
        nowrap;

}


#sendButton:hover {

    background:
        #3367d6;

}


#sendButton:disabled {

    opacity:
        .6;

    cursor:
        not-allowed;

}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

#imagePreview {

    display:
        none;

    width:
        100%;

    max-width:
        900px;

    margin:
        0 auto 8px;

}


.preview-wrapper {

    position:
        relative;

    display:
        inline-block;

}


#previewImage {

    display:
        block;

    max-width:
        180px;

    max-height:
        140px;

    border-radius:
        10px;

    object-fit:
        cover;

    border:
        1px solid #d8dee8;

}


#removeImageButton {

    position:
        absolute;

    top:
        -8px;

    right:
        -8px;

    width:
        24px;

    height:
        24px;

    border:
        none;

    border-radius:
        50%;

    background:
        #ef4444;

    color:
        white;

    cursor:
        pointer;

    font-size:
        16px;

    line-height:
        24px;

    padding:
        0;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    header {

        height:
            60px;

        flex-basis:
            60px;

        padding:
            9px 12px;

    }


    .back {

        font-size:
            13px;

    }


    .recipient img {

        width:
            38px;

        height:
            38px;

        flex-basis:
            38px;

    }


    .recipient-name {

        max-width:
            190px;

    }


    #messages {

        padding:
            18px 12px;

    }


    .message-content {

        max-width:
            82%;

    }


    .message-text {

        font-size:
            15px;

    }


    .message-image {

        max-width:
            100%;

        max-height:
            360px;

    }


    #composer {

        padding:
            8px 10px;

    }


    .composer-inner {

        gap:
            6px;

    }


    #messageInput {

        min-height:
            42px;

        max-height:
            120px;

        padding:
            10px 12px;

    }


    #photoButton {

        width:
            42px;

        height:
            42px;

        flex-basis:
            42px;

    }


    #sendButton {

        min-height:
            42px;

        padding:
            0 13px;

    }

}

</style>

</head>



<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <a
        href="messages.html"
        class="back"
    >
        ← Messages
    </a>


    <div
        class="recipient"
    >

        <img
            id="recipientPicture"
            src="W.png"
            alt="Profile picture"
        >


        <div
            class="recipient-info"
        >

            <div
                id="recipientName"
                class="recipient-name"
            >
                Loading...
            </div>


            <div
                id="recipientUsername"
                class="recipient-username"
            >
                @username
            </div>

        </div>

    </div>

</header>



<!-- =========================================================
     MESSAGES
========================================================= -->

<div
    id="messages"
>

    <div
        id="empty"
    >
        Loading messages...
    </div>

</div>



<!-- =========================================================
     COMPOSER
========================================================= -->

<div
    id="composer"
>


    <!-- IMAGE PREVIEW -->

    <div
        id="imagePreview"
    >

        <div
            class="preview-wrapper"
        >

            <img
                id="previewImage"
                src=""
                alt="Selected image"
            >


            <button
                id="removeImageButton"
                type="button"
                onclick="removeSelectedImage()"
            >
                ×
            </button>

        </div>

    </div>



    <div
        class="composer-inner"
    >

        <button
            id="photoButton"
            type="button"
            onclick="openImagePicker()"
            title="Send a photo"
        >
            📷
        </button>


        <input
            id="imageInput"
            type="file"
            accept="image/*"
        >


        <textarea
            id="messageInput"
            maxlength="2000"
            placeholder="Write a message..."
            rows="1"
        ></textarea>


        <button
            id="sendButton"
            type="button"
        >
            Send
        </button>

    </div>

</div>



<script>


/* =========================================================
   CONFIG
========================================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


const CHAT_CACHE_PREFIX =
    "writejot_chat_";


const RECIPIENT_CACHE_PREFIX =
    "writejot_recipient_";


let currentUser =
    null;


let otherUsername =
    "";


let selectedImage =
    null;


let refreshTimer =
    null;


let sendInProgress =
    false;


let initialized =
    false;


/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener(
    "load",
    initializeChat
);


async function initializeChat() {

    const savedUser =
        localStorage.getItem(
            "writejotUser"
        );


    if (!savedUser) {

        window.location.href =
            "index.html";

        return;

    }


    try {

        currentUser =
            JSON.parse(
                savedUser
            );

    }

    catch (error) {

        localStorage.removeItem(
            "writejotUser"
        );


        window.location.href =
            "index.html";

        return;

    }


    const params =
        new URLSearchParams(
            window.location.search
        );


    otherUsername =
        normalizeUsername(
            params.get(
                "username"
            )
        );


    if (!otherUsername) {

        window.location.href =
            "messages.html";

        return;

    }


    initialized =
        true;


    setupMessageInput();


    /*
     * CACHE FIRST.
     */

    loadRecipientCache();

    loadChatCache();


    /*
     * Refresh from server in background.
     */

    refreshChat();


    startRefreshTimer();

}


/* =========================================================
   BROWSER RESTORE
========================================================= */

window.addEventListener(
    "pageshow",
    function() {

        if (
            !initialized
        ) {

            return;

        }


        /*
         * Refresh authoritative data.
         * This removes stale Sending... messages
         * restored by browser bfcache.
         */

        refreshChat();

    }
);


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            initialized &&
            document.visibilityState ===
                "visible"
        ) {

            refreshChat();

        }

    }
);


/* =========================================================
   FOCUS
========================================================= */

window.addEventListener(
    "focus",
    function() {

        if (
            initialized
        ) {

            loadMessages();

        }

    }
);


/* =========================================================
   REFRESH CHAT
========================================================= */

async function refreshChat() {

    try {

        await loadRecipient();


        await markConversationRead();


        await loadMessages();

    }

    catch (
        error
    ) {

        console.error(
            "Chat refresh error:",
            error
        );

    }

}


/* =========================================================
   AUTO REFRESH
========================================================= */

function startRefreshTimer() {

    if (
        refreshTimer
    ) {

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer =
        setInterval(

            function() {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    loadMessages();

                }

            },

            3000

        );

}


/* =========================================================
   CHAT CACHE
========================================================= */

function getChatCacheKey() {

    return (
        CHAT_CACHE_PREFIX +
        normalizeEmail(
            currentUser.email
        ) +
        "_" +
        otherUsername
    );

}


function loadChatCache() {

    try {

        const raw =
            localStorage.getItem(
                getChatCacheKey()
            );


        if (!raw) {

            return;

        }


        const cached =
            JSON.parse(
                raw
            );


        if (
            !Array.isArray(
                cached.messages
            )
        ) {

            return;

        }


        renderMessages(
            cached.messages
        );

    }

    catch (
        error
    ) {

        console.log(
            "Chat cache unavailable."
        );

    }

}


function saveChatCache(
    messages
) {

    try {

        localStorage.setItem(

            getChatCacheKey(),

            JSON.stringify({

                savedAt:
                    Date.now(),

                messages:
                    messages

            })

        );

    }

    catch (
        error
    ) {

        console.log(
            "Could not save chat cache."
        );

    }

}


/* =========================================================
   RECIPIENT CACHE
========================================================= */

function getRecipientCacheKey() {

    return (
        RECIPIENT_CACHE_PREFIX +
        otherUsername
    );

}


function loadRecipientCache() {

    try {

        const raw =
            localStorage.getItem(
                getRecipientCacheKey()
            );


        if (!raw) {

            return;

        }


        const profile =
            JSON.parse(
                raw
            );


        applyRecipientProfile(
            profile
        );

    }

    catch {}

}


function saveRecipientCache(
    profile
) {

    try {

        localStorage.setItem(

            getRecipientCacheKey(),

            JSON.stringify(
                profile
            )

        );

    }

    catch {}

}


/* =========================================================
   RECIPIENT
========================================================= */

async function loadRecipient() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=profile&username=" +
                encodeURIComponent(
                    otherUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !result.success ||
            !result.profile
        ) {

            document
                .getElementById(
                    "recipientName"
                )
                .textContent =
                "User not found";


            document
                .getElementById(
                    "recipientUsername"
                )
                .textContent =
                "@" +
                otherUsername;


            return;

        }


        applyRecipientProfile(
            result.profile
        );


        saveRecipientCache(
            result.profile
        );

    }

    catch (
        error
    ) {

        console.error(
            "Recipient loading error:",
            error
        );


        /*
         * Leave cached recipient visible.
         */

        const name =
            document.getElementById(
                "recipientName"
            );


        if (
            !name.textContent ||
            name.textContent ===
                "Loading..."
        ) {

            name.textContent =
                "Writejot User";

        }


        document
            .getElementById(
                "recipientUsername"
            )
            .textContent =
            "@" +
            otherUsername;

    }

}


function applyRecipientProfile(
    profile
) {

    document
        .getElementById(
            "recipientName"
        )
        .textContent =
        profile.name ||
        "Writejot User";


    document
        .getElementById(
            "recipientUsername"
        )
        .textContent =
        "@" +
        (
            profile.username ||
            otherUsername
        );


    document
        .getElementById(
            "recipientPicture"
        )
        .src =
        profile.profilePicture ||
        "W.png";


    document
        .getElementById(
            "recipientPicture"
        )
        .onerror =
        function() {

            this.src =
                "W.png";

        };

}


/* =========================================================
   MARK READ
========================================================= */

async function markConversationRead() {

    try {

        await fetch(

            APPS_SCRIPT_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify({

                        action:
                            "markConversationRead",

                        email:
                            currentUser.email,

                        username:
                            otherUsername

                    })

            }

        );

    }

    catch (
        error
    ) {

        console.error(
            "Mark read error:",
            error
        );

    }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=messages" +
                "&email=" +
                encodeURIComponent(
                    currentUser.email
                ) +
                "&username=" +
                encodeURIComponent(
                    otherUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !result.success
        ) {

            return;

        }


        const messages =
            Array.isArray(
                result.messages
            )
                ? result.messages
                : [];


        /*
         * Server is authoritative.
         */

        saveChatCache(
            messages
        );


        /*
         * This completely rebuilds the message list,
         * so stale Sending... messages disappear.
         */

        renderMessages(
            messages
        );

    }

    catch (
        error
    ) {

        console.error(
            "Message loading error:",
            error
        );

        /*
         * Keep cached messages on screen.
         */

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(
    messages
) {

    const container =
        document.getElementById(
            "messages"
        );


    const wasEmpty =
        !container.querySelector(
            ".message-row"
        );


    const distanceFromBottom =
        container.scrollHeight -
        container.scrollTop -
        container.clientHeight;


    const nearBottom =
        distanceFromBottom <
        180;


    if (
        !messages.length
    ) {

        container.innerHTML =

            `
            <div id="empty">
                No messages yet. Say hello!
            </div>
            `;


        return;

    }


    const currentUsername =
        normalizeUsername(
            currentUser.username
        );


    container.innerHTML =
        messages
            .map(
                function(message) {

                    return buildMessageHtml(
                        message,
                        currentUsername
                    );

                }
            )
            .join("");


    requestAnimationFrame(
        function() {

            if (
                wasEmpty ||
                nearBottom ||
                !container.dataset.userScrolled
            ) {

                container.scrollTop =
                    container.scrollHeight;

            }

        }
    );

}


/* =========================================================
   BUILD REAL MESSAGE
========================================================= */

function buildMessageHtml(
    message,
    currentUsername
) {

    const mine =
        normalizeUsername(
            message.sender
        ) ===
        currentUsername;


    const time =
        message.timestamp
            ? new Date(
                message.timestamp
            ).toLocaleTimeString(
                [],
                {
                    hour:
                        "numeric",

                    minute:
                        "2-digit"
                }
            )
            : "";


    let content =
        "";


    /*
     * IMAGE
     */

    if (
        message.attachmentType ===
            "image" &&
        message.attachmentUrl
    ) {

        content +=

            `
            <img
                class="message-image"
                src="${escapeHtml(
                    message.attachmentUrl
                )}"
                alt="Photo"
                loading="lazy"
                onclick="
                    openImage(
                        '${escapeJs(
                            message.attachmentUrl
                        )}'
                    )
                "
                onerror="
                    this.style.display='none';
                "
            >
            `;

    }


    /*
     * TEXT
     */

    const text =
        String(
            message.message ||
            ""
        );


    if (
        text
    ) {

        content +=

            `
            <div
                class="message-text"
            >
                ${escapeHtml(
                    text
                )}
            </div>
            `;

    }


    return `

        <div
            class="
                message-row
                ${
                    mine
                        ? "mine"
                        : "theirs"
                }
            "
        >

            <div
                class="message-content"
            >

                ${content}


                <div
                    class="message-meta"
                >

                    ${escapeHtml(
                        time
                    )}

                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   OPTIMISTIC MESSAGE
========================================================= */

function addOptimisticMessage(
    text,
    imageData
) {

    const container =
        document.getElementById(
            "messages"
        );


    const empty =
        document.getElementById(
            "empty"
        );


    if (
        empty
    ) {

        empty.remove();

    }


    let content =
        "";


    if (
        imageData
    ) {

        content +=

            `
            <img
                class="message-image"
                src="${escapeHtml(
                    imageData
                )}"
                alt="Photo"
            >
            `;

    }


    if (
        text
    ) {

        content +=

            `
            <div
                class="message-text"
            >
                ${escapeHtml(
                    text
                )}
            </div>
            `;

    }


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row mine sending-message";


    row.dataset.optimistic =
        "true";


    row.innerHTML =

        `
        <div
            class="message-content"
        >

            ${content}


            <div
                class="message-meta"
            >
                Sending...
            </div>

        </div>
        `;


    container.appendChild(
        row
    );


    container.scrollTop =
        container.scrollHeight;


    return row;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    if (
        sendInProgress
    ) {

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const text =
        input.value.trim();


    if (
        !text &&
        !selectedImage
    ) {

        return;

    }


    sendInProgress =
        true;


    button.disabled =
        true;


    button.textContent =
        "Sending...";


    /*
     * Save the file reference before anything
     * asynchronous happens.
     */

    const imageFile =
        selectedImage;


    let previewData =
        "";


    /*
     * Create an immediate local preview.
     */

    if (
        imageFile
    ) {

        try {

            previewData =
                await fileToDataURL(
                    imageFile
                );

        }

        catch (
            error
        ) {

            console.error(
                "Preview error:",
                error
            );

        }

    }


    /*
     * Show optimistic message immediately.
     */

    const optimisticElement =
        addOptimisticMessage(
            text,
            previewData
        );


    try {

        let imageData =
            "";


        let imageType =
            "";


        let imageName =
            "";


        /*
         * Compress image before upload.
         *
         * This version aggressively limits the size
         * to make Apps Script requests more reliable.
         */

        if (
            imageFile
        ) {

            const compressed =
                await compressImage(
                    imageFile
                );


            imageData =
                compressed.dataUrl;


            imageType =
                compressed.mimeType;


            imageName =
                compressed.fileName;

        }


        /*
         * POST TO APPS SCRIPT
         */

        const response =
            await fetch(

                APPS_SCRIPT_URL,

                {

                    method:
                        "POST",

                    headers: {

                        /*
                         * text/plain avoids a browser CORS
                         * preflight for Apps Script.
                         */

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "sendMessage",

                            email:
                                currentUser.email,

                            receiver:
                                otherUsername,

                            message:
                                text,

                            attachmentType:
                                imageData
                                    ? "image"
                                    : "",

                            attachmentData:
                                imageData,

                            attachmentMime:
                                imageType,

                            attachmentName:
                                imageName

                        })

                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Could not send the message."
            );

        }


        /*
         * Server confirmed it.
         * Remove temporary Sending... row.
         */

        if (
            optimisticElement &&
            optimisticElement.isConnected
        ) {

            optimisticElement.remove();

        }


        input.value =
            "";


        resetTextareaHeight();


        removeSelectedImage();


        /*
         * Immediately get authoritative server data.
         */

        await loadMessages();

    }

    catch (
        error
    ) {

        console.error(
            "Send message error:",
            error
        );


        if (
            optimisticElement &&
            optimisticElement.isConnected
        ) {

            optimisticElement.remove();

        }


        alert(
            error &&
            error.message
                ? error.message
                : "The message could not be sent."
        );

    }

    finally {

        sendInProgress =
            false;


        button.disabled =
            false;


        button.textContent =
            "Send";


        input.focus();

    }

}


/* =========================================================
   IMAGE PICKER
========================================================= */

function openImagePicker() {

    document
        .getElementById(
            "imageInput"
        )
        .click();

}


document
    .getElementById(
        "imageInput"
    )
    .addEventListener(
        "change",
        handleImageSelection
    );


function handleImageSelection(
    event
) {

    const file =
        event.target.files &&
        event.target.files[0];


    if (
        !file
    ) {

        return;

    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Please choose an image file."
        );


        event.target.value =
            "";

        return;

    }


    /*
     * Don't let enormous originals get processed.
     */

    if (
        file.size >
        15 * 1024 * 1024
    ) {

        alert(
            "Please choose an image smaller than 15 MB."
        );


        event.target.value =
            "";

        return;

    }


    selectedImage =
        file;


    const reader =
        new FileReader();


    reader.onload =
        function() {

            document
                .getElementById(
                    "previewImage"
                )
                .src =
                reader.result;


            document
                .getElementById(
                    "imagePreview"
                )
                .style.display =
                "block";

        };


    reader.readAsDataURL(
        file
    );

}


/* =========================================================
   REMOVE SELECTED IMAGE
========================================================= */

function removeSelectedImage() {

    selectedImage =
        null;


    document
        .getElementById(
            "imageInput"
        )
        .value =
        "";


    document
        .getElementById(
            "previewImage"
        )
        .src =
        "";


    document
        .getElementById(
            "imagePreview"
        )
        .style.display =
        "none";

}


/* =========================================================
   IMAGE COMPRESSION
========================================================= */

function compressImage(
    file
) {

    return new Promise(

        function(
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onerror =
                function() {

                    reject(
                        new Error(
                            "Could not read image."
                        )
                    );

                };


            reader.onload =
                function() {

                    const image =
                        new Image();


                    image.onerror =
                        function() {

                            reject(
                                new Error(
                                    "Could not process image."
                                )
                            );

                        };


                    image.onload =
                        function() {

                            /*
                             * Smaller than the previous 1600px
                             * version to keep Apps Script requests
                             * manageable.
                             */

                            const MAX_SIZE =
                                900;


                            let width =
                                image.width;


                            let height =
                                image.height;


                            if (
                                width >
                                    MAX_SIZE ||
                                height >
                                    MAX_SIZE
                            ) {

                                if (
                                    width >
                                        height
                                ) {

                                    height =
                                        Math.round(
                                            height *
                                            (
                                                MAX_SIZE /
                                                width
                                            )
                                        );

                                    width =
                                        MAX_SIZE;

                                }

                                else {

                                    width =
                                        Math.round(
                                            width *
                                            (
                                                MAX_SIZE /
                                                height
                                            )
                                        );

                                    height =
                                        MAX_SIZE;

                                }

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const context =
                                canvas.getContext(
                                    "2d"
                                );


                            if (
                                !context
                            ) {

                                reject(
                                    new Error(
                                        "Could not create image canvas."
                                    )
                                );

                                return;

                            }


                            context.drawImage(

                                image,

                                0,
                                0,

                                width,
                                height

                            );


                            /*
                             * Start with 0.65 quality.
                             */

                            let quality =
                                0.65;


                            let dataUrl =
                                canvas.toDataURL(

                                    "image/jpeg",

                                    quality

                                );


                            /*
                             * Keep compressing until the
                             * Base64 string is reasonably small.
                             */

                            while (
                                dataUrl.length >
                                    900000 &&
                                quality >
                                    0.35
                            ) {

                                quality -=
                                    0.05;


                                dataUrl =
                                    canvas.toDataURL(

                                        "image/jpeg",

                                        quality

                                    );

                            }


                            /*
                             * Final safety limit.
                             */

                            if (
                                dataUrl.length >
                                1200000
                            ) {

                                reject(
                                    new Error(
                                        "This image is still too large. Please choose a smaller photo."
                                    )
                                );

                                return;

                            }


                            resolve({

                                dataUrl:
                                    dataUrl,

                                mimeType:
                                    "image/jpeg",

                                fileName:
                                    "photo-" +
                                    Date.now() +
                                    ".jpg"

                            });

                        };


                    image.src =
                        reader.result;

                };


            reader.readAsDataURL(
                file
            );

        }

    );

}


function fileToDataURL(
    file
) {

    return new Promise(

        function(
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onload =
                function() {

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }

    );

}


/* =========================================================
   TEXTBOX
========================================================= */

function setupMessageInput() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    input.addEventListener(
        "input",
        function() {

            autoResizeTextarea(
                input
            );

        }
    );


    input.addEventListener(
        "keydown",
        function(event) {

            /*
             * Enter sends.
             *
             * Shift + Enter = new line.
             */

            if (
                event.key ===
                    "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    sendButton.addEventListener(
        "click",
        sendMessage
    );

}


function autoResizeTextarea(
    input
) {

    input.style.height =
        "auto";


    const maxHeight =
        window.innerWidth <=
            600
            ? 120
            : 140;


    input.style.height =
        Math.min(
            input.scrollHeight,
            maxHeight
        ) +
        "px";

}


function resetTextareaHeight() {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.style.height =
        window.innerWidth <=
            600
            ? "42px"
            : "44px";

}


/* =========================================================
   USER SCROLL
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const container =
            document.getElementById(
                "messages"
            );


        container.addEventListener(
            "scroll",
            function() {

                const distance =
                    container.scrollHeight -
                    container.scrollTop -
                    container.clientHeight;


                if (
                    distance >
                    180
                ) {

                    container.dataset.userScrolled =
                        "true";

                }

                else {

                    delete container.dataset.userScrolled;

                }

            }
        );

    }
);


/* =========================================================
   HELPERS
========================================================= */

function normalizeUsername(
    username
) {

    return String(
        username ||
        ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /^@/,
        ""
    );

}


function normalizeEmail(
    email
) {

    return String(
        email ||
        ""
    )
    .trim()
    .toLowerCase();

}


function escapeHtml(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeJs(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\r/g,
        "\\r"
    )
    .replace(
        /\n/g,
        "\\n"
    );

}


/* =========================================================
   OPEN IMAGE
========================================================= */

function openImage(
    url
) {

    window.open(
        url,
        "_blank"
    );

}
