<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Writejot | Chat</title>


    <style>

        * {
            box-sizing: border-box;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        html,
        body {

            margin: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f6f8fc;

            color:
                #1f2937;
        }


        /* =====================================================
           CHAT INTERFACE
        ===================================================== */

        #chatInterface {

            width: 100%;

            height: 100dvh;

            display: flex;

            flex-direction: column;

            min-height: 0;

            overflow: hidden;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            flex: 0 0 64px;

            width: 100%;

            height: 64px;

            background: white;

            border-bottom:
                1px solid #e5e7eb;

            display: flex;

            align-items: center;

            gap: 12px;

            padding:
                0 16px;

            position: relative;

            z-index: 20;
        }


        .back {

            color:
                #4285F4;

            text-decoration:
                none;

            font-weight:
                700;

            font-size:
                14px;

            white-space:
                nowrap;
        }


        .recipient {

            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;
        }


        .recipient img {

            width: 40px;

            height: 40px;

            flex: 0 0 40px;

            border-radius: 50%;

            object-fit: cover;

            background:
                #e9eef5;

            border:
                1px solid #dbe2ea;
        }


        .recipient-info {

            min-width: 0;
        }


        .recipient-name {

            font-size:
                15px;

            font-weight:
                700;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }


        .recipient-username {

            color:
                #6b7280;

            font-size:
                12px;
        }


        /* =====================================================
           SCROLLABLE CHAT AREA
        ===================================================== */

        #chatArea {

            flex: 1 1 0;

            min-height: 0;

            width: 100%;

            overflow-y: auto;

            overflow-x: hidden;

            -webkit-overflow-scrolling: touch;

            padding:
                18px;
        }


        #messages {

            width: 100%;

            max-width:
                850px;

            margin:
                0 auto;

            min-height: 0;
        }


        /* =====================================================
           MESSAGE ROW
        ===================================================== */

        .message-row {

            display: flex;

            width: 100%;

            align-items:
                flex-start;

            margin-bottom:
                10px;
        }


        .message-row.mine {

            justify-content:
                flex-end;
        }


        .message-row.theirs {

            justify-content:
                flex-start;
        }


        /* =====================================================
           MESSAGE CONTENT
        ===================================================== */

        .message-content {

            display: flex;

            flex-direction: column;

            width: fit-content;

            max-width: 70%;

            min-width: 0;

            align-items:
                flex-start;
        }


        .mine .message-content {

            align-items:
                flex-end;
        }


        /* =====================================================
           TEXT BUBBLE
        ===================================================== */

        .bubble {

            display: block;

            width: fit-content;

            max-width: 100%;

            min-width: 0;

            height: auto;

            min-height: 0;

            padding:
                9px 13px;

            margin: 0;

            border-radius:
                14px;

            font-size:
                14px;

            line-height:
                1.45;

            white-space:
                pre-wrap;

            overflow-wrap:
                anywhere;

            word-break:
                break-word;

            text-align:
                left;
        }


        .mine .bubble {

            background:
                #4285F4;

            color:
                white;

            border-bottom-right-radius:
                4px;
        }


        .theirs .bubble {

            background:
                white;

            color:
                #1f2937;

            border:
                1px solid #dfe3e8;

            border-bottom-left-radius:
                4px;
        }


        /* =====================================================
           SEND STATUS
        ===================================================== */

        .bubble.pending {

            opacity:
                0.55;
        }


        .bubble.failed {

            opacity:
                0.75;

            border:
                1px solid #ef4444 !important;
        }


        /* =====================================================
           TIME
        ===================================================== */

        .time {

            display: block;

            margin-top:
                3px;

            font-size:
                10px;

            line-height:
                1.2;

            color:
                #98a2b3;
        }


        .mine .time {

            text-align:
                right;
        }


        /* =====================================================
           IMAGE MESSAGE
        ===================================================== */

        .image-bubble {

            display: block;

            width: fit-content;

            max-width: 100%;

            padding:
                4px;

            overflow: hidden;
        }


        .message-image {

            display: block;

            width: auto;

            height: auto;

            max-width: min(
                100%,
                520px
            );

            max-height: 450px;

            border-radius:
                10px;

            cursor:
                pointer;
        }


        .image-caption {

            padding:
                7px 6px 4px;

            font-size:
                14px;

            line-height:
                1.45;

            white-space:
                pre-wrap;

            overflow-wrap:
                anywhere;

            word-break:
                break-word;
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty {

            min-height:
                240px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            color:
                #8a94a6;

            text-align:
                center;
        }


        /* =====================================================
           COMPOSER
        ===================================================== */

        #composer {

            flex: 0 0 auto;

            width: 100%;

            background:
                white;

            border-top:
                1px solid #e5e7eb;

            padding:
                10px 12px 12px;

            position: relative;

            z-index: 30;
        }


        .composer-inner {

            width: 100%;

            max-width:
                850px;

            margin:
                0 auto;

            display: flex;

            align-items:
                flex-end;

            gap:
                7px;
        }


        /* =====================================================
           PHOTO BUTTON
        ===================================================== */

        #photoButton {

            width:
                42px;

            height:
                42px;

            flex:
                0 0 42px;

            border:
                1px solid #d7dce3;

            border-radius:
                10px;

            background:
                white;

            cursor:
                pointer;

            font-size:
                19px;

            display: flex;

            align-items:
                center;

            justify-content:
                center;
        }


        #photoButton:hover {

            background:
                #f4f7fb;
        }


        #imageInput {

            display:
                none;
        }


        /* =====================================================
           MESSAGE INPUT
        ===================================================== */

        #messageInput {

            flex:
                1 1 auto;

            min-width:
                0;

            width:
                100%;

            min-height:
                42px;

            max-height:
                125px;

            resize:
                none;

            overflow-y:
                auto;

            padding:
                10px 12px;

            border:
                1px solid #d7dce3;

            border-radius:
                10px;

            outline:
                none;

            background:
                white;

            color:
                #1f2937;

            font-family:
                inherit;

            font-size:
                14px;

            line-height:
                20px;
        }


        #messageInput:focus {

            border-color:
                #4285F4;

            box-shadow:
                0 0 0 3px
                rgba(
                    66,
                    133,
                    244,
                    0.08
                );
        }


        /* =====================================================
           SEND BUTTON
        ===================================================== */

        #sendButton {

            flex:
                0 0 auto;

            height:
                42px;

            min-width:
                62px;

            padding:
                0 16px;

            border:
                none;

            border-radius:
                10px;

            background:
                #4285F4;

            color:
                white;

            font-weight:
                700;

            cursor:
                pointer;

            white-space:
                nowrap;
        }


        #sendButton:hover {

            background:
                #3367d6;
        }


        #sendButton:disabled {

            opacity:
                0.65;

            cursor:
                not-allowed;
        }


        /* =====================================================
           IMAGE PREVIEW
        ===================================================== */

        #imagePreview {

            display:
                none;

            width: 100%;

            max-width:
                850px;

            margin:
                0 auto 8px;
        }


        .preview-box {

            position:
                relative;

            display:
                inline-block;
        }


        #previewImage {

            display:
                block;

            width:
                auto;

            height:
                auto;

            max-width:
                170px;

            max-height:
                120px;

            border-radius:
                10px;

            border:
                1px solid #d7dce3;
        }


        #removeImageButton {

            position:
                absolute;

            top:
                -7px;

            right:
                -7px;

            width:
                23px;

            height:
                23px;

            border:
                none;

            border-radius:
                50%;

            background:
                #ef4444;

            color:
                white;

            cursor:
                pointer;

            font-size:
                15px;

            line-height:
                23px;

            padding:
                0;
        }


        /* =====================================================
           LOCK SCREEN
        ===================================================== */

        .lock-screen {

            width:
                100%;

            height:
                100dvh;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                30px;

            background:
                #f6f8fc;
        }


        .lock-card {

            max-width:
                500px;

            width:
                100%;

            background:
                white;

            border:
                1px solid #e1e6ee;

            border-radius:
                16px;

            padding:
                35px;

            text-align:
                center;
        }


        .lock-card p {

            color:
                #718096;

            line-height:
                1.6;
        }


        .button {

            display:
                inline-block;

            padding:
                11px 17px;

            background:
                #4285F4;

            color:
                white;

            text-decoration:
                none;

            border-radius:
                9px;

            font-weight:
                600;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            header {

                flex:
                    0 0 58px;

                height:
                    58px;

                padding:
                    0 11px;
            }


            .back {

                font-size:
                    13px;
            }


            .recipient img {

                width:
                    38px;

                height:
                    38px;

                flex-basis:
                    38px;
            }


            .recipient-name {

                max-width:
                    180px;
            }


            #chatArea {

                flex:
                    1 1 0;

                min-height:
                    0;

                padding:
                    14px 11px 16px;

                overflow-y:
                    auto;
            }


            .message-content {

                max-width:
                    82%;
            }


            .bubble {

                font-size:
                    14px;

                padding:
                    9px 12px;
            }


            .message-image {

                max-width:
                    100%;

                max-height:
                    360px;
            }


            #composer {

                flex:
                    0 0 auto;

                padding:
                    8px;
            }


            .composer-inner {

                gap:
                    6px;
            }


            #photoButton {

                width:
                    42px;

                height:
                    42px;

                flex-basis:
                    42px;
            }


            #messageInput {

                min-height:
                    42px;

                max-height:
                    120px;

                padding:
                    10px 11px;
            }


            #sendButton {

                height:
                    42px;

                min-width:
                    56px;

                padding:
                    0 12px;
            }

        }

    </style>

</head>



<body>


<!-- ========================================================
     LOCK SCREEN
========================================================= -->

<div
    id="lockScreen"
    class="lock-screen"
    style="display:none;"
>

    <div
        class="lock-card"
    >

        <div
            style="
                font-size:45px;
                margin-bottom:10px;
            "
        >
            🔒
        </div>


        <h1>
            Chat unavailable
        </h1>


        <p>
            Your Writejot access has expired.
            Renew your subscription to continue
            messaging.
        </p>


        <a
            class="button"
            href="index.html"
        >
            Back to Dashboard
        </a>

    </div>

</div>



<!-- ========================================================
     CHAT INTERFACE
========================================================= -->

<div
    id="chatInterface"
>


    <!-- ====================================================
         HEADER
    ===================================================== -->

    <header>

        <a
            href="messages.html"
            class="back"
        >
            ← Messages
        </a>


        <div
            class="recipient"
        >

            <img
                id="recipientPicture"
                src="W.png"
                alt="Profile picture"
            >


            <div
                class="recipient-info"
            >

                <div
                    id="recipientName"
                    class="recipient-name"
                >
                    Loading...
                </div>


                <div
                    id="recipientUsername"
                    class="recipient-username"
                >
                    @username
                </div>

            </div>

        </div>

    </header>



    <!-- ====================================================
         SCROLLABLE MESSAGE AREA
    ===================================================== -->

    <main
        id="chatArea"
    >

        <div
            id="messages"
        >

            <div
                class="empty"
            >
                Loading messages...
            </div>

        </div>

    </main>



    <!-- ====================================================
         MESSAGE COMPOSER
    ===================================================== -->

    <div
        id="composer"
    >


        <!-- IMAGE PREVIEW -->

        <div
            id="imagePreview"
        >

            <div
                class="preview-box"
            >

                <img
                    id="previewImage"
                    src=""
                    alt="Selected image"
                >


                <button
                    id="removeImageButton"
                    type="button"
                    onclick="removeSelectedImage()"
                >
                    ×
                </button>

            </div>

        </div>



        <!-- COMPOSER -->

        <div
            class="composer-inner"
        >


            <button
                id="photoButton"
                type="button"
                onclick="openImagePicker()"
                title="Send photo"
            >
                📷
            </button>


            <input
                id="imageInput"
                type="file"
                accept="image/*"
                onchange="handleImageSelection(event)"
            >


            <textarea
                id="messageInput"
                maxlength="2000"
                rows="1"
                placeholder="Type a message..."
            ></textarea>


            <button
                id="sendButton"
                type="button"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>

    </div>

</div>



<script>


/* =========================================================
   CONFIG
========================================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


const ACCESS_CACHE_TIME =
    5 * 60 * 1000;


let currentUser = null;

let otherUsername = "";

let messages = [];

let selectedImage = null;

let lastFingerprint = "";

let refreshTimer = null;



/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    async function () {

        const saved =
            localStorage.getItem(
                "writejotUser"
            );


        if (!saved) {

            window.location.href =
                "index.html";

            return;

        }


        try {

            currentUser =
                JSON.parse(
                    saved
                );

        }

        catch {

            window.location.href =
                "index.html";

            return;

        }


        const params =
            new URLSearchParams(
                window.location.search
            );


        otherUsername =
            normalizeUsername(
                params.get(
                    "username"
                )
            );


        if (!otherUsername) {

            window.location.href =
                "messages.html";

            return;

        }


        /*
         * Cache first.
         */

        loadChatCache();


        /*
         * Prepare input immediately.
         */

        setupInput();


        /*
         * Access check.
         */

        const cachedAccess =
            getCachedAccess();


        if (
            cachedAccess &&
            cachedAccess.access === true
        ) {

            startBackgroundWork();

        }

        else {

            verifyAccessInBackground();

        }

    }
);



/* =========================================================
   ACCESS CACHE
========================================================= */

function accessCacheKey() {

    return (
        "writejot_access_" +
        String(
            currentUser.email
        )
        .trim()
        .toLowerCase()
    );

}


function getCachedAccess() {

    try {

        const raw =
            localStorage.getItem(
                accessCacheKey()
            );


        if (!raw) {

            return null;

        }


        const data =
            JSON.parse(
                raw
            );


        if (
            Date.now() -
            Number(
                data.checkedAt || 0
            )
            >
            ACCESS_CACHE_TIME
        ) {

            return null;

        }


        return data;

    }

    catch {

        return null;

    }

}


function saveAccessCache(
    result
) {

    try {

        localStorage.setItem(

            accessCacheKey(),

            JSON.stringify({

                access:
                    result.access === true,

                status:
                    result.status ||
                    "",

                checkedAt:
                    Date.now()

            })

        );

    }

    catch {}

}



/* =========================================================
   BACKGROUND ACCESS
========================================================= */

async function verifyAccessInBackground() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=access&email=" +
                encodeURIComponent(
                    currentUser.email
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        saveAccessCache(
            result
        );


        if (
            !result.success ||
            !result.access
        ) {

            showLocked();

            return;

        }


        startBackgroundWork();

    }

    catch {

        if (
            !getCachedAccess()
        ) {

            showLocked();

        }

    }

}



/* =========================================================
   BACKGROUND WORK
========================================================= */

function startBackgroundWork() {

    markReadInBackground();

    refreshChat();


    if (refreshTimer) {

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer =
        setInterval(
            refreshChat,
            5000
        );

}



/* =========================================================
   CHAT CACHE
========================================================= */

function chatCacheKey() {

    return (
        "writejot_chat_" +
        String(
            currentUser.email
        )
        .trim()
        .toLowerCase() +
        "_" +
        otherUsername
    );

}


function loadChatCache() {

    try {

        const raw =
            localStorage.getItem(
                chatCacheKey()
            );


        if (!raw) {

            return;

        }


        const data =
            JSON.parse(
                raw
            );


        if (
            !data ||
            !Array.isArray(
                data.messages
            )
        ) {

            return;

        }


        messages =
            data.messages;


        if (
            data.profile
        ) {

            applyRecipient(
                data.profile
            );

        }


        lastFingerprint =
            JSON.stringify(
                messages
            );


        renderMessages(
            messages,
            false
        );

    }

    catch {}

}


function saveChatCache(
    profile
) {

    try {

        localStorage.setItem(

            chatCacheKey(),

            JSON.stringify({

                messages:
                    messages.slice(
                        -200
                    ),

                profile:
                    profile ||
                    getCurrentProfile()

            })

        );

    }

    catch {}

}


function getCurrentProfile() {

    return {

        name:
            document
                .getElementById(
                    "recipientName"
                )
                .textContent,

        username:
            otherUsername,

        profilePicture:
            document
                .getElementById(
                    "recipientPicture"
                )
                .src

    };

}



/* =========================================================
   REFRESH CHAT
========================================================= */

async function refreshChat() {

    try {

        /*
         * Request profile and messages
         * at the same time.
         */

        const profileRequest =
            fetch(

                APPS_SCRIPT_URL +
                "?action=profile&username=" +
                encodeURIComponent(
                    otherUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const messagesRequest =
            fetch(

                APPS_SCRIPT_URL +
                "?action=messages" +
                "&email=" +
                encodeURIComponent(
                    currentUser.email
                ) +
                "&username=" +
                encodeURIComponent(
                    otherUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const [

            profileResponse,

            messageResponse

        ] =
            await Promise.all([

                profileRequest,

                messagesRequest

            ]);


        const profileResult =
            await profileResponse.json();


        const messageResult =
            await messageResponse.json();


        /*
         * Access was revoked.
         */

        if (
            profileResult.accessDenied ||
            messageResult.accessDenied
        ) {

            saveAccessCache({

                access: false,

                status:
                    messageResult.status ||
                    profileResult.status ||
                    "expired"

            });


            showLocked();

            return;

        }


        /*
         * Update profile.
         */

        if (
            profileResult.success &&
            profileResult.profile
        ) {

            applyRecipient(
                profileResult.profile
            );

        }


        if (
            !messageResult.success
        ) {

            return;

        }


        const serverMessages =
            messageResult.messages ||
            [];


        /*
         * Preserve messages that are
         * still being sent.
         */

        const pending =
            messages.filter(
                function (message) {

                    return message.pending;

                }
            );


        const failed =
            messages.filter(
                function (message) {

                    return message.failed;

                }
            );


        const merged =
            serverMessages
                .concat(pending)
                .concat(failed);


        const nextFingerprint =
            JSON.stringify(
                merged
            );


        if (
            nextFingerprint ===
            lastFingerprint
        ) {

            return;

        }


        messages =
            merged;


        lastFingerprint =
            nextFingerprint;


        saveChatCache(
            profileResult.profile
        );


        renderMessages(
            messages,
            true
        );

    }

    catch {

        console.log(
            "Background refresh failed."
        );

    }

}



/* =========================================================
   RECIPIENT
========================================================= */

function applyRecipient(
    profile
) {

    document
        .getElementById(
            "recipientName"
        )
        .textContent =
        profile.name ||
        "Writejot User";


    document
        .getElementById(
            "recipientUsername"
        )
        .textContent =
        "@" +
        (
            profile.username ||
            otherUsername
        );


    document
        .getElementById(
            "recipientPicture"
        )
        .src =
        profile.profilePicture ||
        "W.png";


    document
        .getElementById(
            "recipientPicture"
        )
        .onerror =
        function () {

            this.src =
                "W.png";

        };

}



/* =========================================================
   MARK READ
========================================================= */

async function markReadInBackground() {

    try {

        await fetch(

            APPS_SCRIPT_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify({

                        action:
                            "markConversationRead",

                        email:
                            currentUser.email,

                        username:
                            otherUsername

                    })

            }

        );

    }

    catch {}

}



/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(
    list,
    scrollToBottom
) {

    const container =
        document.getElementById(
            "messages"
        );


    if (
        !list.length
    ) {

        container.innerHTML =

            `
            <div class="empty">

                <div
                    style="
                        font-size:38px;
                        margin-bottom:8px;
                    "
                >
                    💬
                </div>

                No messages yet.

                <br>

                Say hello!

            </div>
            `;


        return;

    }


    const currentUsername =
        normalizeUsername(
            currentUser.username
        );


    container.innerHTML =
        list
            .map(
                function (message) {

                    const mine =
                        normalizeUsername(
                            message.sender
                        ) ===
                        currentUsername;


                    const time =
                        message.timestamp
                            ? new Date(
                                message.timestamp
                              )
                              .toLocaleTimeString(
                                [],
                                {
                                    hour:
                                        "numeric",

                                    minute:
                                        "2-digit"
                                }
                              )
                            : "";


                    const stateClass =
                        message.pending
                            ? "pending"
                            : message.failed
                                ? "failed"
                                : "";


                    /*
                     * IMAGE
                     */

                    if (
                        message.attachmentType ===
                            "image" &&
                        message.attachmentUrl
                    ) {

                        return `

                            <div
                                class="
                                    message-row
                                    ${
                                        mine
                                            ? "mine"
                                            : "theirs"
                                    }
                                "
                            >

                                <div
                                    class="
                                        message-content
                                    "
                                >

                                    <div
                                        class="
                                            bubble
                                            image-bubble
                                            ${stateClass}
                                        "
                                    >

                                        <img
                                            class="
                                                message-image
                                            "
                                            src="${escapeHtml(
                                                message.attachmentUrl
                                            )}"
                                            loading="lazy"
                                            onclick="openImage(
                                                '${escapeHtml(
                                                    message.attachmentUrl
                                                )}'
                                            )"
                                            alt="Photo"
                                        >


                                        ${
                                            message.message
                                                ? `
                                                    <div
                                                        class="
                                                            image-caption
                                                        "
                                                    >
                                                        ${escapeHtml(
                                                            message.message
                                                        )}
                                                    </div>
                                                  `
                                                : ""
                                        }

                                    </div>


                                    <div
                                        class="time"
                                    >

                                        ${
                                            message.pending
                                                ? "Sending..."
                                                : message.failed
                                                    ? "Failed to send"
                                                    : escapeHtml(
                                                        time
                                                    )
                                        }

                                    </div>

                                </div>

                            </div>

                        `;

                    }


                    /*
                     * TEXT
                     */

                    return `

                        <div
                            class="
                                message-row
                                ${
                                    mine
                                        ? "mine"
                                        : "theirs"
                                }
                            "
                        >

                            <div
                                class="
                                    message-content
                                "
                            >

                                <div
                                    class="
                                        bubble
                                        ${stateClass}
                                    "
                                >

                                    ${escapeHtml(
                                        message.message ||
                                        ""
                                    )}

                                </div>


                                <div
                                    class="time"
                                >

                                    ${
                                        message.pending
                                            ? "Sending..."
                                            : message.failed
                                                ? "Failed to send"
                                                : escapeHtml(
                                                    time
                                                )
                                    }

                                </div>

                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    /*
     * Only scroll after a real update.
     */

    if (
        scrollToBottom
    ) {

        requestAnimationFrame(
            function () {

                const area =
                    document.getElementById(
                        "chatArea"
                    );


                area.scrollTop =
                    area.scrollHeight;

            }
        );

    }

}



/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const text =
        input.value.trim();


    if (
        !text &&
        !selectedImage
    ) {

        return;

    }


    /* =====================================================
       TEXT MESSAGE
    ===================================================== */

    if (
        !selectedImage
    ) {

        const temporaryId =
            "temp_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2);


        const optimisticMessage = {

            id:
                temporaryId,

            sender:
                normalizeUsername(
                    currentUser.username
                ),

            receiver:
                otherUsername,

            message:
                text,

            timestamp:
                new Date()
                    .toISOString(),

            attachmentType:
                "",

            attachmentUrl:
                "",

            pending:
                true

        };


        /*
         * Show instantly.
         */

        messages.push(
            optimisticMessage
        );


        lastFingerprint =
            JSON.stringify(
                messages
            );


        renderMessages(
            messages,
            true
        );


        saveChatCache();


        /*
         * Clear input instantly.
         */

        input.value =
            "";


        input.style.height =
            "42px";


        button.disabled =
            true;


        try {

            const response =
                await fetch(

                    APPS_SCRIPT_URL,

                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "text/plain;charset=utf-8"

                        },

                        body:
                            JSON.stringify({

                                action:
                                    "sendMessage",

                                email:
                                    currentUser.email,

                                receiver:
                                    otherUsername,

                                message:
                                    text

                            })

                    }

                );


            const result =
                await response.json();


            if (
                result.accessDenied
            ) {

                showLocked();

                return;

            }


            if (
                !result.success
            ) {

                throw new Error(
                    result.error ||
                    "Message failed to send."
                );

            }


            /*
             * Remove temporary message.
             */

            messages =
                messages.filter(
                    function (message) {

                        return (
                            message.id !==
                            temporaryId
                        );

                    }
                );


            lastFingerprint =
                "";


            await refreshChat();

        }

        catch (error) {

            messages =
                messages.map(
                    function (message) {

                        if (
                            message.id ===
                            temporaryId
                        ) {

                            return {

                                ...message,

                                pending:
                                    false,

                                failed:
                                    true

                            };

                        }


                        return message;

                    }
                );


            lastFingerprint =
                JSON.stringify(
                    messages
                );


            renderMessages(
                messages,
                false
            );


            saveChatCache();

            console.error(
                error
            );

        }

        finally {

            button.disabled =
                false;

            input.focus();

        }


        return;

    }


    /* =====================================================
       IMAGE MESSAGE
    ===================================================== */

    button.disabled =
        true;


    button.textContent =
        "Uploading...";


    try {

        const compressed =
            await compressImage(
                selectedImage
            );


        const response =
            await fetch(

                APPS_SCRIPT_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "sendMessage",

                            email:
                                currentUser.email,

                            receiver:
                                otherUsername,

                            message:
                                text,

                            attachmentType:
                                "image",

                            attachmentData:
                                compressed.dataUrl,

                            attachmentMime:
                                compressed.mimeType,

                            attachmentName:
                                compressed.fileName

                        })

                }

            );


        const result =
            await response.json();


        if (
            result.accessDenied
        ) {

            showLocked();

            return;

        }


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Photo failed to send."
            );

        }


        input.value =
            "";


        input.style.height =
            "42px";


        removeSelectedImage();


        lastFingerprint =
            "";


        await refreshChat();

    }

    catch (error) {

        alert(
            error.message ||
            "Could not send photo."
        );

    }

    finally {

        button.disabled =
            false;

        button.textContent =
            "Send";

        input.focus();

    }

}



/* =========================================================
   INPUT
========================================================= */

function setupInput() {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.addEventListener(
        "input",
        function () {

            input.style.height =
                "auto";


            input.style.height =
                Math.min(
                    input.scrollHeight,
                    125
                ) +
                "px";

        }
    );


    input.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key ===
                    "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );

}



/* =========================================================
   IMAGE PICKER
========================================================= */

function openImagePicker() {

    document
        .getElementById(
            "imageInput"
        )
        .click();

}


function handleImageSelection(
    event
) {

    const file =
        event.target.files &&
        event.target.files[0];


    if (!file) {

        return;

    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Please choose an image."
        );

        event.target.value =
            "";

        return;

    }


    if (
        file.size >
        10 * 1024 * 1024
    ) {

        alert(
            "Please choose an image smaller than 10 MB."
        );

        event.target.value =
            "";

        return;

    }


    selectedImage =
        file;


    const reader =
        new FileReader();


    reader.onload =
        function () {

            document
                .getElementById(
                    "previewImage"
                )
                .src =
                reader.result;


            document
                .getElementById(
                    "imagePreview"
                )
                .style.display =
                "block";

        };


    reader.readAsDataURL(
        file
    );

}


function removeSelectedImage() {

    selectedImage =
        null;


    document
        .getElementById(
            "imageInput"
        )
        .value =
        "";


    document
        .getElementById(
            "previewImage"
        )
        .src =
        "";


    document
        .getElementById(
            "imagePreview"
        )
        .style.display =
        "none";

}



/* =========================================================
   IMAGE COMPRESSION
========================================================= */

function compressImage(
    file
) {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onerror =
                reject;


            reader.onload =
                function () {

                    const image =
                        new Image();


                    image.onerror =
                        reject;


                    image.onload =
                        function () {

                            const maxSize =
                                1600;


                            let width =
                                image.width;


                            let height =
                                image.height;


                            if (
                                width >
                                maxSize ||
                                height >
                                maxSize
                            ) {

                                if (
                                    width >
                                    height
                                ) {

                                    height =
                                        Math.round(
                                            height *
                                            (
                                                maxSize /
                                                width
                                            )
                                        );


                                    width =
                                        maxSize;

                                }

                                else {

                                    width =
                                        Math.round(
                                            width *
                                            (
                                                maxSize /
                                                height
                                            )
                                        );


                                    height =
                                        maxSize;

                                }

                            }


                            const canvas =
                                document
                                    .createElement(
                                        "canvas"
                                    );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const context =
                                canvas
                                    .getContext(
                                        "2d"
                                    );


                            context.drawImage(

                                image,

                                0,
                                0,

                                width,
                                height

                            );


                            resolve({

                                dataUrl:
                                    canvas.toDataURL(
                                        "image/jpeg",
                                        0.82
                                    ),

                                mimeType:
                                    "image/jpeg",

                                fileName:
                                    "photo-" +
                                    Date.now() +
                                    ".jpg"

                            });

                        };


                    image.src =
                        reader.result;

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}



/* =========================================================
   LOCK
========================================================= */

function showLocked() {

    if (
        refreshTimer
    ) {

        clearInterval(
            refreshTimer
        );

    }


    document
        .getElementById(
            "chatInterface"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "lockScreen"
        )
        .style.display =
        "flex";

}



/* =========================================================
   HELPERS
========================================================= */

function normalizeUsername(
    value
) {

    return String(
        value ||
        ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /^@/,
        ""
    );

}


function escapeHtml(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function openImage(
    url
) {

    window.open(
        url,
        "_blank"
    );

}
