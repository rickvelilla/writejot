<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Writejot | Chat</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing:
        border-box;
}


html,
body {
    margin:
        0;

    width:
        100%;

    height:
        100%;
}


/* =========================================================
   BODY
========================================================= */

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f6f8fc;

    color:
        #1f2937;

    display:
        flex;

    flex-direction:
        column;

    overflow:
        hidden;
}


/* =========================================================
   HEADER
========================================================= */

header {

    background:
        white;

    border-bottom:
        1px solid #e5e7eb;

    padding:
        11px 6%;

    display:
        flex;

    align-items:
        center;

    gap:
        12px;

    flex:
        0 0 auto;

}


.back {

    color:
        #4285F4;

    text-decoration:
        none;

    font-weight:
        600;

    white-space:
        nowrap;

}


.recipient {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    min-width:
        0;

}


.recipient img {

    width:
        42px;

    height:
        42px;

    border-radius:
        50%;

    object-fit:
        cover;

    border:
        2px solid #4285F4;

    flex:
        0 0 42px;

}


.recipient-name {

    font-weight:
        700;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

}


.recipient-username {

    color:
        #4285F4;

    font-size:
        13px;

}


/* =========================================================
   MESSAGES
========================================================= */

#messages {

    flex:
        1 1 auto;

    min-height:
        0;

    overflow-y:
        auto;

    overflow-x:
        hidden;

    width:
        100%;

    max-width:
        850px;

    margin:
        0 auto;

    padding:
        25px 20px;

    scroll-behavior:
        smooth;

    overscroll-behavior:
        contain;

}


/* =========================================================
   MESSAGE ROW
========================================================= */

.message-row {

    display:
        flex;

    width:
        100%;

    margin-bottom:
        12px;

    align-items:
        flex-start;

}


.message-row.mine {

    justify-content:
        flex-end;

}


.message-row.theirs {

    justify-content:
        flex-start;

}


/* =========================================================
   BUBBLE
========================================================= */

.bubble-wrapper {

    display:
        flex;

    flex-direction:
        column;

    width:
        auto;

    max-width:
        70%;

    min-width:
        0;

    flex:
        0 0 auto;

}


.bubble {

    display:
        inline-block;

    width:
        fit-content;

    max-width:
        100%;

    height:
        auto;

    min-height:
        0;

    margin:
        0;

    padding:
        10px 14px;

    border-radius:
        15px;

    line-height:
        1.45;

    white-space:
        pre-wrap;

    overflow-wrap:
        anywhere;

    word-break:
        break-word;

    text-align:
        left;

}


.mine .bubble {

    background:
        #4285F4;

    color:
        white;

    border-bottom-right-radius:
        4px;

}


.theirs .bubble {

    background:
        white;

    color:
        #1f2937;

    border:
        1px solid #e1e6ee;

    border-bottom-left-radius:
        4px;

}


/* =========================================================
   OPTIMISTIC SENDING BUBBLE
========================================================= */

.sending-message {

    opacity:
        .72;

}


.sending-message .bubble {

    background:
        #8db6f8;

}


.sending-label {

    font-size:
        11px;

    color:
        #8a94a6;

    margin-top:
        4px;

    text-align:
        right;

}


/* =========================================================
   IMAGES
========================================================= */

.message-image {

    display:
        block;

    max-width:
        500px;

    max-height:
        500px;

    width:
        auto;

    height:
        auto;

    border-radius:
        12px;

    object-fit:
        contain;

    cursor:
        pointer;

    margin:
        0;

}


.image-message-bubble {

    padding:
        5px;

    overflow:
        hidden;

}


.image-message-bubble
.message-image {

    border-radius:
        10px;

}


/* =========================================================
   TIME
========================================================= */

.time {

    font-size:
        11px;

    opacity:
        .65;

    margin-top:
        4px;

}


.mine .time {

    text-align:
        right;

}


/* =========================================================
   EMPTY
========================================================= */

#empty {

    text-align:
        center;

    color:
        #718096;

    padding:
        40px;

}


/* =========================================================
   COMPOSER
========================================================= */

#composer {

    width:
        100%;

    background:
        white;

    border-top:
        1px solid #e5e7eb;

    padding:
        10px 14px;

    flex:
        0 0 auto;

}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

#imagePreview {

    display:
        none;

    width:
        100%;

    max-width:
        850px;

    margin:
        0 auto 8px;

    padding:
        0 0 2px;

}


.preview-wrapper {

    position:
        relative;

    display:
        inline-block;

}


#previewImage {

    display:
        block;

    width:
        auto;

    max-width:
        180px;

    max-height:
        140px;

    border-radius:
        10px;

    object-fit:
        cover;

    border:
        1px solid #d8dee8;

}


#removeImageButton {

    position:
        absolute;

    top:
        -8px;

    right:
        -8px;

    width:
        24px;

    height:
        24px;

    border:
        none;

    border-radius:
        50%;

    background:
        #ef4444;

    color:
        white;

    cursor:
        pointer;

    font-size:
        16px;

    line-height:
        24px;

    padding:
        0;

}


/* =========================================================
   COMPOSER INNER
========================================================= */

.composer-inner {

    width:
        100%;

    max-width:
        850px;

    margin:
        0 auto;

    display:
        flex;

    align-items:
        flex-end;

    gap:
        8px;

}


/* =========================================================
   PHOTO BUTTON
========================================================= */

#photoButton {

    width:
        44px;

    height:
        44px;

    flex:
        0 0 44px;

    border:
        1px solid #d8dee8;

    border-radius:
        9px;

    background:
        white;

    font-size:
        20px;

    cursor:
        pointer;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

}


#photoButton:hover {

    background:
        #f3f6fb;

}


#imageInput {

    display:
        none;

}


/* =========================================================
   TEXT INPUT
========================================================= */

#messageInput {

    flex:
        1 1 auto;

    min-width:
        0;

    width:
        100%;

    min-height:
        44px;

    max-height:
        140px;

    padding:
        11px 14px;

    border:
        1px solid #d8dee8;

    border-radius:
        9px;

    background:
        white;

    font-family:
        inherit;

    font-size:
        14px;

    outline:
        none;

    resize:
        none;

    overflow-y:
        auto;

}


#messageInput:focus {

    border-color:
        #4285F4;

    box-shadow:
        0 0 0 3px
        rgba(
            66,
            133,
            244,
            .08
        );

}


/* =========================================================
   SEND BUTTON
========================================================= */

#sendButton {

    flex:
        0 0 auto;

    min-height:
        44px;

    padding:
        0 18px;

    border:
        none;

    border-radius:
        9px;

    background:
        #4285F4;

    color:
        white;

    font-weight:
        600;

    cursor:
        pointer;

    white-space:
        nowrap;

}


#sendButton:hover {

    background:
        #3367d6;

}


#sendButton:disabled {

    opacity:
        .6;

    cursor:
        not-allowed;

}


/* =========================================================
   MOBILE
========================================================= */

@media (
    max-width: 600px
) {

    header {

        padding:
            10px 12px;

    }


    .back {

        font-size:
            13px;

    }


    .recipient img {

        width:
            38px;

        height:
            38px;

        flex-basis:
            38px;

    }


    .recipient-name {

        max-width:
            170px;

    }


    #messages {

        padding:
            18px 12px;

    }


    .bubble-wrapper {

        max-width:
            82%;

    }


    .message-image {

        max-width:
            100%;

        max-height:
            360px;

    }


    #composer {

        padding:
            8px 10px;

    }


    #imagePreview {

        padding:
            0 2px;

    }


    .composer-inner {

        gap:
            6px;

    }


    #messageInput {

        min-height:
            42px;

        max-height:
            120px;

        padding:
            10px 12px;

    }


    #photoButton {

        width:
            42px;

        height:
            42px;

        flex-basis:
            42px;

    }


    #sendButton {

        min-height:
            42px;

        padding:
            0 13px;

    }

}

</style>

</head>



<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <a
        href="messages.html"
        class="back"
    >
        ← Messages
    </a>


    <div
        class="recipient"
    >

        <img
            id="recipientPicture"
            src="W.png"
            alt="Profile picture"
        >


        <div>

            <div
                id="recipientName"
                class="recipient-name"
            >
                Loading...
            </div>


            <div
                id="recipientUsername"
                class="recipient-username"
            >
                @username
            </div>

        </div>

    </div>

</header>



<!-- =========================================================
     MESSAGE AREA
========================================================= -->

<div
    id="messages"
>

    <div
        id="empty"
    >
        Loading messages...
    </div>

</div>



<!-- =========================================================
     COMPOSER
========================================================= -->

<div
    id="composer"
>

    <div
        id="imagePreview"
    >

        <div
            class="preview-wrapper"
        >

            <img
                id="previewImage"
                src=""
                alt="Selected image"
            >


            <button
                id="removeImageButton"
                type="button"
                onclick="removeSelectedImage()"
            >
                ×
            </button>

        </div>

    </div>



    <div
        class="composer-inner"
    >

        <button
            id="photoButton"
            type="button"
            onclick="openImagePicker()"
            title="Send a photo"
        >
            📷
        </button>


        <input
            id="imageInput"
            type="file"
            accept="image/*"
            onchange="handleImageSelection(event)"
        >


        <textarea
            id="messageInput"
            maxlength="2000"
            placeholder="Write a message..."
            rows="1"
        ></textarea>


        <button
            id="sendButton"
            type="button"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>

</div>



<script>


/* =========================================================
   CONFIG
========================================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


let currentUser =
    null;


let otherUsername =
    "";


let refreshTimer =
    null;


let selectedImage =
    null;


let sendInProgress =
    false;


let loadRequestNumber =
    0;


let initialized =
    false;


/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener(
    "load",
    initializeChat
);


async function initializeChat() {

    const savedUser =
        localStorage.getItem(
            "writejotUser"
        );


    if (
        !savedUser
    ) {

        window.location.href =
            "index.html";

        return;

    }


    try {

        currentUser =
            JSON.parse(
                savedUser
            );

    }

    catch (
        error
    ) {

        window.location.href =
            "index.html";

        return;

    }


    const params =
        new URLSearchParams(
            window.location.search
        );


    otherUsername =
        normalizeUsername(
            params.get(
                "username"
            )
        );


    if (
        !otherUsername
    ) {

        window.location.href =
            "messages.html";

        return;

    }


    initialized =
        true;


    setupMessageInput();


    /*
     * Header can appear immediately
     * from local cache.
     */

    loadRecipientCache();


    /*
     * Load real conversation.
     */

    await refreshChat(
        true
    );


    startRefreshTimer();

}


/* =========================================================
   IMPORTANT:
   FIX BROWSER BACK/FORWARD CACHE
========================================================= */

window.addEventListener(
    "pageshow",
    async function(
        event
    ) {

        if (
            !initialized
        ) {

            return;

        }


        /*
         * A browser can restore the exact old DOM
         * instead of rebuilding the page.
         *
         * This means an old "Sending..." bubble
         * can appear even though the server already
         * saved the message.
         *
         * Refreshing the real conversation here
         * removes that stale DOM.
         */

        await refreshChat(
            true
        );

    }
);


/* =========================================================
   TAB VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "visible" &&
            initialized
        ) {

            refreshChat(
                true
            );

        }

    }
);


/* =========================================================
   WINDOW FOCUS
========================================================= */

window.addEventListener(
    "focus",
    function() {

        if (
            initialized
        ) {

            loadMessages();

        }

    }
);


/* =========================================================
   REFRESH CHAT
========================================================= */

async function refreshChat(
    markReadFirst
) {

    if (
        !currentUser ||
        !otherUsername
    ) {

        return;

    }


    const requestId =
        ++loadRequestNumber;


    try {

        if (
            markReadFirst
        ) {

            await Promise.all([

                loadRecipient(),

                markConversationRead()

            ]);

        }


        if (
            requestId !==
            loadRequestNumber
        ) {

            return;

        }


        await loadMessages();

    }

    catch (
        error
    ) {

        console.error(
            "Chat refresh error:",
            error
        );

    }

}


/* =========================================================
   AUTO REFRESH
========================================================= */

function startRefreshTimer() {

    if (
        refreshTimer
    ) {

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer =
        setInterval(

            function() {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    loadMessages();

                }

            },

            3000

        );

}


/* =========================================================
   RECIPIENT CACHE
========================================================= */

function getRecipientCacheKey() {

    return (
        "writejot_chat_recipient_" +
        otherUsername
    );

}


function loadRecipientCache() {

    try {

        const raw =
            localStorage.getItem(
                getRecipientCacheKey()
            );


        if (
            !raw
        ) {

            return;

        }


        const profile =
            JSON.parse(
                raw
            );


        applyRecipientProfile(
            profile
        );

    }

    catch (
        error
    ) {

        console.log(
            "Recipient cache unavailable."
        );

    }

}


function saveRecipientCache(
    profile
) {

    try {

        localStorage.setItem(

            getRecipientCacheKey(),

            JSON.stringify(
                profile
            )

        );

    }

    catch (
        error
    ) {}

}


/* =========================================================
   RECIPIENT
========================================================= */

async function loadRecipient() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=profile&username=" +
                encodeURIComponent(
                    otherUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !result.success ||
            !result.profile
        ) {

            document
                .getElementById(
                    "recipientName"
                )
                .textContent =
                "User not found";


            document
                .getElementById(
                    "recipientUsername"
                )
                .textContent =
                "@" +
                otherUsername;


            return;

        }


        applyRecipientProfile(
            result.profile
        );


        saveRecipientCache(
            result.profile
        );

    }

    catch (
        error
    ) {

        console.error(
            "Recipient loading error:",
            error
        );


        /*
         * Do not destroy a cached name just
         * because the server is temporarily slow.
         */

        const name =
            document
                .getElementById(
                    "recipientName"
                );


        if (
            !name.textContent ||
            name.textContent ===
                "Loading..."
        ) {

            name.textContent =
                "Writejot User";

        }


        document
            .getElementById(
                "recipientUsername"
            )
            .textContent =
            "@" +
            otherUsername;

    }

}


function applyRecipientProfile(
    profile
) {

    document
        .getElementById(
            "recipientName"
        )
        .textContent =
        profile.name ||
        "Writejot User";


    document
        .getElementById(
            "recipientUsername"
        )
        .textContent =
        "@" +
        (
            profile.username ||
            otherUsername
        );


    const picture =
        profile.profilePicture ||
        "W.png";


    document
        .getElementById(
            "recipientPicture"
        )
        .src =
        picture;


    document
        .getElementById(
            "recipientPicture"
        )
        .onerror =
        function() {

            this.src =
                "W.png";

        };

}


/* =========================================================
   MARK CONVERSATION READ
========================================================= */

async function markConversationRead() {

    try {

        await fetch(

            APPS_SCRIPT_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify({

                        action:
                            "markConversationRead",

                        email:
                            currentUser.email,

                        username:
                            otherUsername

                    })

            }

        );

    }

    catch (
        error
    ) {

        console.error(
            "Read status error:",
            error
        );

    }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=messages" +
                "&email=" +
                encodeURIComponent(
                    currentUser.email
                ) +
                "&username=" +
                encodeURIComponent(
                    otherUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !result.success
        ) {

            showMessageError(
                result.error ||
                "Could not load messages."
            );


            return;

        }


        /*
         * This completely replaces the message
         * DOM with the authoritative server data.
         *
         * Therefore an old "Sending..." bubble
         * cannot survive a successful refresh.
         */

        renderMessages(
            result.messages ||
            []
        );

    }

    catch (
        error
    ) {

        console.error(
            "Message loading error:",
            error
        );


        /*
         * Don't replace working messages with an
         * error just because a background request failed.
         */

    }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(
    messages
) {

    const container =
        document.getElementById(
            "messages"
        );


    /*
     * Determine whether user is near bottom
     * before replacing the DOM.
     */

    const distanceFromBottom =
        container.scrollHeight -
        container.scrollTop -
        container.clientHeight;


    const wasNearBottom =
        distanceFromBottom <
        140;


    if (
        !messages.length
    ) {

        container.innerHTML =

            `
            <div id="empty">
                No messages yet. Say hello!
            </div>
            `;


        return;

    }


    const currentUsername =
        normalizeUsername(
            currentUser.username
        );


    container.innerHTML =
        messages
            .map(
                function(
                    message
                ) {

                    return buildMessageHtml(
                        message,
                        currentUsername
                    );

                }
            )
            .join("");


    /*
     * After rendering the real server messages,
     * move to the newest messages when appropriate.
     */

    requestAnimationFrame(
        function() {

            if (
                wasNearBottom ||
                !container.dataset.userScrolled
            ) {

                container.scrollTop =
                    container.scrollHeight;

            }

        }
    );

}


/* =========================================================
   BUILD REAL MESSAGE
========================================================= */

function buildMessageHtml(
    message,
    currentUsername
) {

    const mine =
        normalizeUsername(
            message.sender
        ) ===
        currentUsername;


    const time =
        message.timestamp

            ? new Date(
                message.timestamp
            ).toLocaleString()

            : "";


    let content =
        "";


    /*
     * IMAGE
     */

    if (
        message.attachmentType ===
            "image" &&
        message.attachmentUrl
    ) {

        content +=

            `
            <img
                class="message-image"
                src="${escapeHtml(
                    message.attachmentUrl
                )}"
                alt="Photo"
                loading="lazy"
                onclick="
                    openImage(
                        '${escapeJs(
                            message.attachmentUrl
                        )}'
                    )
                "
                onerror="
                    this.style.display='none';
                "
            >
            `;

    }


    /*
     * TEXT
     */

    const text =
        String(
            message.message ||
            ""
        );


    if (
        text
    ) {

        content +=

            `
            <div>
                ${escapeHtml(text)}
            </div>
            `;

    }


    const imageOnly =
        message.attachmentType ===
            "image" &&
        !text;


    return `

        <div
            class="
                message-row
                ${
                    mine
                        ? "mine"
                        : "theirs"
                }
            "
        >

            <div
                class="bubble-wrapper"
            >

                <div
                    class="
                        bubble
                        ${
                            imageOnly
                                ? "image-message-bubble"
                                : ""
                        }
                    "
                >

                    ${content}

                </div>


                <div
                    class="time"
                >
                    ${escapeHtml(time)}
                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   OPTIMISTIC MESSAGE
========================================================= */

function addOptimisticMessage(
    text,
    imageData
) {

    const container =
        document.getElementById(
            "messages"
        );


    /*
     * Remove empty state.
     */

    const empty =
        document.getElementById(
            "empty"
        );


    if (
        empty
    ) {

        empty.remove();

    }


    let content =
        "";


    /*
     * Show photo immediately.
     */

    if (
        imageData
    ) {

        content +=

            `
            <img
                class="message-image"
                src="${escapeHtml(
                    imageData
                )}"
                alt="Photo"
            >
            `;

    }


    /*
     * Show text immediately.
     */

    if (
        text
    ) {

        content +=

            `
            <div>
                ${escapeHtml(text)}
            </div>
            `;

    }


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row mine sending-message";


    row.dataset.sending =
        "true";


    row.innerHTML =

        `
        <div
            class="bubble-wrapper"
        >

            <div
                class="
                    bubble
                    ${
                        imageData &&
                        !text

                            ? "image-message-bubble"

                            : ""
                    }
                "
            >

                ${content}

            </div>


            <div
                class="sending-label"
            >
                Sending...
            </div>

        </div>
        `;


    container.appendChild(
        row
    );


    container.scrollTop =
        container.scrollHeight;


    return row;

}


/* =========================================================
   OPEN IMAGE
========================================================= */

function openImage(
    url
) {

    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   IMAGE PICKER
========================================================= */

function openImagePicker() {

    document
        .getElementById(
            "imageInput"
        )
        .click();

}


/* =========================================================
   SELECT IMAGE
========================================================= */

function handleImageSelection(
    event
) {

    const file =
        event.target.files &&
        event.target.files[0];


    if (
        !file
    ) {

        return;

    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Please choose an image file."
        );


        event.target.value =
            "";


        return;

    }


    if (
        file.size >
        10 * 1024 * 1024
    ) {

        alert(
            "Please choose an image smaller than 10 MB."
        );


        event.target.value =
            "";


        return;

    }


    selectedImage =
        file;


    const reader =
        new FileReader();


    reader.onload =
        function() {

            document
                .getElementById(
                    "previewImage"
                )
                .src =
                reader.result;


            document
                .getElementById(
                    "imagePreview"
                )
                .style.display =
                "block";

        };


    reader.readAsDataURL(
        file
    );

}


/* =========================================================
   REMOVE SELECTED IMAGE
========================================================= */

function removeSelectedImage() {

    selectedImage =
        null;


    document
        .getElementById(
            "imageInput"
        )
        .value =
        "";


    document
        .getElementById(
            "previewImage"
        )
        .src =
        "";


    document
        .getElementById(
            "imagePreview"
        )
        .style.display =
        "none";

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    /*
     * Prevent accidental double-sending.
     */

    if (
        sendInProgress
    ) {

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const message =
        input.value.trim();


    if (
        !message &&
        !selectedImage
    ) {

        return;

    }


    sendInProgress =
        true;


    button.disabled =
        true;


    button.textContent =
        "Sending...";


    /*
     * Keep a reference to the exact file
     * that was selected.
     */

    const imageToSend =
        selectedImage;


    let optimisticImage =
        "";


    /*
     * Create a local preview first.
     *
     * This is only for the temporary bubble.
     */

    if (
        imageToSend
    ) {

        try {

            optimisticImage =
                await fileToDataUrl(
                    imageToSend
                );

        }

        catch (
            error
        ) {

            console.error(
                "Preview error:",
                error
            );

        }

    }


    /*
     * SHOW THE MESSAGE IMMEDIATELY.
     */

    const optimisticElement =
        addOptimisticMessage(
            message,
            optimisticImage
        );


    try {

        let imageData =
            "";


        let imageType =
            "";


        let imageName =
            "";


        /*
         * Compress image before sending it.
         */

        if (
            imageToSend
        ) {

            const compressed =
                await compressImage(
                    imageToSend
                );


            imageData =
                compressed.dataUrl;


            imageType =
                compressed.mimeType;


            imageName =
                compressed.fileName;

        }


        /*
         * SEND TO APPS SCRIPT
         */

        const response =
            await fetch(

                APPS_SCRIPT_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "sendMessage",

                            email:
                                currentUser.email,

                            receiver:
                                otherUsername,

                            message:
                                message,

                            attachmentType:
                                imageData
                                    ? "image"
                                    : "",

                            attachmentData:
                                imageData,

                            attachmentMime:
                                imageType,

                            attachmentName:
                                imageName

                        })

                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Could not send the message."
            );

        }


        /*
         * IMPORTANT:
         *
         * The server has confirmed the message.
         *
         * Remove the temporary bubble.
         */

        if (
            optimisticElement &&
            optimisticElement.isConnected
        ) {

            optimisticElement.remove();

        }


        /*
         * Clear input.
         */

        input.value =
            "";


        resetTextareaHeight();


        removeSelectedImage();


        /*
         * DO NOT wait 400ms.
         *
         * Immediately load the authoritative
         * conversation from the server.
         */

        await loadMessages();

    }

    catch (
        error
    ) {

        console.error(
            "Send message error:",
            error
        );


        /*
         * If saving failed, remove the temporary
         * "Sending..." message.
         */

        if (
            optimisticElement &&
            optimisticElement.isConnected
        ) {

            optimisticElement.remove();

        }


        alert(
            error.message ||
            "Could not send the message."
        );

    }

    finally {

        sendInProgress =
            false;


        button.disabled =
            false;


        button.textContent =
            "Send";


        input.focus();

    }

}


/* =========================================================
   FILE TO DATA URL
========================================================= */

function fileToDataUrl(
    file
) {

    return new Promise(

        function(
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onload =
                function() {

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }

    );

}


/* =========================================================
   IMAGE COMPRESSION
========================================================= */

function compressImage(
    file
) {

    return new Promise(

        function(
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onerror =
                reject;


            reader.onload =
                function() {

                    const image =
                        new Image();


                    image.onerror =
                        reject;


                    image.onload =
                        function() {

                            const maxSize =
                                1600;


                            let width =
                                image.width;


                            let height =
                                image.height;


                            if (
                                width >
                                    maxSize ||
                                height >
                                    maxSize
                            ) {

                                if (
                                    width >
                                        height
                                ) {

                                    height =
                                        Math.round(
                                            height *
                                            (
                                                maxSize /
                                                width
                                            )
                                        );


                                    width =
                                        maxSize;

                                }

                                else {

                                    width =
                                        Math.round(
                                            width *
                                            (
                                                maxSize /
                                                height
                                            )
                                        );


                                    height =
                                        maxSize;

                                }

                            }


                            const canvas =
                                document
                                    .createElement(
                                        "canvas"
                                    );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const context =
                                canvas.getContext(
                                    "2d"
                                );


                            context.drawImage(

                                image,

                                0,
                                0,

                                width,
                                height

                            );


                            const mimeType =
                                "image/jpeg";


                            const dataUrl =
                                canvas.toDataURL(

                                    mimeType,

                                    .82

                                );


                            resolve({

                                dataUrl:
                                    dataUrl,

                                mimeType:
                                    mimeType,

                                fileName:
                                    "photo-" +
                                    Date.now() +
                                    ".jpg"

                            });

                        };


                    image.src =
                        reader.result;

                };


            reader.readAsDataURL(
                file
            );

        }

    );

}


/* =========================================================
   ADAPTIVE TEXTBOX
========================================================= */

function setupMessageInput() {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.addEventListener(
        "input",
        function() {

            autoResizeTextarea(
                input
            );

        }
    );


    input.addEventListener(
        "keydown",
        function(
            event
        ) {

            /*
             * Enter sends.
             * Shift+Enter creates a new line.
             */

            if (
                event.key ===
                    "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();


                sendMessage();

            }

        }
    );

}


function autoResizeTextarea(
    input
) {

    input.style.height =
        "auto";


    const maxHeight =
        window.innerWidth <=
            600

            ? 120

            : 140;


    input.style.height =
        Math.min(
            input.scrollHeight,
            maxHeight
        ) +
        "px";

}


function resetTextareaHeight() {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.style.height =
        "44px";

}


/* =========================================================
   TRACK USER SCROLL
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const container =
            document.getElementById(
                "messages"
            );


        container.addEventListener(
            "scroll",
            function() {

                const distance =
                    container.scrollHeight -
                    container.scrollTop -
                    container.clientHeight;


                if (
                    distance >
                    140
                ) {

                    container.dataset.userScrolled =
                        "true";

                }

                else {

                    delete container.dataset.userScrolled;

                }

            }
        );

    }
);


/* =========================================================
   ERROR
========================================================= */

function showMessageError(
    message
) {

    const container =
        document.getElementById(
            "messages"
        );


    /*
     * Don't destroy a working conversation because
     * one background refresh failed.
     */

    if (
        container.querySelector(
            ".message-row"
        )
    ) {

        return;

    }


    container.innerHTML =

        `
        <div
            id="empty"
            style="
                color:#dc2626;
            "
        >
            ${escapeHtml(
                message
            )}
        </div>
        `;

}


/* =========================================================
   NORMALIZE USERNAME
========================================================= */

function normalizeUsername(
    username
) {

    return String(
        username ||
        ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /^@/,
        ""
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   ESCAPE JAVASCRIPT STRING
========================================================= */

function escapeJs(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\r/g,
        "\\r"
    )
    .replace(
        /\n/g,
        "\\n"
    );

}
