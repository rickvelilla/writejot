<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Writejot | Chat</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f6f8fc;
            color: #1f2937;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: white;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                11px 6%;

            display: flex;
            align-items: center;

            gap: 12px;

            flex-shrink: 0;
        }

        .back {
            color: #4285F4;

            text-decoration: none;

            font-weight: 600;

            white-space: nowrap;
        }

        .recipient {
            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;
        }

        .recipient img {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            object-fit: cover;

            border:
                2px solid #4285F4;

            flex-shrink: 0;
        }

        .recipient-name {
            font-weight: 700;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .recipient-username {
            color: #4285F4;

            font-size: 13px;
        }

        /* =========================
           MESSAGE AREA
        ========================= */

        #messages {
            flex: 1;

            overflow-y: auto;

            width: 100%;

            max-width: 850px;

            margin: 0 auto;

            padding: 25px 20px;
        }

        .message-row {
            width: 100%;

            display: flex;

            margin-bottom: 12px;
        }

        .message-row.mine {
            justify-content: flex-end;
        }

        .message-row.theirs {
            justify-content: flex-start;
        }

        /*
         * IMPORTANT:
         * The wrapper is shrink-to-fit.
         */

        .bubble-wrapper {
            display: inline-block;

            width: auto;

            max-width:
                min(70vw, 550px);

            flex:
                0 1 auto;
        }

        /*
         * The bubble itself only becomes
         * as wide as the text requires.
         */

        .bubble {
            display: inline-block;

            width: auto;

            max-width: 100%;

            padding:
                10px 14px;

            border-radius:
                15px;

            line-height:
                1.45;

            white-space:
                pre-wrap;

            overflow-wrap:
                anywhere;

            word-break:
                break-word;
        }

        .mine .bubble {
            background:
                #4285F4;

            color:
                white;

            border-bottom-right-radius:
                4px;
        }

        .theirs .bubble {
            background:
                white;

            border:
                1px solid #e1e6ee;

            border-bottom-left-radius:
                4px;
        }

        .time {
            font-size:
                11px;

            opacity:
                0.65;

            margin-top:
                4px;
        }

        .mine .time {
            text-align:
                right;
        }

        #empty {
            text-align:
                center;

            color:
                #718096;

            padding:
                40px;
        }

        /* =========================
           COMPOSER
        ========================= */

        #composer {
            width: 100%;

            background:
                white;

            border-top:
                1px solid #e5e7eb;

            padding:
                10px 14px;

            flex-shrink: 0;
        }

        .composer-inner {
            width: 100%;

            max-width: 850px;

            margin:
                0 auto;

            display: flex;

            align-items:
                flex-end;

            gap: 10px;
        }

        #messageInput {
            flex: 1;

            min-width: 0;

            width: 100%;

            min-height:
                44px;

            max-height:
                140px;

            padding:
                11px 14px;

            border:
                1px solid #d8dee8;

            border-radius:
                9px;

            background:
                white;

            font-family:
                inherit;

            font-size:
                14px;

            outline:
                none;

            resize:
                none;

            overflow-y:
                auto;
        }

        #messageInput:focus {
            border-color:
                #4285F4;

            box-shadow:
                0 0 0 3px
                rgba(
                    66,
                    133,
                    244,
                    0.08
                );
        }

        #sendButton {
            flex-shrink: 0;

            min-height:
                44px;

            padding:
                0 18px;

            border:
                none;

            border-radius:
                9px;

            background:
                #4285F4;

            color:
                white;

            font-weight:
                600;

            cursor:
                pointer;

            white-space:
                nowrap;
        }

        #sendButton:hover {
            background:
                #3367d6;
        }

        #sendButton:disabled {
            opacity:
                0.6;

            cursor:
                not-allowed;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding:
                    10px 12px;
            }

            .back {
                font-size:
                    13px;
            }

            .recipient img {
                width:
                    38px;

                height:
                    38px;
            }

            .recipient-name {
                max-width:
                    170px;
            }

            #messages {
                padding:
                    18px 12px;
            }

            .bubble-wrapper {
                max-width:
                    82vw;
            }

            #composer {
                padding:
                    8px 10px;
            }

            .composer-inner {
                gap:
                    7px;
            }

            #messageInput {
                min-height:
                    42px;

                max-height:
                    120px;

                padding:
                    10px 12px;
            }

            #sendButton {
                min-height:
                    42px;

                padding:
                    0 13px;
            }
        }

    </style>

</head>


<body>


<header>

    <a
        href="messages.html"
        class="back"
    >
        ← Messages
    </a>


    <div class="recipient">

        <img
            id="recipientPicture"
            src="W.png"
            alt="Profile picture"
        >


        <div>

            <div
                id="recipientName"
                class="recipient-name"
            >
                Loading...
            </div>


            <div
                id="recipientUsername"
                class="recipient-username"
            >
                @username
            </div>

        </div>

    </div>

</header>



<div id="messages">

    <div id="empty">
        Loading messages...
    </div>

</div>



<div id="composer">

    <div class="composer-inner">

        <textarea
            id="messageInput"
            maxlength="2000"
            placeholder="Write a message..."
            rows="1"
        ></textarea>


        <button
            id="sendButton"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>

</div>



<script>


/* =========================================
   YOUR CURRENT APPS SCRIPT URL
========================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


let currentUser =
    null;

let otherUsername =
    "";

let refreshTimer =
    null;


/* =========================================
   START
========================================= */

window.onload =
    async function () {

        const savedUser =
            localStorage.getItem(
                "writejotUser"
            );


        if (!savedUser) {

            window.location.href =
                "index.html";

            return;
        }


        try {

            currentUser =
                JSON.parse(
                    savedUser
                );

        }

        catch (error) {

            window.location.href =
                "index.html";

            return;
        }


        const params =
            new URLSearchParams(
                window.location.search
            );


        otherUsername =
            String(
                params.get(
                    "username"
                ) || ""
            )
            .trim()
            .toLowerCase()
            .replace(
                /^@/,
                ""
            );


        if (!otherUsername) {

            window.location.href =
                "messages.html";

            return;
        }


        await loadRecipient();

        await markConversationRead();

        await loadMessages();


        refreshTimer =
            setInterval(
                loadMessages,
                3000
            );


        setupMessageInput();

    };


/* =========================================
   LOAD RECIPIENT
========================================= */

async function loadRecipient() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=profile&username=" +
                encodeURIComponent(
                    otherUsername
                ),
                {
                    cache: "no-store"
                }

            );


        if (!response.ok) {
            throw new Error(
                "Server returned " +
                response.status
            );
        }


        const result =
            await response.json();


        if (
            !result.success ||
            !result.profile
        ) {

            console.error(
                "Profile response:",
                result
            );

            document
                .getElementById(
                    "recipientName"
                )
                .textContent =
                "User not found";

            document
                .getElementById(
                    "recipientUsername"
                )
                .textContent =
                "@" +
                otherUsername;

            return;
        }


        const profile =
            result.profile;


        document
            .getElementById(
                "recipientName"
            )
            .textContent =
            profile.name ||
            "Writejot User";


        document
            .getElementById(
                "recipientUsername"
            )
            .textContent =
            "@" +
            (
                profile.username ||
                otherUsername
            );


        document
            .getElementById(
                "recipientPicture"
            )
            .src =
            profile.profilePicture ||
            "W.png";


    }

    catch (error) {

        console.error(
            "Could not load recipient:",
            error
        );

        document
            .getElementById(
                "recipientName"
            )
            .textContent =
            "Writejot User";

        document
            .getElementById(
                "recipientUsername"
            )
            .textContent =
            "@" +
            otherUsername;

    }

}


/* =========================================
   MARK READ
========================================= */

async function markConversationRead() {

    try {

        await fetch(

            APPS_SCRIPT_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify({

                        action:
                            "markConversationRead",

                        email:
                            currentUser.email,

                        username:
                            otherUsername

                    })

            }

        );

    }

    catch (error) {

        console.error(
            "Read-state error:",
            error
        );

    }

}


/* =========================================
   LOAD MESSAGES
========================================= */

async function loadMessages() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=messages" +
                "&email=" +
                encodeURIComponent(
                    currentUser.email
                ) +
                "&username=" +
                encodeURIComponent(
                    otherUsername
                ),
                {
                    cache: "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !result.success
        ) {

            showMessageError(
                result.error ||
                "Could not load messages."
            );

            return;
        }


        renderMessages(
            result.messages || []
        );

    }

    catch (error) {

        console.error(
            "Message loading error:",
            error
        );

        showMessageError(
            "Could not load messages."
        );

    }

}


/* =========================================
   RENDER MESSAGES
========================================= */

function renderMessages(
    messages
) {

    const container =
        document.getElementById(
            "messages"
        );


    if (!messages.length) {

        container.innerHTML =

            `
            <div id="empty">
                No messages yet. Say hello!
            </div>
            `;

        return;
    }


    const currentUsername =
        normalizeUsername(
            currentUser.username
        );


    container.innerHTML =
        messages
            .map(

                function (message) {

                    const mine =
                        normalizeUsername(
                            message.sender
                        ) ===
                        currentUsername;


                    const time =
                        message.timestamp
                            ? new Date(
                                message.timestamp
                              )
                              .toLocaleString()
                            : "";


                    return `

                        <div
                            class="message-row
                            ${
                                mine
                                    ? "mine"
                                    : "theirs"
                            }"
                        >

                            <div
                                class="bubble-wrapper"
                            >

                                <div
                                    class="bubble"
                                >
                                    ${escapeHtml(
                                        message.message
                                    )}
                                </div>


                                <div
                                    class="time"
                                >
                                    ${escapeHtml(
                                        time
                                    )}
                                </div>

                            </div>

                        </div>

                    `;

                }

            )
            .join("");


    container.scrollTop =
        container.scrollHeight;

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    button.disabled =
        true;

    button.textContent =
        "Sending...";


    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "sendMessage",

                            email:
                                currentUser.email,

                            receiver:
                                otherUsername,

                            message:
                                message

                        })

                }

            );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );
        }


        const result =
            await response.json();


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Message could not be sent."
            );
        }


        input.value =
            "";


        resetTextareaHeight();


        /*
         * Reload the conversation immediately.
         */

        await loadMessages();

    }

    catch (error) {

        console.error(
            "Send error:",
            error
        );


        alert(
            error.message ||
            "Could not send the message."
        );

    }

    finally {

        button.disabled =
            false;

        button.textContent =
            "Send";

        input.focus();

    }

}


/* =========================================
   INPUT
========================================= */

function setupMessageInput() {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.addEventListener(
        "input",
        function () {

            input.style.height =
                "auto";


            const maxHeight =
                window.innerWidth <= 600
                    ? 120
                    : 140;


            input.style.height =
                Math.min(
                    input.scrollHeight,
                    maxHeight
                ) +
                "px";

        }
    );


    input.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );

}


/* =========================================
   RESET INPUT
========================================= */

function resetTextareaHeight() {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.style.height =
        "44px";

}


/* =========================================
   ERROR
========================================= */

function showMessageError(
    message
) {

    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML =

        `
        <div
            id="empty"
            style="color:#dc2626;"
        >
            ${escapeHtml(message)}
        </div>
        `;

}


/* =========================================
   HELPERS
========================================= */

function normalizeUsername(
    username
) {

    return String(
        username || ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /^@/,
        ""
    );

}


function escapeHtml(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

</script>


</body>

</html>
