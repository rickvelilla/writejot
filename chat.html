<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Writejot | Chat</title>


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f6f8fc;

            color:
                #1f2937;

            display:
                flex;

            flex-direction:
                column;

            overflow:
                hidden;
        }


        /* =================================================
           HEADER
        ================================================= */

        header {
            flex: 0 0 auto;

            height: 64px;

            background: white;

            border-bottom:
                1px solid #e5e7eb;

            display: flex;

            align-items: center;

            gap: 12px;

            padding:
                0 16px;
        }

        .back {
            color:
                #4285F4;

            text-decoration:
                none;

            font-size:
                14px;

            font-weight:
                700;

            white-space:
                nowrap;
        }

        .recipient {
            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;
        }

        .recipient img {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            object-fit: cover;

            background:
                #e9eef5;

            flex: 0 0 40px;
        }

        .recipient-info {
            min-width: 0;
        }

        .recipient-name {
            font-size: 15px;

            font-weight: 700;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .recipient-username {
            font-size: 12px;

            color:
                #6b7280;

            white-space: nowrap;
        }


        /* =================================================
           CHAT AREA
        ================================================= */

        #chatArea {
            flex: 1 1 auto;

            min-height: 0;

            overflow-y: auto;

            padding:
                18px 18px 20px;
        }

        #messages {
            width: 100%;

            max-width: 850px;

            margin: 0 auto;
        }


        /* =================================================
           MESSAGE ROW
        ================================================= */

        .message-row {
            display: flex;

            width: 100%;

            margin: 0 0 10px 0;

            padding: 0;

            align-items: flex-start;
        }

        .message-row.mine {
            justify-content: flex-end;
        }

        .message-row.theirs {
            justify-content: flex-start;
        }


        /* =================================================
           MESSAGE CONTENT
        ================================================= */

        .message-content {
            display: block;

            width: fit-content;

            max-width: 70%;

            min-width: 0;

            height: auto;

            margin: 0;

            padding: 0;
        }


        /* =================================================
           TEXT BUBBLE

           IMPORTANT:
           - no flex
           - no height: 100%
           - no width: 100%
           - no min-height
        ================================================= */

        .bubble {
            display: inline-block;

            width: auto;

            max-width: 100%;

            height: auto;

            min-height: 0;

            padding:
                9px 13px;

            margin: 0;

            border-radius:
                14px;

            font-size:
                14px;

            line-height:
                1.45;

            white-space:
                pre-wrap;

            overflow-wrap:
                anywhere;

            word-break:
                break-word;

            vertical-align:
                top;

            text-align:
                left;
        }


        .mine .bubble {
            background:
                #4285F4;

            color:
                white;

            border-bottom-right-radius:
                4px;
        }


        .theirs .bubble {
            background:
                white;

            color:
                #1f2937;

            border:
                1px solid #dfe3e8;

            border-bottom-left-radius:
                4px;
        }


        /* =================================================
           TIME
        ================================================= */

        .time {
            display: block;

            margin-top: 3px;

            padding: 0 3px;

            font-size: 10px;

            line-height: 1.2;

            color:
                #98a2b3;
        }

        .mine .time {
            text-align: right;
        }

        .theirs .time {
            text-align: left;
        }


        /* =================================================
           IMAGE MESSAGE
        ================================================= */

        .image-bubble {
            padding: 4px;

            overflow: hidden;
        }

        .message-image {
            display: block;

            width: auto;

            height: auto;

            max-width: 100%;

            max-height: 450px;

            border-radius:
                10px;

            object-fit:
                contain;

            cursor:
                pointer;
        }

        .image-caption {
            padding:
                6px 7px 3px;

            font-size:
                14px;

            line-height:
                1.45;

            white-space:
                pre-wrap;

            overflow-wrap:
                anywhere;

            word-break:
                break-word;
        }


        /* =================================================
           EMPTY STATE
        ================================================= */

        .empty-state {
            min-height: 250px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            color:
                #89919d;
        }

        .empty-icon {
            font-size: 38px;

            margin-bottom: 8px;
        }


        /* =================================================
           COMPOSER
        ================================================= */

        #composer {
            flex: 0 0 auto;

            width: 100%;

            background:
                white;

            border-top:
                1px solid #e5e7eb;

            padding:
                10px 12px 12px;
        }

        .composer-inner {
            width: 100%;

            max-width: 850px;

            margin: 0 auto;

            display: flex;

            align-items: flex-end;

            gap: 7px;
        }


        /* =================================================
           PHOTO BUTTON
        ================================================= */

        #photoButton {
            width: 42px;
            height: 42px;

            flex: 0 0 42px;

            border:
                1px solid #d7dce3;

            border-radius: 10px;

            background: white;

            cursor: pointer;

            font-size: 19px;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        #photoButton:hover {
            background:
                #f4f6f8;
        }

        #imageInput {
            display: none;
        }


        /* =================================================
           TEXT INPUT
        ================================================= */

        #messageInput {
            flex: 1 1 auto;

            min-width: 0;

            width: 100%;

            min-height: 42px;

            max-height: 125px;

            padding:
                10px 12px;

            border:
                1px solid #d7dce3;

            border-radius: 10px;

            background: white;

            font-family: inherit;

            font-size: 14px;

            line-height: 20px;

            resize: none;

            outline: none;

            overflow-y: auto;
        }

        #messageInput:focus {
            border-color:
                #4285F4;

            box-shadow:
                0 0 0 3px
                rgba(
                    66,
                    133,
                    244,
                    .08
                );
        }


        /* =================================================
           SEND BUTTON
        ================================================= */

        #sendButton {
            height: 42px;

            flex: 0 0 auto;

            padding:
                0 16px;

            border: none;

            border-radius: 10px;

            background:
                #4285F4;

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;
        }

        #sendButton:hover {
            background:
                #3367d6;
        }

        #sendButton:disabled {
            opacity: .6;

            cursor:
                not-allowed;
        }


        /* =================================================
           IMAGE PREVIEW
        ================================================= */

        #imagePreview {
            display: none;

            width: 100%;

            max-width: 850px;

            margin:
                0 auto 8px;
        }

        .preview-box {
            position: relative;

            display: inline-block;
        }

        #previewImage {
            display: block;

            width: auto;

            max-width: 170px;

            max-height: 120px;

            border-radius: 10px;

            border:
                1px solid #d7dce3;

            object-fit: cover;
        }

        #removeImageButton {
            position: absolute;

            right: -7px;

            top: -7px;

            width: 23px;

            height: 23px;

            border: none;

            border-radius: 50%;

            background:
                #ef4444;

            color: white;

            cursor: pointer;

            font-size: 15px;

            line-height: 23px;

            padding: 0;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 600px) {

            header {
                height: 58px;

                padding:
                    0 11px;
            }

            .back {
                font-size: 12px;
            }

            .recipient img {
                width: 36px;
                height: 36px;

                flex-basis: 36px;
            }

            .recipient-name {
                font-size: 14px;
            }

            .recipient-username {
                font-size: 11px;
            }

            #chatArea {
                padding:
                    14px 11px 16px;
            }

            .message-content {
                max-width: 82%;
            }

            .bubble {
                font-size: 14px;

                padding:
                    8px 12px;
            }

            .message-image {
                max-height: 330px;
            }

            #composer {
                padding: 8px;
            }

            .composer-inner {
                gap: 5px;
            }

            #photoButton {
                width: 40px;
                height: 40px;

                flex-basis: 40px;
            }

            #messageInput {
                min-height: 40px;

                max-height: 110px;
            }

            #sendButton {
                height: 40px;

                padding:
                    0 12px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <a
        href="messages.html"
        class="back"
    >
        ← Messages
    </a>


    <div
        class="recipient"
    >

        <img
            id="recipientPicture"
            src="W.png"
            alt="Profile picture"
        >


        <div
            class="recipient-info"
        >

            <div
                id="recipientName"
                class="recipient-name"
            >
                Loading...
            </div>


            <div
                id="recipientUsername"
                class="recipient-username"
            >
                @username
            </div>

        </div>

    </div>

</header>



<!-- =====================================================
     CHAT
===================================================== -->

<main
    id="chatArea"
>

    <div
        id="messages"
    >

        <div
            class="empty-state"
        >

            <div
                class="empty-icon"
            >
                💬
            </div>

            Loading messages...

        </div>

    </div>

</main>



<!-- =====================================================
     COMPOSER
===================================================== -->

<div
    id="composer"
>


    <!-- IMAGE PREVIEW -->

    <div
        id="imagePreview"
    >

        <div
            class="preview-box"
        >

            <img
                id="previewImage"
                src=""
                alt="Selected image"
            >


            <button
                id="removeImageButton"
                type="button"
                onclick="removeSelectedImage()"
            >
                ×
            </button>

        </div>

    </div>



    <div
        class="composer-inner"
    >

        <button
            id="photoButton"
            type="button"
            onclick="openImagePicker()"
            title="Send photo"
        >
            📷
        </button>


        <input
            id="imageInput"
            type="file"
            accept="image/*"
            onchange="handleImageSelection(event)"
        >


        <textarea
            id="messageInput"
            placeholder="Type a message..."
            maxlength="2000"
            rows="1"
        ></textarea>


        <button
            id="sendButton"
            type="button"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>

</div>



<script>


/* =========================================================
   CONFIG
========================================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


let currentUser =
    null;

let otherUsername =
    "";

let refreshTimer =
    null;

let selectedImage =
    null;


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    async function () {

        const savedUser =
            localStorage.getItem(
                "writejotUser"
            );


        if (!savedUser) {

            window.location.href =
                "index.html";

            return;
        }


        try {

            currentUser =
                JSON.parse(
                    savedUser
                );

        }

        catch (error) {

            window.location.href =
                "index.html";

            return;

        }


        const params =
            new URLSearchParams(
                window.location.search
            );


        otherUsername =
            normalizeUsername(
                params.get(
                    "username"
                )
            );


        if (!otherUsername) {

            window.location.href =
                "messages.html";

            return;

        }


        setupMessageInput();


        await loadRecipient();

        await markConversationRead();

        await loadMessages();


        refreshTimer =
            setInterval(
                loadMessages,
                4000
            );

    }
);


/* =========================================================
   LOAD RECIPIENT
========================================================= */

async function loadRecipient() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=profile&username=" +
                encodeURIComponent(
                    otherUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        if (
            !result.success ||
            !result.profile
        ) {

            document
                .getElementById(
                    "recipientName"
                )
                .textContent =
                "Writejot User";


            document
                .getElementById(
                    "recipientUsername"
                )
                .textContent =
                "@" +
                otherUsername;


            return;
        }


        const profile =
            result.profile;


        document
            .getElementById(
                "recipientName"
            )
            .textContent =
            profile.name ||
            "Writejot User";


        document
            .getElementById(
                "recipientUsername"
            )
            .textContent =
            "@" +
            (
                profile.username ||
                otherUsername
            );


        document
            .getElementById(
                "recipientPicture"
            )
            .src =
            profile.profilePicture ||
            "W.png";


        document
            .getElementById(
                "recipientPicture"
            )
            .onerror =
            function () {

                this.src =
                    "W.png";

            };

    }

    catch (error) {

        console.error(
            "Recipient error:",
            error
        );

    }

}


/* =========================================================
   MARK READ
========================================================= */

async function markConversationRead() {

    try {

        await fetch(

            APPS_SCRIPT_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify({

                        action:
                            "markConversationRead",

                        email:
                            currentUser.email,

                        username:
                            otherUsername

                    })

            }

        );

    }

    catch (error) {

        console.error(
            "Read status error:",
            error
        );

    }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=messages" +
                "&email=" +
                encodeURIComponent(
                    currentUser.email
                ) +
                "&username=" +
                encodeURIComponent(
                    otherUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            showError(
                result.error ||
                "Could not load messages."
            );

            return;

        }


        renderMessages(
            result.messages ||
            []
        );

    }

    catch (error) {

        console.error(
            "Messages error:",
            error
        );


        showError(
            "Could not connect to Writejot."
        );

    }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(
    messages
) {

    const container =
        document.getElementById(
            "messages"
        );


    if (!messages.length) {

        container.innerHTML =

            `
            <div
                class="empty-state"
            >

                <div
                    class="empty-icon"
                >
                    💬
                </div>

                No messages yet.
                <br>
                Say hello!

            </div>
            `;

        return;
    }


    const currentUsername =
        normalizeUsername(
            currentUser.username
        );


    container.innerHTML =
        messages
            .map(
                function (message) {

                    const mine =
                        normalizeUsername(
                            message.sender
                        ) ===
                        currentUsername;


                    const time =
                        message.timestamp
                            ? new Date(
                                message.timestamp
                              )
                              .toLocaleTimeString(
                                  [],
                                  {
                                      hour:
                                          "numeric",

                                      minute:
                                          "2-digit"
                                  }
                              )
                            : "";


                    /*
                     * IMAGE MESSAGE
                     */

                    if (
                        message.attachmentType ===
                            "image" &&
                        message.attachmentUrl
                    ) {

                        return `

                            <div
                                class="
                                    message-row
                                    ${
                                        mine
                                            ? "mine"
                                            : "theirs"
                                    }
                                "
                            >

                                <div
                                    class="message-content"
                                >

                                    <div
                                        class="bubble image-bubble"
                                    >

                                        <img
                                            class="message-image"
                                            src="${escapeHtml(
                                                message.attachmentUrl
                                            )}"
                                            alt="Photo"
                                            loading="lazy"
                                            onclick="openImage(
                                                '${escapeHtml(
                                                    message.attachmentUrl
                                                )}'
                                            )"
                                        >


                                        ${
                                            message.message
                                                ? `
                                                    <div
                                                        class="image-caption"
                                                    >
                                                        ${escapeHtml(
                                                            message.message
                                                        )}
                                                    </div>
                                                  `
                                                : ""
                                        }

                                    </div>


                                    <div
                                        class="time"
                                    >
                                        ${escapeHtml(
                                            time
                                        )}
                                    </div>

                                </div>

                            </div>

                        `;

                    }


                    /*
                     * NORMAL TEXT MESSAGE
                     */

                    return `

                        <div
                            class="
                                message-row
                                ${
                                    mine
                                        ? "mine"
                                        : "theirs"
                                }
                            "
                        >

                            <div
                                class="message-content"
                            >

                                <div
                                    class="bubble"
                                >
                                    ${escapeHtml(
                                        String(
                                            message.message ||
                                            ""
                                        )
                                    )}
                                </div>


                                <div
                                    class="time"
                                >
                                    ${escapeHtml(
                                        time
                                    )}
                                </div>

                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    /*
     * Always show the newest message.
     */

    requestAnimationFrame(
        function () {

            const chatArea =
                document.getElementById(
                    "chatArea"
                );


            chatArea.scrollTop =
                chatArea.scrollHeight;

        }
    );

}


/* =========================================================
   TEXT INPUT
========================================================= */

function setupMessageInput() {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.addEventListener(
        "input",
        function () {

            input.style.height =
                "auto";


            const maxHeight =
                window.innerWidth <=
                    600
                    ? 110
                    : 125;


            input.style.height =
                Math.min(
                    input.scrollHeight,
                    maxHeight
                ) +
                "px";

        }
    );


    input.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key ===
                    "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );

}


/* =========================================================
   IMAGE PICKER
========================================================= */

function openImagePicker() {

    document
        .getElementById(
            "imageInput"
        )
        .click();

}


/* =========================================================
   SELECT IMAGE
========================================================= */

function handleImageSelection(
    event
) {

    const file =
        event.target.files &&
        event.target.files[0];


    if (!file) {

        return;

    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Please select an image."
        );

        event.target.value =
            "";

        return;

    }


    if (
        file.size >
        10 * 1024 * 1024
    ) {

        alert(
            "Please select an image smaller than 10 MB."
        );

        event.target.value =
            "";

        return;

    }


    selectedImage =
        file;


    const reader =
        new FileReader();


    reader.onload =
        function () {

            document
                .getElementById(
                    "previewImage"
                )
                .src =
                reader.result;


            document
                .getElementById(
                    "imagePreview"
                )
                .style.display =
                "block";

        };


    reader.readAsDataURL(
        file
    );

}


/* =========================================================
   REMOVE IMAGE
========================================================= */

function removeSelectedImage() {

    selectedImage =
        null;


    document
        .getElementById(
            "imageInput"
        )
        .value =
        "";


    document
        .getElementById(
            "previewImage"
        )
        .src =
        "";


    document
        .getElementById(
            "imagePreview"
        )
        .style.display =
        "none";

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const text =
        input.value.trim();


    if (
        !text &&
        !selectedImage
    ) {

        return;

    }


    button.disabled =
        true;

    button.textContent =
        "Sending...";


    try {

        let imageData =
            "";

        let imageMime =
            "";

        let imageName =
            "";


        if (
            selectedImage
        ) {

            const compressed =
                await compressImage(
                    selectedImage
                );


            imageData =
                compressed.dataUrl;

            imageMime =
                compressed.mimeType;

            imageName =
                compressed.fileName;

        }


        const response =
            await fetch(

                APPS_SCRIPT_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "sendMessage",

                            email:
                                currentUser.email,

                            receiver:
                                otherUsername,

                            message:
                                text,

                            attachmentType:
                                imageData
                                    ? "image"
                                    : "",

                            attachmentData:
                                imageData,

                            attachmentMime:
                                imageMime,

                            attachmentName:
                                imageName

                        })

                }

            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Could not send message."
            );

        }


        input.value =
            "";

        input.style.height =
            "42px";


        removeSelectedImage();


        await loadMessages();

    }

    catch (error) {

        console.error(
            "Send error:",
            error
        );


        alert(
            error.message ||
            "Could not send message."
        );

    }

    finally {

        button.disabled =
            false;

        button.textContent =
            "Send";

        input.focus();

    }

}


/* =========================================================
   COMPRESS IMAGE
========================================================= */

function compressImage(
    file
) {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onerror =
                reject;


            reader.onload =
                function () {

                    const image =
                        new Image();


                    image.onerror =
                        reject;


                    image.onload =
                        function () {

                            const maxSize =
                                1600;


                            let width =
                                image.width;

                            let height =
                                image.height;


                            if (
                                width >
                                    maxSize ||
                                height >
                                    maxSize
                            ) {

                                if (
                                    width >
                                    height
                                ) {

                                    height =
                                        Math.round(
                                            height *
                                            maxSize /
                                            width
                                        );

                                    width =
                                        maxSize;

                                }
                                else {

                                    width =
                                        Math.round(
                                            width *
                                            maxSize /
                                            height
                                        );

                                    height =
                                        maxSize;

                                }

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const context =
                                canvas.getContext(
                                    "2d"
                                );


                            context.drawImage(
                                image,
                                0,
                                0,
                                width,
                                height
                            );


                            const mimeType =
                                "image/jpeg";


                            resolve({

                                dataUrl:
                                    canvas.toDataURL(
                                        mimeType,
                                        0.82
                                    ),

                                mimeType:
                                    mimeType,

                                fileName:
                                    "photo-" +
                                    Date.now() +
                                    ".jpg"

                            });

                        };


                    image.src =
                        reader.result;

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   OPEN IMAGE
========================================================= */

function openImage(
    url
) {

    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
) {

    document
        .getElementById(
            "messages"
        )
        .innerHTML =

        `
        <div
            class="empty-state"
            style="color:#dc2626;"
        >
            ${escapeHtml(
                message
            )}
        </div>
        `;

}


/* =========================================================
   HELPERS
========================================================= */

function normalizeUsername(
    username
) {

    return String(
        username ||
        ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /^@/,
        ""
    );

}


function escapeHtml(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
