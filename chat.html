<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Writejot | Chat</title>

    <style>

        * {
            box-sizing:
                border-box;
        }

        html,
        body {
            margin:
                0;

            width:
                100%;

            height:
                100%;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f6f8fc;

            color:
                #1f2937;

            display:
                flex;

            flex-direction:
                column;

            overflow:
                hidden;
        }

        header {
            flex: 0 0 auto;

            height:
                64px;

            background:
                white;

            border-bottom:
                1px solid #e5e7eb;

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            padding:
                0 16px;
        }

        .back {
            color:
                #4285F4;

            text-decoration:
                none;

            font-size:
                14px;

            font-weight:
                700;
        }

        .recipient {
            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            min-width:
                0;
        }

        .recipient img {
            width:
                40px;

            height:
                40px;

            border-radius:
                50%;

            object-fit:
                cover;

            flex:
                0 0 40px;
        }

        .recipient-info {
            min-width:
                0;
        }

        .recipient-name {
            font-weight:
                700;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }

        .recipient-username {
            color:
                #6b7280;

            font-size:
                12px;
        }

        #chatArea {
            flex:
                1 1 auto;

            min-height:
                0;

            overflow-y:
                auto;

            padding:
                18px;
        }

        #messages {
            width:
                100%;

            max-width:
                850px;

            margin:
                0 auto;
        }

        .message-row {
            display:
                flex;

            width:
                100%;

            align-items:
                flex-start;

            margin-bottom:
                10px;
        }

        .message-row.mine {
            justify-content:
                flex-end;
        }

        .message-row.theirs {
            justify-content:
                flex-start;
        }

        .message-content {
            width:
                fit-content;

            max-width:
                70%;

            min-width:
                0;
        }

        .bubble {
            display:
                inline-block;

            width:
                auto;

            max-width:
                100%;

            height:
                auto;

            min-height:
                0;

            padding:
                9px 13px;

            border-radius:
                14px;

            font-size:
                14px;

            line-height:
                1.45;

            white-space:
                pre-wrap;

            overflow-wrap:
                anywhere;

            word-break:
                break-word;
        }

        .mine .bubble {
            background:
                #4285F4;

            color:
                white;

            border-bottom-right-radius:
                4px;
        }

        .theirs .bubble {
            background:
                white;

            color:
                #1f2937;

            border:
                1px solid #dfe3e8;

            border-bottom-left-radius:
                4px;
        }

        .message-pending {
            opacity:
                .6;
        }

        .message-failed {
            opacity:
                .7;

            border:
                1px solid #ef4444 !important;
        }

        .retry-button {
            border:
                none;

            background:
                transparent;

            color:
                #dc2626;

            font-size:
                10px;

            cursor:
                pointer;

            padding:
                0 3px;
        }

        .time {
            display:
                block;

            margin-top:
                3px;

            font-size:
                10px;

            color:
                #98a2b3;

            text-align:
                left;
        }

        .mine .time {
            text-align:
                right;
        }

        .message-image {
            display:
                block;

            max-width:
                100%;

            max-height:
                450px;

            border-radius:
                10px;

            cursor:
                pointer;
        }

        .image-bubble {
            padding:
                4px;

            overflow:
                hidden;
        }

        .image-caption {
            padding:
                6px;

            font-size:
                14px;

            line-height:
                1.45;

            white-space:
                pre-wrap;

            overflow-wrap:
                anywhere;
        }

        .empty {
            min-height:
                250px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            flex-direction:
                column;

            color:
                #8a94a6;

            text-align:
                center;
        }

        #composer {
            flex:
                0 0 auto;

            width:
                100%;

            background:
                white;

            border-top:
                1px solid #e5e7eb;

            padding:
                10px 12px 12px;
        }

        .composer-inner {
            width:
                100%;

            max-width:
                850px;

            margin:
                0 auto;

            display:
                flex;

            align-items:
                flex-end;

            gap:
                7px;
        }

        #photoButton {
            width:
                42px;

            height:
                42px;

            flex:
                0 0 42px;

            border:
                1px solid #d7dce3;

            border-radius:
                10px;

            background:
                white;

            cursor:
                pointer;

            font-size:
                19px;
        }

        #imageInput {
            display:
                none;
        }

        #messageInput {
            flex:
                1;

            min-width:
                0;

            min-height:
                42px;

            max-height:
                125px;

            resize:
                none;

            padding:
                10px 12px;

            border:
                1px solid #d7dce3;

            border-radius:
                10px;

            outline:
                none;

            font-family:
                inherit;

            line-height:
                20px;
        }

        #messageInput:focus {
            border-color:
                #4285F4;
        }

        #sendButton {
            height:
                42px;

            padding:
                0 16px;

            border:
                none;

            border-radius:
                10px;

            background:
                #4285F4;

            color:
                white;

            font-weight:
                700;

            cursor:
                pointer;
        }

        #sendButton:disabled {
            opacity:
                .65;
        }

        #imagePreview {
            display:
                none;

            max-width:
                850px;

            margin:
                0 auto 8px;
        }

        .preview-box {
            position:
                relative;

            display:
                inline-block;
        }

        #previewImage {
            max-width:
                170px;

            max-height:
                120px;

            border-radius:
                10px;
        }

        #removeImageButton {
            position:
                absolute;

            top:
                -7px;

            right:
                -7px;

            width:
                23px;

            height:
                23px;

            border:
                none;

            border-radius:
                50%;

            background:
                #ef4444;

            color:
                white;

            cursor:
                pointer;
        }

        .lock-screen {
            height:
                100%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                30px;
        }

        .lock-card {
            max-width:
                500px;

            width:
                100%;

            background:
                white;

            border:
                1px solid #e1e6ee;

            border-radius:
                16px;

            padding:
                35px;

            text-align:
                center;
        }

        .lock-card p {
            color:
                #718096;

            line-height:
                1.6;
        }

        .button {
            display:
                inline-block;

            padding:
                11px 17px;

            background:
                #4285F4;

            color:
                white;

            text-decoration:
                none;

            border-radius:
                9px;

            font-weight:
                600;
        }

        @media (
            max-width: 600px
        ) {

            header {
                height:
                    58px;

                padding:
                    0 11px;
            }

            #chatArea {
                padding:
                    14px 11px 16px;
            }

            .message-content {
                max-width:
                    82%;
            }

            .bubble {
                font-size:
                    14px;
            }

            #composer {
                padding:
                    8px;
            }

            #sendButton {
                padding:
                    0 12px;
            }

        }

    </style>

</head>


<body>


<div
    id="lockScreen"
    class="lock-screen"
    style="display:none;"
>

    <div class="lock-card">

        <div style="font-size:45px;">
            🔒
        </div>

        <h1>
            Chat unavailable
        </h1>

        <p>
            Your Writejot access has expired.
            Renew your subscription to continue
            messaging.
        </p>

        <a
            class="button"
            href="index.html"
        >
            Back to Dashboard
        </a>

    </div>

</div>


<div id="chatInterface">

    <header>

        <a
            href="messages.html"
            class="back"
        >
            ← Messages
        </a>


        <div class="recipient">

            <img
                id="recipientPicture"
                src="W.png"
                alt=""
            >


            <div class="recipient-info">

                <div
                    id="recipientName"
                    class="recipient-name"
                >
                    Loading...
                </div>


                <div
                    id="recipientUsername"
                    class="recipient-username"
                >
                    @username
                </div>

            </div>

        </div>

    </header>


    <main id="chatArea">

        <div id="messages">

            <div class="empty">
                Loading...
            </div>

        </div>

    </main>


    <div id="composer">


        <div id="imagePreview">

            <div class="preview-box">

                <img
                    id="previewImage"
                    src=""
                    alt=""
                >


                <button
                    id="removeImageButton"
                    type="button"
                    onclick="removeSelectedImage()"
                >
                    ×
                </button>

            </div>

        </div>


        <div class="composer-inner">

            <button
                id="photoButton"
                type="button"
                onclick="openImagePicker()"
            >
                📷
            </button>


            <input
                id="imageInput"
                type="file"
                accept="image/*"
                onchange="handleImageSelection(event)"
            >


            <textarea
                id="messageInput"
                maxlength="2000"
                rows="1"
                placeholder="Type a message..."
            ></textarea>


            <button
                id="sendButton"
                type="button"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>

    </div>

</div>


<script>

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


let currentUser =
    null;

let otherUsername =
    "";

let selectedImage =
    null;

let messages =
    [];

let lastFingerprint =
    "";

let refreshTimer =
    null;


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    async function () {

        const saved =
            localStorage.getItem(
                "writejotUser"
            );


        if (!saved) {

            window.location.href =
                "index.html";

            return;

        }


        try {

            currentUser =
                JSON.parse(
                    saved
                );

        } catch {

            window.location.href =
                "index.html";

            return;

        }


        const params =
            new URLSearchParams(
                location.search
            );


        otherUsername =
            normalizeUsername(
                params.get(
                    "username"
                )
            );


        if (!otherUsername) {

            window.location.href =
                "messages.html";

            return;

        }


        const access =
            await verifyAccess();


        if (!access) {
            return;
        }


        loadChatCache();


        setupInput();


        /*
         * Mark read without delaying UI.
         */

        markReadInBackground();


        await refreshChat();


        refreshTimer =
            setInterval(
                refreshChat,
                5000
            );

    }
);


/* =========================================================
   ACCESS
========================================================= */

async function verifyAccess() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=access&email=" +
                encodeURIComponent(
                    currentUser.email
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        if (
            !result.success ||
            !result.access
        ) {

            showLocked();

            return false;

        }


        currentUser.status =
            result.status;


        localStorage.setItem(

            "writejotUser",

            JSON.stringify(
                currentUser
            )

        );


        return true;

    }

    catch (error) {

        showLocked();

        return false;

    }

}


/* =========================================================
   CACHE
========================================================= */

function cacheKey() {

    return (
        "writejot_chat_" +
        String(
            currentUser.email
        )
        .trim()
        .toLowerCase() +
        "_" +
        otherUsername
    );

}


function loadChatCache() {

    try {

        const raw =
            localStorage.getItem(
                cacheKey()
            );


        if (!raw) {
            return;
        }


        const parsed =
            JSON.parse(
                raw
            );


        if (
            !parsed ||
            !Array.isArray(
                parsed.messages
            )
        ) {

            return;

        }


        messages =
            parsed.messages;


        if (
            parsed.profile
        ) {

            applyRecipient(
                parsed.profile
            );

        }


        lastFingerprint =
            fingerprint(
                messages
            );


        renderMessages(
            messages
        );

    }

    catch (error) {}

}


function saveChatCache(
    profile
) {

    try {

        localStorage.setItem(

            cacheKey(),

            JSON.stringify({

                messages:
                    messages.slice(
                        -200
                    ),

                profile:
                    profile ||
                    getCurrentProfile()

            })

        );

    }

    catch (error) {}

}


function getCurrentProfile() {

    return {

        name:
            document
                .getElementById(
                    "recipientName"
                )
                .textContent,

        username:
            otherUsername,

        profilePicture:
            document
                .getElementById(
                    "recipientPicture"
                )
                .src

    };

}


/* =========================================================
   REFRESH
========================================================= */

async function refreshChat() {

    try {

        const profilePromise =
            fetch(

                APPS_SCRIPT_URL +
                "?action=profile&username=" +
                encodeURIComponent(
                    otherUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const messagesPromise =
            fetch(

                APPS_SCRIPT_URL +
                "?action=messages" +
                "&email=" +
                encodeURIComponent(
                    currentUser.email
                ) +
                "&username=" +
                encodeURIComponent(
                    otherUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const [
            profileResponse,
            messagesResponse
        ] =
            await Promise.all([

                profilePromise,

                messagesPromise

            ]);


        const profileResult =
            await profileResponse.json();


        const messageResult =
            await messagesResponse.json();


        if (
            profileResult.accessDenied ||
            messageResult.accessDenied
        ) {

            showLocked();

            return;

        }


        if (
            profileResult.success &&
            profileResult.profile
        ) {

            applyRecipient(
                profileResult.profile
            );

        }


        if (
            messageResult.success
        ) {

            const next =
                messageResult.messages ||
                [];


            const nextFingerprint =
                fingerprint(
                    next
                );


            if (
                nextFingerprint !==
                lastFingerprint
            ) {

                messages =
                    next;

                lastFingerprint =
                    nextFingerprint;


                saveChatCache(
                    profileResult.profile
                );


                renderMessages(
                    messages
                );

            }

        }

    }

    catch (error) {

        console.error(
            "Chat refresh error:",
            error
        );

    }

}


/* =========================================================
   RECIPIENT
========================================================= */

function applyRecipient(
    profile
) {

    document
        .getElementById(
            "recipientName"
        )
        .textContent =
        profile.name ||
        "Writejot User";


    document
        .getElementById(
            "recipientUsername"
        )
        .textContent =
        "@" +
        (
            profile.username ||
            otherUsername
        );


    document
        .getElementById(
            "recipientPicture"
        )
        .src =
        profile.profilePicture ||
        "W.png";

}


/* =========================================================
   READ
========================================================= */

async function markReadInBackground() {

    try {

        await fetch(

            APPS_SCRIPT_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify({

                        action:
                            "markConversationRead",

                        email:
                            currentUser.email,

                        username:
                            otherUsername

                    })

            }

        );

    }

    catch (error) {}

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(
    list
) {

    const container =
        document.getElementById(
            "messages"
        );


    if (
        !list.length
    ) {

        container.innerHTML =

            `
            <div class="empty">

                <div
                    style="
                        font-size:38px;
                        margin-bottom:8px;
                    "
                >
                    💬
                </div>

                No messages yet.
                <br>
                Say hello!

            </div>
            `;


        return;

    }


    const currentUsername =
        normalizeUsername(
            currentUser.username
        );


    container.innerHTML =
        list
            .map(
                function(message) {

                    const mine =
                        normalizeUsername(
                            message.sender
                        ) ===
                        currentUsername;


                    const time =
                        message.timestamp
                            ? new Date(
                                message.timestamp
                              )
                              .toLocaleTimeString(
                                  [],
                                  {
                                      hour:
                                          "numeric",

                                      minute:
                                          "2-digit"
                                  }
                              )
                            : "";


                    const image =
                        message.attachmentType ===
                            "image" &&
                        message.attachmentUrl;


                    if (image) {

                        return `

                            <div
                                class="
                                    message-row
                                    ${
                                        mine
                                            ? "mine"
                                            : "theirs"
                                    }
                                "
                                data-message-id="${
                                    message.id ||
                                    ""
                                }"
                            >

                                <div
                                    class="message-content"
                                >

                                    <div
                                        class="bubble image-bubble"
                                    >

                                        <img
                                            class="message-image"
                                            src="${escapeHtml(
                                                message.attachmentUrl
                                            )}"
                                            alt="Photo"
                                            loading="lazy"
                                            onclick="openImage(
                                                '${escapeHtml(
                                                    message.attachmentUrl
                                                )}'
                                            )"
                                        >


                                        ${
                                            message.message
                                                ? `
                                                    <div
                                                        class="image-caption"
                                                    >
                                                        ${escapeHtml(
                                                            message.message
                                                        )}
                                                    </div>
                                                  `
                                                : ""
                                        }

                                    </div>


                                    <div class="time">
                                        ${escapeHtml(
                                            time
                                        )}
                                    </div>

                                </div>

                            </div>

                        `;

                    }


                    return `

                        <div
                            class="
                                message-row
                                ${
                                    mine
                                        ? "mine"
                                        : "theirs"
                                }
                            "
                        >

                            <div
                                class="message-content"
                            >

                                <div
                                    class="bubble"
                                >
                                    ${escapeHtml(
                                        String(
                                            message.message ||
                                            ""
                                        )
                                    )}
                                </div>


                                <div class="time">

                                    ${escapeHtml(
                                        time
                                    )}

                                </div>

                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    requestAnimationFrame(
        function() {

            const area =
                document.getElementById(
                    "chatArea"
                );


            area.scrollTop =
                area.scrollHeight;

        }
    );

}


/* =========================================================
   OPTIMISTIC SEND
========================================================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const text =
        input.value.trim();


    if (
        !text &&
        !selectedImage
    ) {

        return;

    }


    /*
     * TEXT ONLY:
     * Show instantly.
     */

    if (
        !selectedImage
    ) {

        const tempId =
            "temp_" +
            Date.now();


        const optimistic = {

            id:
                tempId,

            sender:
                normalizeUsername(
                    currentUser.username
                ),

            receiver:
                otherUsername,

            message:
                text,

            timestamp:
                new Date()
                .toISOString(),

            attachmentType:
                "",

            attachmentUrl:
                "",

            pending:
                true

        };


        messages.push(
            optimistic
        );


        renderMessages(
            messages
        );


        saveChatCache();


        input.value =
            "";

        input.style.height =
            "42px";


        button.disabled =
            true;


        try {

            const response =
                await fetch(

                    APPS_SCRIPT_URL,

                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "text/plain;charset=utf-8"

                        },

                        body:
                            JSON.stringify({

                                action:
                                    "sendMessage",

                                email:
                                    currentUser.email,

                                receiver:
                                    otherUsername,

                                message:
                                    text

                            })

                    }

                );


            const result =
                await response.json();


            if (
                !result.success
            ) {

                throw new Error(
                    result.error ||
                    "Could not send message."
                );

            }


            /*
             * Don't wait before refreshing.
             */

            await refreshChat();

        }

        catch (error) {

            messages =
                messages.map(
                    function(item) {

                        if (
                            item.id ===
                            tempId
                        ) {

                            return {

                                ...item,

                                pending:
                                    false,

                                failed:
                                    true

                            };

                        }


                        return item;

                    }
                );


            renderMessages(
                messages
            );


            alert(
                error.message
            );

        }

        finally {

            button.disabled =
                false;

            input.focus();

        }


        return;

    }


    /*
     * PHOTO:
     * Upload normally.
     */

    button.disabled =
        true;

    button.textContent =
        "Uploading...";


    try {

        const compressed =
            await compressImage(
                selectedImage
            );


        const response =
            await fetch(

                APPS_SCRIPT_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "sendMessage",

                            email:
                                currentUser.email,

                            receiver:
                                otherUsername,

                            message:
                                text,

                            attachmentType:
                                "image",

                            attachmentData:
                                compressed.dataUrl,

                            attachmentMime:
                                compressed.mimeType,

                            attachmentName:
                                compressed.fileName

                        })

                }

            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Could not upload photo."
            );

        }


        input.value =
            "";

        input.style.height =
            "42px";


        removeSelectedImage();


        await refreshChat();

    }

    catch (error) {

        alert(
            error.message
        );

    }

    finally {

        button.disabled =
            false;

        button.textContent =
            "Send";

        input.focus();

    }

}


/* =========================================================
   INPUT
========================================================= */

function setupInput() {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.addEventListener(
        "input",
        function() {

            input.style.height =
                "auto";


            input.style.height =
                Math.min(
                    input.scrollHeight,
                    125
                ) +
                "px";

        }
    );


    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                    "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );

}


/* =========================================================
   IMAGE
========================================================= */

function openImagePicker() {

    document
        .getElementById(
            "imageInput"
        )
        .click();

}


function handleImageSelection(
    event
) {

    const file =
        event.target.files &&
        event.target.files[0];


    if (!file) {
        return;
    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Please select an image."
        );

        return;

    }


    if (
        file.size >
        10 * 1024 * 1024
    ) {

        alert(
            "Please select an image smaller than 10 MB."
        );

        return;

    }


    selectedImage =
        file;


    const reader =
        new FileReader();


    reader.onload =
        function() {

            document
                .getElementById(
                    "previewImage"
                )
                .src =
                reader.result;


            document
                .getElementById(
                    "imagePreview"
                )
                .style.display =
                "block";

        };


    reader.readAsDataURL(
        file
    );

}


function removeSelectedImage() {

    selectedImage =
        null;


    document
        .getElementById(
            "imageInput"
        )
        .value =
        "";


    document
        .getElementById(
            "previewImage"
        )
        .src =
        "";


    document
        .getElementById(
            "imagePreview"
        )
        .style.display =
        "none";

}


function compressImage(
    file
) {

    return new Promise(
        function(
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onerror =
                reject;


            reader.onload =
                function() {

                    const image =
                        new Image();


                    image.onerror =
                        reject;


                    image.onload =
                        function() {

                            const max =
                                1600;


                            let width =
                                image.width;

                            let height =
                                image.height;


                            if (
                                width >
                                max ||
                                height >
                                max
                            ) {

                                if (
                                    width >
                                    height
                                ) {

                                    height =
                                        Math.round(
                                            height *
                                            max /
                                            width
                                        );

                                    width =
                                        max;

                                }

                                else {

                                    width =
                                        Math.round(
                                            width *
                                            max /
                                            height
                                        );

                                    height =
                                        max;

                                }

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            canvas
                                .getContext(
                                    "2d"
                                )
                                .drawImage(
                                    image,
                                    0,
                                    0,
                                    width,
                                    height
                                );


                            resolve({

                                dataUrl:
                                    canvas.toDataURL(
                                        "image/jpeg",
                                        .82
                                    ),

                                mimeType:
                                    "image/jpeg",

                                fileName:
                                    "photo-" +
                                    Date.now() +
                                    ".jpg"

                            });

                        };


                    image.src =
                        reader.result;

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   LOCK
========================================================= */

function showLocked() {

    if (
        refreshTimer
    ) {

        clearInterval(
            refreshTimer
        );

    }


    document
        .getElementById(
            "chatInterface"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "lockScreen"
        )
        .style.display =
        "flex";

}


/* =========================================================
   FINGERPRINT
========================================================= */

function fingerprint(
    value
) {

    return JSON.stringify(
        value
    );

}


function normalizeUsername(
    value
) {

    return String(
        value ||
        ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /^@/,
        ""
    );

}


function escapeHtml(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function openImage(
    url
) {

    window.open(
        url,
        "_blank"
    );

}
