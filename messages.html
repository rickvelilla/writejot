<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Writejot | Messages</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f6f8fc;

            color:
                #1f2937;
        }

        header {
            background: white;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                13px 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            position: sticky;

            top: 0;

            z-index: 20;
        }

        .brand {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .brand img {
            width: 40px;
            height: 40px;

            object-fit: contain;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;
        }

        .back {
            color: #4285F4;

            text-decoration: none;

            font-weight: 600;
        }

        main {
            max-width: 850px;

            margin:
                30px auto 60px;

            padding:
                0 16px;
        }

        .title-row {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom:
                18px;
        }

        .title-row h1 {
            margin: 0;
        }

        .unread-total {
            display: none;

            min-width: 24px;
            height: 24px;

            padding: 0 7px;

            border-radius: 999px;

            background: #ef4444;

            color: white;

            font-size: 12px;

            font-weight: 700;

            align-items: center;

            justify-content: center;
        }

        .list {
            background: white;

            border:
                1px solid #e1e6ee;

            border-radius: 15px;

            overflow: hidden;
        }

        .conversation {
            display: flex;

            align-items: center;

            gap: 12px;

            padding:
                14px 16px;

            text-decoration: none;

            color: inherit;

            border-bottom:
                1px solid #edf0f4;

            cursor: pointer;

            transition:
                background .15s;
        }

        .conversation:last-child {
            border-bottom: none;
        }

        .conversation:hover {
            background:
                #f8faff;
        }

        .conversation.unread {
            background:
                #f5f9ff;
        }

        .avatar {
            width: 48px;
            height: 48px;

            border-radius: 50%;

            object-fit: cover;

            flex: 0 0 48px;

            background:
                #e8edf4;
        }

        .conversation-main {
            flex: 1;

            min-width: 0;
        }

        .top-line {
            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 2px;
        }

        .name {
            font-weight: 700;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }

        .username {
            color: #4285F4;

            font-size: 12px;
        }

        .preview {
            color: #7b8494;

            font-size: 13px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .conversation.unread .preview {
            color: #344054;

            font-weight: 600;
        }

        .conversation-side {
            display: flex;

            align-items: flex-end;

            flex-direction: column;

            gap: 5px;

            flex-shrink: 0;
        }

        .time {
            color: #98a2b3;

            font-size: 10px;
        }

        .unread {
            min-width: 21px;

            height: 21px;

            padding:
                0 6px;

            border-radius:
                999px;

            background:
                #4285F4;

            color:
                white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 11px;

            font-weight: 700;
        }

        .empty {
            padding:
                60px 25px;

            text-align: center;

            color:
                #8a94a6;
        }

        .loading-small {
            color:
                #8a94a6;

            font-size:
                13px;
        }

        .lock-screen {
            min-height: 65vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;
        }

        .lock-card {
            max-width: 500px;

            width: 100%;

            background: white;

            border:
                1px solid #e1e6ee;

            border-radius: 16px;

            padding: 35px;

            text-align: center;
        }

        .lock-icon {
            font-size: 45px;
        }

        .lock-card p {
            color:
                #718096;

            line-height:
                1.6;
        }

        .button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding:
                11px 17px;

            background:
                #4285F4;

            color:
                white;

            text-decoration:
                none;

            border-radius:
                9px;

            font-weight:
                600;

            margin-top:
                8px;
        }

        @media (
            max-width: 600px
        ) {

            header {
                padding:
                    10px 14px;
            }

            .brand-name {
                font-size:
                    20px;
            }

            main {
                margin-top:
                    18px;
            }

            .conversation {
                padding:
                    12px;
            }

            .avatar {
                width:
                    44px;

                height:
                    44px;

                flex-basis:
                    44px;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="brand">

        <img
            src="W.png"
            alt="Writejot"
        >

        <div class="brand-name">
            Writejot
        </div>

    </div>

    <a
        class="back"
        href="index.html"
    >
        ← Dashboard
    </a>

</header>


<div
    id="lockScreen"
    class="lock-screen"
    style="display:none;"
>

    <div class="lock-card">

        <div class="lock-icon">
            🔒
        </div>

        <h1>
            Messages unavailable
        </h1>

        <p>
            Your Writejot access has expired.
            Renew your subscription to continue
            using Messages.
        </p>

        <a
            class="button"
            href="index.html"
        >
            Back to Dashboard
        </a>

    </div>

</div>


<main
    id="mainContent"
>

    <div class="title-row">

        <h1>
            Messages
        </h1>

        <div
            id="unreadTotal"
            class="unread-total"
        ></div>

    </div>


    <div
        id="statusText"
        class="loading-small"
        style="margin-bottom:10px;"
    >
        Loading...

    </div>


    <div
        id="conversationList"
        class="list"
    >

        <div class="empty">
            Loading conversations...
        </div>

    </div>

</main>


<script>

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


let currentUser =
    null;

let conversations =
    [];

let refreshTimer =
    null;

let lastFingerprint =
    "";


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    async function () {

        const saved =
            localStorage.getItem(
                "writejotUser"
            );


        if (!saved) {

            window.location.href =
                "index.html";

            return;

        }


        try {

            currentUser =
                JSON.parse(
                    saved
                );

        } catch {

            localStorage.removeItem(
                "writejotUser"
            );

            window.location.href =
                "index.html";

            return;

        }


        const access =
            await verifyAccess();


        if (!access) {
            return;
        }


        /*
         * Cached data can now be shown
         * because the server confirmed access.
         */

        loadConversationCache();


        await refreshConversations();


        refreshTimer =
            setInterval(
                refreshConversations,
                5000
            );

    }
);


/* =========================================================
   ACCESS
========================================================= */

async function verifyAccess() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=access&email=" +
                encodeURIComponent(
                    currentUser.email
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        if (
            !result.success ||
            !result.access
        ) {

            showLocked();

            return false;

        }


        currentUser.status =
            result.status;


        localStorage.setItem(
            "writejotUser",
            JSON.stringify(
                currentUser
            )
        );


        return true;

    }

    catch (error) {

        /*
         * Don't use stale cache to grant
         * access if the server cannot verify.
         */

        showServerError();

        return false;

    }

}


/* =========================================================
   CACHE
========================================================= */

function cacheKey() {

    return (
        "writejot_conversations_" +
        String(
            currentUser.email
        )
        .trim()
        .toLowerCase()
    );

}


function loadConversationCache() {

    try {

        const raw =
            localStorage.getItem(
                cacheKey()
            );


        if (!raw) {
            return;
        }


        const parsed =
            JSON.parse(
                raw
            );


        if (
            !Array.isArray(
                parsed
            )
        ) {

            return;

        }


        conversations =
            parsed;


        renderConversations();

    }

    catch (error) {

        console.log(
            "Conversation cache unavailable"
        );

    }

}


function saveConversationCache() {

    try {

        localStorage.setItem(

            cacheKey(),

            JSON.stringify(
                conversations
            )

        );

    }

    catch (error) {}

}


/* =========================================================
   REFRESH
========================================================= */

async function refreshConversations() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=conversations&email=" +
                encodeURIComponent(
                    currentUser.email
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        if (
            result.accessDenied
        ) {

            showLocked();

            return;

        }


        if (
            !result.success
        ) {

            return;

        }


        const next =
            result.conversations ||
            [];


        const nextFingerprint =
            JSON.stringify(
                next
            );


        /*
         * Don't rebuild the DOM unless
         * the conversation data changed.
         */

        if (
            nextFingerprint !==
            lastFingerprint
        ) {

            conversations =
                next;

            lastFingerprint =
                nextFingerprint;


            saveConversationCache();

            renderConversations();

        }


        document
            .getElementById(
                "statusText"
            )
            .textContent =
            "";

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderConversations() {

    const list =
        document.getElementById(
            "conversationList"
        );


    const unreadTotalElement =
        document.getElementById(
            "unreadTotal"
        );


    if (
        !conversations.length
    ) {

        list.innerHTML =

            `
            <div class="empty">

                No conversations yet.

                <br><br>

                Search for a profile
                from your dashboard to
                start a conversation.

            </div>
            `;


        unreadTotalElement.style.display =
            "none";


        return;

    }


    let totalUnread =
        0;


    conversations.forEach(
        function(conversation) {

            totalUnread +=
                Number(
                    conversation.unreadCount ||
                    0
                );

        }
    );


    if (
        totalUnread >
        0
    ) {

        unreadTotalElement.textContent =
            totalUnread;


        unreadTotalElement.style.display =
            "flex";

    }

    else {

        unreadTotalElement.style.display =
            "none";

    }


    list.innerHTML =
        conversations
            .map(
                function(conversation) {

                    const unread =
                        Number(
                            conversation.unreadCount ||
                            0
                        );


                    return `

                        <a
                            class="
                                conversation
                                ${
                                    unread > 0
                                        ? "unread"
                                        : ""
                                }
                            "
                            href="chat.html?username=${encodeURIComponent(
                                conversation.username
                            )}"
                        >

                            <img
                                class="avatar"
                                src="${escapeHtml(
                                    conversation.profilePicture ||
                                    "W.png"
                                )}"
                                onerror="this.src='W.png'"
                                alt=""
                            >


                            <div class="conversation-main">

                                <div class="top-line">

                                    <div class="name">
                                        ${escapeHtml(
                                            conversation.name ||
                                            "Writejot User"
                                        )}
                                    </div>

                                    <div class="username">
                                        @${escapeHtml(
                                            conversation.username
                                        )}
                                    </div>

                                </div>


                                <div class="preview">

                                    ${escapeHtml(
                                        conversation.lastMessage ||
                                        "No messages"
                                    )}

                                </div>

                            </div>


                            <div class="conversation-side">

                                <div class="time">
                                    ${escapeHtml(
                                        formatTime(
                                            conversation.timestamp
                                        )
                                    )}
                                </div>


                                ${
                                    unread > 0
                                        ? `
                                            <div class="unread">
                                                ${
                                                    unread > 99
                                                        ? "99+"
                                                        : unread
                                                }
                                            </div>
                                          `
                                        : ""
                                }

                            </div>

                        </a>

                    `;

                }
            )
            .join("");

}


/* =========================================================
   LOCK
========================================================= */

function showLocked() {

    if (
        refreshTimer
    ) {

        clearInterval(
            refreshTimer
        );

    }


    document
        .getElementById(
            "mainContent"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "lockScreen"
        )
        .style.display =
        "flex";

}


function showServerError() {

    document
        .getElementById(
            "statusText"
        )
        .textContent =
        "Unable to verify your account right now.";

}


/* =========================================================
   HELPERS
========================================================= */

function formatTime(
    value
) {

    if (!value) {
        return "";
    }


    const date =
        new Date(
            value
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(
        [],
        {
            month:
                "short",
            day:
                "numeric",
            hour:
                "numeric",
            minute:
                "2-digit"
        }
    );

}


function escapeHtml(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

</script>

</body>

</html>
