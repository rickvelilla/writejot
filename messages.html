<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Writejot | Messages</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }


        body {

            margin: 0;

            padding: 0;

            min-height: 100vh;

            width: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f6f8fc;

            color:
                #1f2937;
        }



        /* =====================================================
           PAGE
        ===================================================== */

        .messages-page {

            width: 100%;

            max-width: 820px;

            margin:
                0 auto;

            padding:
                28px 18px 60px;
        }



        /* =====================================================
           HEADER
        ===================================================== */

        .messages-header {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            margin-bottom:
                18px;
        }


        .messages-header h1 {

            margin: 0;

            font-size:
                34px;

            line-height:
                1.1;
        }


        .unread-total {

            min-width: 26px;

            height: 26px;

            padding:
                0 8px;

            border-radius:
                999px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                #ef4444;

            color:
                white;

            font-size:
                12px;

            font-weight:
                700;
        }


        .unread-total.hidden {

            display: none;
        }



        /* =====================================================
           CONVERSATION LIST

           IMPORTANT:
           No fixed height.
           No max-height.
           No overflow:hidden.
        ===================================================== */

        #conversationList {

            width: 100%;

            height: auto;

            min-height: 0;

            max-height: none;

            overflow: visible;

            display: flex;

            flex-direction: column;

            background:
                white;

            border:
                1px solid #e1e6ee;

            border-radius:
                16px;

            box-shadow:
                0 8px 30px
                rgba(
                    0,
                    0,
                    0,
                    .04
                );
        }



        /* =====================================================
           CONVERSATION
        ===================================================== */

        .conversation {

            width: 100%;

            min-height:
                78px;

            padding:
                14px 16px;

            display: flex;

            align-items: center;

            border-bottom:
                1px solid #edf0f4;

            background:
                white;

            cursor:
                pointer;

            transition:
                background .15s ease,
                transform .08s ease;
        }


        .conversation:last-child {

            border-bottom:
                none;
        }


        .conversation:hover {

            background:
                #f8faff;
        }


        .conversation:active {

            transform:
                scale(.997);
        }



        /* =====================================================
           UNREAD CONVERSATION
        ===================================================== */

        .conversation.unread {

            background:
                #f7faff;
        }


        .conversation.unread:hover {

            background:
                #f0f6ff;
        }



        /* =====================================================
           PROFILE PICTURE
        ===================================================== */

        .conversation-picture {

            width:
                50px;

            height:
                50px;

            min-width:
                50px;

            border-radius:
                50%;

            object-fit:
                cover;

            background:
                #edf2f7;

            border:
                2px solid #4285F4;
        }



        /* =====================================================
           MIDDLE CONTENT
        ===================================================== */

        .conversation-content {

            flex:
                1;

            min-width:
                0;

            padding:
                0 13px;
        }


        .conversation-top {

            display:
                flex;

            align-items:
                center;

            min-width:
                0;

            gap:
                6px;
        }


        .conversation-name {

            min-width:
                0;

            font-size:
                15px;

            font-weight:
                700;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }


        .conversation.unread
        .conversation-name {

            font-weight:
                800;
        }


        .conversation-username {

            flex-shrink:
                0;

            color:
                #4285F4;

            font-size:
                12px;

            white-space:
                nowrap;
        }


        .conversation-preview {

            margin-top:
                4px;

            color:
                #718096;

            font-size:
                13px;

            line-height:
                1.3;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }


        .conversation.unread
        .conversation-preview {

            color:
                #374151;

            font-weight:
                600;
        }



        /* =====================================================
           RIGHT SIDE
        ===================================================== */

        .conversation-right {

            flex-shrink:
                0;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                flex-end;

            gap:
                7px;
        }


        .conversation-time {

            color:
                #8a94a6;

            font-size:
                11px;

            white-space:
                nowrap;
        }



        /* =====================================================
           UNREAD BADGE
        ===================================================== */

        .unread-badge {

            min-width:
                23px;

            height:
                23px;

            padding:
                0 7px;

            border-radius:
                999px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                #4285F4;

            color:
                white;

            font-size:
                11px;

            font-weight:
                700;
        }


        .unread-badge.hidden {

            display:
                none;
        }



        /* =====================================================
           EMPTY / LOADING
        ===================================================== */

        .messages-empty {

            padding:
                60px 20px;

            text-align:
                center;

            color:
                #718096;

            background:
                white;

            border-radius:
                16px;
        }


        .messages-loading {

            padding:
                40px 20px;

            text-align:
                center;

            color:
                #718096;

            background:
                white;

            border-radius:
                16px;
        }


        .spinner {

            width:
                25px;

            height:
                25px;

            margin:
                0 auto 10px;

            border:
                3px solid #e5e7eb;

            border-top-color:
                #4285F4;

            border-radius:
                50%;

            animation:
                spin .7s linear infinite;
        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);
            }
        }



        /* =====================================================
           ERROR
        ===================================================== */

        .messages-error {

            padding:
                30px 20px;

            text-align:
                center;

            color:
                #dc2626;

            background:
                white;

            border-radius:
                16px;
        }



        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .dashboard-link {

            display:
                inline-block;

            margin-top:
                15px;

            color:
                #4285F4;

            text-decoration:
                none;

            font-weight:
                600;
        }



        /* =====================================================
           MOBILE
        ===================================================== */

        @media (
            max-width: 600px
        ) {

            .messages-page {

                padding:
                    20px 10px 40px;
            }


            .messages-header h1 {

                font-size:
                    28px;
            }


            .conversation {

                min-height:
                    70px;

                padding:
                    12px;
            }


            .conversation-picture {

                width:
                    45px;

                height:
                    45px;

                min-width:
                    45px;
            }


            .conversation-content {

                padding:
                    0 9px;
            }


            .conversation-name {

                font-size:
                    14px;
            }


            .conversation-username {

                font-size:
                    11px;
            }


            .conversation-preview {

                font-size:
                    12px;
            }


            .conversation-time {

                font-size:
                    10px;
            }

        }

    </style>

</head>



<body>


<main
    class="messages-page"
>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div
        class="messages-header"
    >

        <h1>
            Messages
        </h1>


        <div
            id="unreadTotal"
            class="unread-total hidden"
        ></div>

    </div>



    <!-- =====================================================
         CONVERSATIONS
    ====================================================== -->

    <div
        id="conversationList"
    >

        <div
            class="messages-loading"
        >

            <div
                class="spinner"
            ></div>

            Loading conversations...

        </div>

    </div>


</main>



<script>


/* =========================================================
   CONFIG
========================================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


const CACHE_TIME =
    5 * 60 * 1000;


const REFRESH_INTERVAL =
    15000;


let currentUser =
    null;


let conversations =
    [];


let refreshTimer =
    null;


let firstServerLoad =
    true;



/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    function () {

        initialize();

    }
);



async function initialize() {

    const saved =
        localStorage.getItem(
            "writejotUser"
        );


    if (
        !saved
    ) {

        showError(
            "Please sign in to Writejot first."
        );

        return;

    }


    try {

        currentUser =
            JSON.parse(
                saved
            );

    }

    catch (
        error
    ) {

        localStorage.removeItem(
            "writejotUser"
        );


        showError(
            "Your Writejot session could not be loaded."
        );


        return;

    }


    /*
     * =====================================================
     * CACHE FIRST
     *
     * Render cached conversations immediately.
     * Do NOT clear them while server loads.
     * =====================================================
     */

    loadCache();


    if (
        conversations.length
    ) {

        renderConversations();

    }


    /*
     * Fetch current data in background.
     */

    await loadConversations();


    /*
     * Continue checking for new messages.
     */

    startRefreshTimer();

}



/* =========================================================
   CACHE KEY
========================================================= */

function getCacheKey() {

    return (
        "writejot_conversations_" +
        normalizeEmail(
            currentUser.email
        )
    );

}



/* =========================================================
   LOAD CACHE
========================================================= */

function loadCache() {

    try {

        const raw =
            localStorage.getItem(
                getCacheKey()
            );


        if (
            !raw
        ) {

            return;

        }


        const cached =
            JSON.parse(
                raw
            );


        if (
            !Array.isArray(
                cached.conversations
            )
        ) {

            return;

        }


        /*
         * We can display cached content
         * immediately.
         */

        conversations =
            cached.conversations
                .slice();


    }

    catch (
        error
    ) {

        console.log(
            "Conversation cache could not be read."
        );

    }

}



/* =========================================================
   SAVE CACHE
========================================================= */

function saveCache() {

    try {

        localStorage.setItem(

            getCacheKey(),

            JSON.stringify({

                savedAt:
                    Date.now(),

                conversations:
                    conversations

            })

        );

    }

    catch (
        error
    ) {

        console.log(
            "Conversation cache could not be saved."
        );

    }

}



/* =========================================================
   LOAD CONVERSATIONS
========================================================= */

async function loadConversations() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=conversations" +
                "&email=" +
                encodeURIComponent(
                    currentUser.email
                ),

                {
                    cache:
                        "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const result =
            await response.json();


        /*
         * Access expired.
         */

        if (
            result.accessDenied === true ||
            result.access === false
        ) {

            showError(
                result.error ||
                "Your Writejot access has expired."
            );


            return;

        }


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Could not load conversations."
            );

        }


        /*
         * Update data.
         */

        conversations =
            Array.isArray(
                result.conversations
            )
                ? result.conversations
                : [];


        /*
         * Store locally.
         */

        saveCache();


        /*
         * Render normally.
         */

        renderConversations();


        firstServerLoad =
            false;

    }

    catch (
        error
    ) {

        console.error(
            "Conversation loading error:",
            error
        );


        /*
         * IMPORTANT:
         *
         * If cached data exists, DON'T replace it
         * with an error message.
         */

        if (
            conversations.length
        ) {

            renderConversations();

            return;

        }


        if (
            firstServerLoad
        ) {

            showError(
                "Could not load your messages."
            );

        }

    }

}



/* =========================================================
   START AUTO REFRESH
========================================================= */

function startRefreshTimer() {

    if (
        refreshTimer
    ) {

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer =
        setInterval(
            function () {

                /*
                 * Only refresh while the page
                 * is visible.
                 */

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    loadConversations();

                }

            },

            REFRESH_INTERVAL

        );

}



/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function () {

        if (
            document.visibilityState ===
            "visible"
        ) {

            loadConversations();

        }

    }
);



/* =========================================================
   RENDER
========================================================= */

function renderConversations() {

    const list =
        document.getElementById(
            "conversationList"
        );


    /*
     * IMPORTANT:
     *
     * Never give the list a fixed height.
     */

    list.style.height =
        "auto";


    list.style.maxHeight =
        "none";


    list.style.overflow =
        "visible";


    /*
     * No conversations.
     */

    if (
        !conversations.length
    ) {

        list.innerHTML =

            `
            <div
                class="messages-empty"
            >

                <div
                    style="
                        font-size:42px;
                        margin-bottom:12px;
                    "
                >
                    💬
                </div>


                <strong>
                    No conversations yet.
                </strong>


                <div
                    style="
                        margin-top:6px;
                    "
                >
                    Search for a student to start
                    a conversation.
                </div>


                <a
                    href="index.html"
                    class="dashboard-link"
                >
                    ← Back to Dashboard
                </a>

            </div>
            `;


        updateUnreadTotal();


        return;

    }


    list.innerHTML =
        conversations
            .map(
                function (
                    conversation
                ) {

                    return renderConversation(
                        conversation
                    );

                }
            )
            .join("");


    /*
     * Update notification counter.
     */

    updateUnreadTotal();

}



/* =========================================================
   RENDER ONE CONVERSATION
========================================================= */

function renderConversation(
    conversation
) {

    const username =
        normalizeUsername(
            conversation.username
        );


    const name =
        conversation.name ||
        "Writejot User";


    const picture =
        conversation.profilePicture ||
        "W.png";


    const preview =
        conversation.lastMessage ||
        "";


    const unread =
        Math.max(
            0,
            Number(
                conversation.unreadCount ||
                0
            )
        );


    const isUnread =
        unread > 0;


    const time =
        formatConversationTime(
            conversation.timestamp
        );


    return `

        <div
            class="
                conversation
                ${
                    isUnread
                        ? "unread"
                        : ""
                }
            "
            data-username="${escapeHtml(
                username
            )}"
            role="button"
            tabindex="0"
            onclick="
                openConversation(
                    '${escapeJs(
                        username
                    )}'
                )
            "
            onkeydown="
                handleConversationKey(
                    event,
                    '${escapeJs(
                        username
                    )}'
                )
            "
        >


            <img
                class="conversation-picture"
                src="${escapeHtml(
                    picture
                )}"
                alt=""
                loading="lazy"
                onerror="
                    this.src='W.png';
                "
            >



            <div
                class="conversation-content"
            >

                <div
                    class="conversation-top"
                >

                    <div
                        class="conversation-name"
                    >
                        ${escapeHtml(
                            name
                        )}
                    </div>


                    <div
                        class="
                            conversation-username
                        "
                    >
                        @${escapeHtml(
                            username
                        )}
                    </div>

                </div>


                <div
                    class="
                        conversation-preview
                    "
                >
                    ${escapeHtml(
                        preview ||
                        "No messages yet."
                    )}
                </div>

            </div>



            <div
                class="
                    conversation-right
                "
            >

                <div
                    class="
                        conversation-time
                    "
                >
                    ${escapeHtml(
                        time
                    )}
                </div>


                <div
                    class="
                        unread-badge
                        ${
                            isUnread
                                ? ""
                                : "hidden"
                        }
                    "
                >
                    ${
                        unread > 99
                            ? "99+"
                            : unread
                    }
                </div>

            </div>

        </div>

    `;

}



/* =========================================================
   OPEN CONVERSATION
========================================================= */

function openConversation(
    username
) {

    const cleaned =
        normalizeUsername(
            username
        );


    if (
        !cleaned
    ) {

        return;

    }


    window.location.href =
        "chat.html?username=" +
        encodeURIComponent(
            cleaned
        );

}



/* =========================================================
   KEYBOARD
========================================================= */

function handleConversationKey(
    event,
    username
) {

    if (
        event.key ===
            "Enter" ||
        event.key ===
            " "
    ) {

        event.preventDefault();


        openConversation(
            username
        );

    }

}



/* =========================================================
   UNREAD TOTAL
========================================================= */

function updateUnreadTotal() {

    const badge =
        document.getElementById(
            "unreadTotal"
        );


    /*
     * THIS IS IMPORTANT:
     *
     * Sum every conversation's unreadCount.
     *
     * Do NOT just use conversations.length.
     */

    let total =
        0;


    conversations.forEach(
        function (
            conversation
        ) {

            const unread =
                Number(
                    conversation.unreadCount ||
                    0
                );


            if (
                Number.isFinite(
                    unread
                ) &&
                unread > 0
            ) {

                total +=
                    unread;

            }

        }
    );


    if (
        total <= 0
    ) {

        badge.textContent =
            "";

        badge.classList.add(
            "hidden"
        );

        return;

    }


    badge.classList.remove(
        "hidden"
    );


    badge.textContent =
        total > 99
            ? "99+"
            : String(
                total
            );

}



/* =========================================================
   TIME
========================================================= */

function formatConversationTime(
    timestamp
) {

    if (
        !timestamp
    ) {

        return "";

    }


    const date =
        new Date(
            timestamp
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    const now =
        new Date();


    const sameDay =
        date.toDateString() ===
        now.toDateString();


    if (
        sameDay
    ) {

        return date.toLocaleTimeString(
            [],
            {
                hour:
                    "numeric",

                minute:
                    "2-digit"
            }
        );

    }


    const difference =
        now.getTime() -
        date.getTime();


    const oneDay =
        24 *
        60 *
        60 *
        1000;


    if (
        difference >= 0 &&
        difference < 7 * oneDay
    ) {

        return date.toLocaleDateString(
            [],
            {
                weekday:
                    "short"
            }
        );

    }


    return date.toLocaleDateString(
        [],
        {
            month:
                "short",

            day:
                "numeric"
        }
    );

}



/* =========================================================
   NORMALIZE
========================================================= */

function normalizeUsername(
    username
) {

    return String(
        username ||
        ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /^@/,
        ""
    );

}


function normalizeEmail(
    email
) {

    return String(
        email ||
        ""
    )
    .trim()
    .toLowerCase();

}



/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



/* =========================================================
   JAVASCRIPT STRING ESCAPE
========================================================= */

function escapeJs(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\r/g,
        "\\r"
    )
    .replace(
        /\n/g,
        "\\n"
    );

}



/* =========================================================
   ERROR
========================================================= */

function showError(
    message
) {

    const list =
        document.getElementById(
            "conversationList"
        );


    list.innerHTML =

        `
        <div
            class="messages-error"
        >

            ${escapeHtml(
                message
            )}


            <br>


            <a
                href="index.html"
                class="dashboard-link"
            >
                ← Back to Dashboard
            </a>

        </div>
        `;

}

</script>


</body>

</html>
