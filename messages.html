<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Writejot | Messages</title>


    <style>

        * {
            box-sizing:
                border-box;
        }


        body {

            margin:
                0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f6f8fc;

            color:
                #1f2937;

            min-height:
                100vh;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            background:
                white;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                12px 6%;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            position:
                sticky;

            top:
                0;

            z-index:
                100;

        }


        .brand {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

        }


        .brand img {

            width:
                42px;

            height:
                42px;

            object-fit:
                contain;

        }


        .brand-name {

            font-size:
                23px;

            font-weight:
                700;

        }


        .back {

            color:
                #4285F4;

            text-decoration:
                none;

            font-weight:
                600;

        }


        /* =========================
           MAIN
        ========================= */

        main {

            width:
                100%;

            max-width:
                720px;

            margin:
                30px auto;

            padding:
                0 16px;

        }


        .messages-card {

            background:
                white;

            border:
                1px solid #e1e6ee;

            border-radius:
                16px;

            overflow:
                hidden;

            box-shadow:
                0 6px 20px
                rgba(0,0,0,0.04);

        }


        .title {

            padding:
                22px;

            border-bottom:
                1px solid #edf0f4;

        }


        .title h1 {

            margin:
                0 0 3px;

            font-size:
                25px;

        }


        .title p {

            margin:
                0;

            color:
                #718096;

        }


        /* =========================
           SEARCH
        ========================= */

        .search-wrap {

            padding:
                14px 16px;

            border-bottom:
                1px solid #edf0f4;

        }


        #conversationSearch {

            width:
                100%;

            height:
                44px;

            padding:
                0 14px;

            border:
                1px solid #d8dee8;

            border-radius:
                10px;

            outline:
                none;

            font-size:
                14px;

            background:
                white;

        }


        #conversationSearch:focus {

            border-color:
                #4285F4;

            box-shadow:
                0 0 0 3px
                rgba(66,133,244,0.08);

        }


        /* =========================
           REFRESH STATUS
        ========================= */

        #refreshStatus {

            display:
                none;

            padding:
                7px 16px;

            text-align:
                center;

            font-size:
                12px;

            color:
                #98a2b3;

            border-bottom:
                1px solid #edf0f4;

        }


        /* =========================
           CONVERSATIONS
        ========================= */

        .conversation {

            display:
                flex;

            align-items:
                center;

            gap:
                13px;

            padding:
                14px 17px;

            text-decoration:
                none;

            border-bottom:
                1px solid #f0f2f5;

            color:
                inherit;

            transition:
                background .15s ease;

        }


        .conversation:hover {

            background:
                #f7faff;

        }


        .conversation.unread {

            background:
                #f5f9ff;

        }


        .conversation.unread:hover {

            background:
                #eef5ff;

        }


        .conversation-picture {

            width:
                54px;

            height:
                54px;

            border-radius:
                50%;

            object-fit:
                cover;

            border:
                1px solid #dbe3ef;

            flex-shrink:
                0;

        }


        .conversation-content {

            min-width:
                0;

            flex:
                1;

        }


        .conversation-top {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                10px;

        }


        .conversation-name {

            font-weight:
                600;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        .conversation.unread
        .conversation-name {

            font-weight:
                700;

        }


        .conversation-time {

            color:
                #98a2b3;

            font-size:
                11px;

            white-space:
                nowrap;

        }


        .conversation-preview-row {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            margin-top:
                3px;

        }


        .conversation-preview {

            color:
                #718096;

            font-size:
                13px;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        .conversation.unread
        .conversation-preview {

            color:
                #334155;

            font-weight:
                600;

        }


        /* =========================
           REAL UNREAD COUNTER
        ========================= */

        .unread-badge {

            min-width:
                20px;

            height:
                20px;

            padding:
                0 6px;

            border-radius:
                999px;

            background:
                #ef4444;

            color:
                white;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                11px;

            font-weight:
                700;

            flex-shrink:
                0;

        }


        /* =========================
           EMPTY
        ========================= */

        #empty {

            text-align:
                center;

            padding:
                55px 20px;

            color:
                #718096;

        }


        #empty-icon {

            font-size:
                42px;

            margin-bottom:
                8px;

        }


        #error {

            text-align:
                center;

            padding:
                45px 20px;

            color:
                #dc2626;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (
            max-width:
            600px
        ) {

            header {

                padding:
                    11px 17px;

            }


            .brand-name {

                font-size:
                    20px;

            }


            .brand img {

                width:
                    38px;

                height:
                    38px;

            }


            main {

                margin-top:
                    16px;

                padding:
                    0 9px;

            }


            .conversation {

                padding:
                    13px;

            }


            .conversation-picture {

                width:
                    49px;

                height:
                    49px;

            }


            .conversation-time {

                display:
                    none;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="brand">

        <img
            src="W.png"
            alt="Writejot logo"
        >

        <div class="brand-name">
            Writejot
        </div>

    </div>


    <a
        class="back"
        href="index.html"
    >
        ← Dashboard
    </a>

</header>



<main>

    <div class="messages-card">


        <div class="title">

            <h1>
                💬 Messages
            </h1>


            <p>
                Your conversations
            </p>

        </div>



        <div class="search-wrap">

            <input
                id="conversationSearch"
                type="text"
                placeholder="Search conversations..."
                autocomplete="off"
            >

        </div>



        <div
            id="refreshStatus"
        >
            Updating messages...
        </div>



        <div
            id="conversationList"
        ></div>



        <div
            id="empty"
        >

            <div id="empty-icon">
                💬
            </div>

            You don't have any conversations yet.

        </div>



        <div
            id="error"
            style="display:none;"
        ></div>


    </div>

</main>



<script>


/* =========================================================
   CURRENT APPS SCRIPT URL
========================================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


let currentUser =
    null;


let allConversations =
    [];


let profileCache =
    {};


let refreshTimer =
    null;


/* =========================================================
   CACHE KEYS
========================================================= */

function conversationCacheKey() {

    return (
        "writejot_conversations_" +
        (
            currentUser
                ? currentUser.username
                : "unknown"
        )
    );

}


function profileCacheKey(
    username
) {

    return (
        "writejot_profile_" +
        username
    );

}


/* =========================================================
   START
========================================================= */

window.onload =
    async function () {

        const savedUser =
            localStorage.getItem(
                "writejotUser"
            );


        if (
            !savedUser
        ) {

            window.location.href =
                "index.html";

            return;

        }


        try {

            currentUser =
                JSON.parse(
                    savedUser
                );

        }

        catch (error) {

            window.location.href =
                "index.html";

            return;

        }


        loadProfileCache();


        const hasCache =
            loadCachedConversations();


        document
            .getElementById(
                "conversationSearch"
            )
            .addEventListener(
                "input",
                renderFilteredConversations
            );


        if (
            hasCache
        ) {

            renderFilteredConversations();

        }


        refreshConversations(
            !hasCache
        );


        refreshTimer =
            setInterval(
                function () {

                    refreshConversations(
                        false
                    );

                },
                5000
            );

    };


/* =========================================================
   LOAD CACHED CONVERSATIONS
========================================================= */

function loadCachedConversations() {

    try {

        const cached =
            localStorage.getItem(
                conversationCacheKey()
            );


        if (
            !cached
        ) {

            return false;

        }


        const parsed =
            JSON.parse(
                cached
            );


        if (
            !Array.isArray(
                parsed
            )
        ) {

            return false;

        }


        allConversations =
            parsed;


        return (
            allConversations.length >
            0
        );

    }

    catch (error) {

        console.error(
            "Conversation cache error:",
            error
        );


        return false;

    }

}


/* =========================================================
   LOAD PROFILE CACHE
========================================================= */

function loadProfileCache() {

    try {

        for (
            let i = 0;
            i < localStorage.length;
            i++
        ) {

            const key =
                localStorage.key(
                    i
                );


            if (
                !key ||
                !key.startsWith(
                    "writejot_profile_"
                )
            ) {

                continue;

            }


            const username =
                key.replace(
                    "writejot_profile_",
                    ""
                );


            try {

                profileCache[
                    username
                ] =
                    JSON.parse(
                        localStorage.getItem(
                            key
                        )
                    );

            }

            catch (error) {}

        }

    }

    catch (error) {

        console.error(
            "Profile cache error:",
            error
        );

    }

}


/* =========================================================
   SAVE CACHE
========================================================= */

function saveConversationCache() {

    try {

        localStorage.setItem(

            conversationCacheKey(),

            JSON.stringify(
                allConversations
            )

        );

    }

    catch (error) {

        console.error(
            "Could not save conversation cache:",
            error
        );

    }

}


/* =========================================================
   REFRESH FROM SERVER
========================================================= */

async function refreshConversations(
    showLoading
) {

    if (
        showLoading &&
        allConversations.length === 0
    ) {

        showInitialLoading();

    }


    showBackgroundRefresh();


    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=conversations&email=" +
                encodeURIComponent(
                    currentUser.email
                ),

                {
                    cache:
                        "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Could not load conversations."
            );

        }


        allConversations =
            result.conversations ||
            [];


        saveConversationCache();


        await refreshProfiles();


        renderFilteredConversations();


        hideRefreshIndicator();


    }

    catch (error) {

        console.error(
            "Conversation refresh error:",
            error
        );


        hideRefreshIndicator();


        /*
         * Keep cached conversations if
         * the server is temporarily slow.
         */

        if (
            allConversations.length > 0
        ) {

            return;

        }


        showError(
            "Could not connect to Writejot."
        );

    }

}


/* =========================================================
   REFRESH PROFILES
========================================================= */

async function refreshProfiles() {

    const usernames =
        allConversations.map(
            function (
                conversation
            ) {

                return conversation.username;

            }
        );


    const uniqueUsernames =
        [
            ...new Set(
                usernames
            )
        ];


    const requests =
        uniqueUsernames.map(

            async function (
                username
            ) {

                try {

                    const response =
                        await fetch(

                            APPS_SCRIPT_URL +
                            "?action=profile&username=" +
                            encodeURIComponent(
                                username
                            ),

                            {
                                cache:
                                    "no-store"
                            }

                        );


                    if (
                        !response.ok
                    ) {

                        return;

                    }


                    const result =
                        await response.json();


                    if (
                        result.success &&
                        result.profile
                    ) {

                        profileCache[
                            username
                        ] =
                            result.profile;


                        localStorage.setItem(

                            profileCacheKey(
                                username
                            ),

                            JSON.stringify(
                                result.profile
                            )

                        );

                    }

                }

                catch (error) {}

            }

        );


    await Promise.all(
        requests
    );

}


/* =========================================================
   INITIAL LOADING
========================================================= */

function showInitialLoading() {

    const list =
        document.getElementById(
            "conversationList"
        );


    const empty =
        document.getElementById(
            "empty"
        );


    list.innerHTML =

        `
        <div
            style="
                padding:40px;
                text-align:center;
                color:#718096;
            "
        >
            Loading conversations...
        </div>
        `;


    empty.style.display =
        "none";

}


/* =========================================================
   BACKGROUND REFRESH INDICATOR
========================================================= */

function showBackgroundRefresh() {

    document
        .getElementById(
            "refreshStatus"
        )
        .style.display =
        "block";

}


function hideRefreshIndicator() {

    document
        .getElementById(
            "refreshStatus"
        )
        .style.display =
        "none";

}


/* =========================================================
   RENDER
========================================================= */

function renderFilteredConversations() {

    const list =
        document.getElementById(
            "conversationList"
        );


    const empty =
        document.getElementById(
            "empty"
        );


    const query =
        document
            .getElementById(
                "conversationSearch"
            )
            .value
            .trim()
            .toLowerCase();


    const filtered =
        allConversations.filter(

            function (
                conversation
            ) {

                const profile =
                    profileCache[
                        conversation.username
                    ] ||
                    {};


                const searchable =
                    (
                        conversation.username +
                        " " +
                        (
                            profile.name ||
                            ""
                        )
                    )
                    .toLowerCase();


                return searchable.includes(
                    query
                );

            }

        );


    list.innerHTML =
        "";


    if (
        filtered.length === 0
    ) {

        if (
            allConversations.length === 0
        ) {

            showEmptyState();

        }

        else {

            empty.style.display =
                "block";


            empty.innerHTML =

                `
                <div id="empty-icon">
                    🔎
                </div>

                No conversations found.
                `;

        }


        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(

        function (
            conversation
        ) {

            const profile =
                profileCache[
                    conversation.username
                ] ||
                {};


            const link =
                document.createElement(
                    "a"
                );


            link.className =
                "conversation" +
                (
                    conversation.unreadCount >
                    0
                        ? " unread"
                        : ""
                );


            link.href =
                "chat.html?username=" +
                encodeURIComponent(
                    conversation.username
                );


            const picture =
                profile.profilePicture ||
                "W.png";


            const name =
                profile.name ||
                conversation.username;


            const time =
                formatTime(
                    conversation.timestamp
                );


            const unreadBadge =
                conversation.unreadCount >
                0

                ? `
                    <span
                        class="unread-badge"
                    >
                        ${
                            conversation.unreadCount >
                            99
                                ? "99+"
                                : conversation.unreadCount
                        }
                    </span>
                  `

                : "";


            link.innerHTML =

                `
                <img
                    class="conversation-picture"
                    src="${escapeHtml(
                        picture
                    )}"
                    alt=""
                    onerror="
                        this.src='W.png'
                    "
                >


                <div
                    class="conversation-content"
                >

                    <div
                        class="conversation-top"
                    >

                        <div
                            class="conversation-name"
                        >
                            ${escapeHtml(
                                name
                            )}
                        </div>


                        <div
                            class="conversation-time"
                        >
                            ${escapeHtml(
                                time
                            )}
                        </div>

                    </div>


                    <div
                        class="conversation-preview-row"
                    >

                        <div
                            class="conversation-preview"
                        >
                            ${escapeHtml(
                                conversation.lastMessage
                            )}
                        </div>


                        ${unreadBadge}

                    </div>

                </div>
                `;


            list.appendChild(
                link
            );

        }

    );

}


/* =========================================================
   EMPTY STATE
========================================================= */

function showEmptyState() {

    const list =
        document.getElementById(
            "conversationList"
        );


    const empty =
        document.getElementById(
            "empty"
        );


    list.innerHTML =
        "";


    empty.style.display =
        "block";


    empty.innerHTML =

        `
        <div id="empty-icon">
            💬
        </div>

        You don't have any conversations yet.
        `;

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
) {

    document
        .getElementById(
            "empty"
        )
        .style.display =
        "none";


    const error =
        document.getElementById(
            "error"
        );


    error.textContent =
        message;


    error.style.display =
        "block";

}


/* =========================================================
   TIME
========================================================= */

function formatTime(
    value
) {

    if (
        !value
    ) {

        return "";

    }


    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    const now =
        new Date();


    if (
        date.toDateString() ===
        now.toDateString()
    ) {

        return date.toLocaleTimeString(

            [],

            {

                hour:
                    "numeric",

                minute:
                    "2-digit"

            }

        );

    }


    return date.toLocaleDateString(

        [],

        {

            month:
                "short",

            day:
                "numeric"

        }

    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

</script>


</body>

</html>
