<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Writejot | Messages</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    min-height: 100%;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f6f8fc;

    color:
        #1f2937;
}


/* =========================================================
   HEADER
========================================================= */

header {

    width: 100%;

    height: 66px;

    background:
        rgba(
            255,
            255,
            255,
            .97
        );

    border-bottom:
        1px solid #e5e7eb;

    position:
        sticky;

    top: 0;

    z-index: 100;

    padding:
        10px 6%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;
}

.brand {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;
}

.brand img {

    width:
        42px;

    height:
        42px;

    object-fit:
        contain;
}

.brand-name {

    font-size:
        22px;

    font-weight:
        700;
}

.dashboard-link {

    color:
        #4285F4;

    text-decoration:
        none;

    font-weight:
        600;
}


/* =========================================================
   PAGE
========================================================= */

main {

    width:
        100%;

    max-width:
        820px;

    margin:
        0 auto;

    padding:
        28px 18px 60px;
}


/* =========================================================
   PAGE TITLE
========================================================= */

.messages-header {

    width:
        100%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin-bottom:
        18px;
}

.messages-header h1 {

    margin:
        0;

    font-size:
        34px;

    line-height:
        1.1;
}


/* =========================================================
   TOTAL UNREAD
========================================================= */

.unread-total {

    min-width:
        26px;

    height:
        26px;

    padding:
        0 8px;

    border-radius:
        999px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        #ef4444;

    color:
        white;

    font-size:
        12px;

    font-weight:
        700;
}

.unread-total.hidden {

    display:
        none;
}


/* =========================================================
   CONVERSATION LIST

   IMPORTANT:
   THERE IS NO FIXED HEIGHT.
========================================================= */

#conversationList {

    width:
        100%;

    height:
        auto !important;

    min-height:
        0 !important;

    max-height:
        none !important;

    overflow:
        visible !important;

    display:
        flex;

    flex-direction:
        column;

    background:
        white;

    border:
        1px solid #e1e6ee;

    border-radius:
        16px;

    box-shadow:
        0 8px 30px
        rgba(
            0,
            0,
            0,
            .04
        );
}


/* =========================================================
   CONVERSATION
========================================================= */

.conversation {

    width:
        100%;

    min-height:
        78px;

    padding:
        14px 16px;

    display:
        flex;

    align-items:
        center;

    gap:
        0;

    background:
        white;

    border-bottom:
        1px solid #edf0f4;

    cursor:
        pointer;

    transition:
        background .15s ease;
}

.conversation:last-child {

    border-bottom:
        none;
}

.conversation:hover {

    background:
        #f8faff;
}

.conversation.unread {

    background:
        #f7faff;
}


/* =========================================================
   PROFILE
========================================================= */

.conversation-picture {

    width:
        50px;

    height:
        50px;

    min-width:
        50px;

    border-radius:
        50%;

    object-fit:
        cover;

    background:
        #edf2f7;

    border:
        2px solid #4285F4;
}


/* =========================================================
   CONTENT
========================================================= */

.conversation-content {

    flex:
        1;

    min-width:
        0;

    padding:
        0 13px;
}

.conversation-top {

    display:
        flex;

    align-items:
        center;

    gap:
        6px;

    min-width:
        0;
}

.conversation-name {

    min-width:
        0;

    font-size:
        15px;

    font-weight:
        700;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;
}

.conversation.unread
.conversation-name {

    font-weight:
        800;
}

.conversation-username {

    flex:
        0 0 auto;

    color:
        #4285F4;

    font-size:
        12px;

    white-space:
        nowrap;
}

.conversation-preview {

    margin-top:
        4px;

    color:
        #718096;

    font-size:
        13px;

    line-height:
        1.3;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;
}

.conversation.unread
.conversation-preview {

    color:
        #374151;

    font-weight:
        600;
}


/* =========================================================
   RIGHT SIDE
========================================================= */

.conversation-right {

    flex:
        0 0 auto;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        flex-end;

    gap:
        7px;
}

.conversation-time {

    color:
        #8a94a6;

    font-size:
        11px;

    white-space:
        nowrap;
}


/* =========================================================
   UNREAD BADGE
========================================================= */

.unread-badge {

    min-width:
        23px;

    height:
        23px;

    padding:
        0 7px;

    border-radius:
        999px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        #4285F4;

    color:
        white;

    font-size:
        11px;

    font-weight:
        700;
}

.unread-badge.hidden {

    display:
        none;
}


/* =========================================================
   LOADING
========================================================= */

.messages-loading {

    padding:
        45px 20px;

    text-align:
        center;

    color:
        #718096;

    background:
        white;

    border-radius:
        16px;
}

.spinner {

    width:
        26px;

    height:
        26px;

    margin:
        0 auto 10px;

    border:
        3px solid #e5e7eb;

    border-top-color:
        #4285F4;

    border-radius:
        50%;

    animation:
        spin .7s linear infinite;
}

@keyframes spin {

    to {

        transform:
            rotate(360deg);
    }
}


/* =========================================================
   EMPTY
========================================================= */

.messages-empty {

    padding:
        55px 20px;

    text-align:
        center;

    color:
        #718096;

    background:
        white;

    border-radius:
        16px;
}


/* =========================================================
   ERROR
========================================================= */

.messages-error {

    padding:
        35px 20px;

    text-align:
        center;

    color:
        #dc2626;

    background:
        white;

    border-radius:
        16px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (
    max-width: 600px
) {

    header {

        height:
            60px;

        padding:
            9px 12px;
    }

    .brand-name {

        font-size:
            20px;
    }

    .brand img {

        width:
            38px;

        height:
            38px;
    }

    main {

        padding:
            20px 10px 40px;
    }

    .messages-header h1 {

        font-size:
            28px;
    }

    .conversation {

        min-height:
            70px;

        padding:
            12px;
    }

    .conversation-picture {

        width:
            45px;

        height:
            45px;

        min-width:
            45px;
    }

    .conversation-content {

        padding:
            0 9px;
    }

    .conversation-name {

        font-size:
            14px;
    }

    .conversation-username {

        font-size:
            11px;
    }

    .conversation-preview {

        font-size:
            12px;
    }

    .conversation-time {

        font-size:
            10px;
    }

}

</style>

</head>


<body>


<header>

    <div
        class="brand"
    >

        <img
            src="W.png"
            alt="Writejot"
        >


        <div
            class="brand-name"
        >
            Writejot
        </div>

    </div>


    <a
        href="index.html"
        class="dashboard-link"
    >
        ← Dashboard
    </a>

</header>



<main>


    <div
        class="messages-header"
    >

        <h1>
            Messages
        </h1>


        <div
            id="unreadTotal"
            class="
                unread-total
                hidden
            "
        ></div>

    </div>



    <div
        id="conversationList"
    >

        <div
            class="messages-loading"
        >

            <div
                class="spinner"
            ></div>

            Loading conversations...

        </div>

    </div>


</main>



<script>


/* =========================================================
   CONFIG
========================================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


const CACHE_PREFIX =
    "writejot_conversations_";


const REFRESH_INTERVAL =
    15000;


let currentUser =
    null;


let conversations =
    [];


let refreshTimer =
    null;


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    initialize
);


async function initialize() {

    const savedUser =
        localStorage.getItem(
            "writejotUser"
        );


    if (
        !savedUser
    ) {

        showError(
            "Please sign in to Writejot first."
        );

        return;

    }


    try {

        currentUser =
            JSON.parse(
                savedUser
            );

    }

    catch {

        localStorage.removeItem(
            "writejotUser"
        );


        showError(
            "Your Writejot session could not be loaded."
        );


        return;

    }


    /*
     * CACHE FIRST.
     *
     * This means conversations can appear
     * immediately without waiting for Apps Script.
     */

    loadCache();


    if (
        conversations.length
    ) {

        renderConversations();

    }


    /*
     * Fresh data in background.
     */

    await loadConversations();


    startRefresh();

}


/* =========================================================
   CACHE
========================================================= */

function getCacheKey() {

    return (
        CACHE_PREFIX +
        normalizeEmail(
            currentUser.email
        )
    );

}


function loadCache() {

    try {

        const raw =
            localStorage.getItem(
                getCacheKey()
            );


        if (
            !raw
        ) {

            return;

        }


        const cached =
            JSON.parse(
                raw
            );


        if (
            !Array.isArray(
                cached.conversations
            )
        ) {

            return;

        }


        conversations =
            cached.conversations.slice();

    }

    catch {

        conversations =
            [];

    }

}


function saveCache() {

    try {

        localStorage.setItem(

            getCacheKey(),

            JSON.stringify({

                savedAt:
                    Date.now(),

                conversations:
                    conversations

            })

        );

    }

    catch {}

}


/* =========================================================
   LOAD CONVERSATIONS
========================================================= */

async function loadConversations() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=conversations" +
                "&email=" +
                encodeURIComponent(
                    currentUser.email
                ),

                {
                    cache:
                        "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            result.accessDenied ===
            true
        ) {

            showError(
                result.error ||
                "Your Writejot access has expired."
            );

            return;

        }


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Could not load conversations."
            );

        }


        conversations =
            Array.isArray(
                result.conversations
            )
                ? result.conversations
                : [];


        saveCache();


        renderConversations();

    }

    catch (error) {

        console.error(
            "Conversation loading error:",
            error
        );


        /*
         * If cache exists, KEEP IT.
         */

        if (
            conversations.length
        ) {

            renderConversations();

            return;

        }


        showError(
            "Could not load your messages."
        );

    }

}


/* =========================================================
   AUTO REFRESH
========================================================= */

function startRefresh() {

    if (
        refreshTimer
    ) {

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer =
        setInterval(
            function() {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    loadConversations();

                }

            },

            REFRESH_INTERVAL
        );

}


/* =========================================================
   PAGE RETURN
========================================================= */

window.addEventListener(
    "pageshow",
    function() {

        /*
         * Browser may restore messages.html
         * from bfcache.
         */

        loadConversations();

    }
);


document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "visible"
        ) {

            loadConversations();

        }

    }
);


/* =========================================================
   RENDER
========================================================= */

function renderConversations() {

    const list =
        document.getElementById(
            "conversationList"
        );


    /*
     * Explicitly remove any accidental
     * height restriction.
     */

    list.style.height =
        "auto";


    list.style.maxHeight =
        "none";


    list.style.overflow =
        "visible";


    if (
        !conversations.length
    ) {

        list.innerHTML =

            `
            <div
                class="messages-empty"
            >

                <div
                    style="
                        font-size:42px;
                        margin-bottom:12px;
                    "
                >
                    💬
                </div>


                <strong>
                    No conversations yet.
                </strong>


                <div
                    style="
                        margin-top:6px;
                    "
                >
                    Search for a student to
                    start a conversation.
                </div>

            </div>
            `;


        updateUnreadTotal();


        return;

    }


    list.innerHTML =
        conversations
            .map(
                function(
                    conversation
                ) {

                    return buildConversation(
                        conversation
                    );

                }
            )
            .join("");


    updateUnreadTotal();

}


/* =========================================================
   BUILD CONVERSATION
========================================================= */

function buildConversation(
    conversation
) {

    const username =
        normalizeUsername(
            conversation.username
        );


    const name =
        conversation.name ||
        "Writejot User";


    const picture =
        conversation.profilePicture ||
        "W.png";


    const preview =
        conversation.lastMessage ||
        "No messages yet.";


    const unread =
        Math.max(
            0,
            Number(
                conversation.unreadCount ||
                0
            )
        );


    const unreadClass =
        unread > 0
            ? "unread"
            : "";


    const time =
        formatConversationTime(
            conversation.timestamp
        );


    return `

        <div
            class="
                conversation
                ${unreadClass}
            "
            role="button"
            tabindex="0"

            onclick="
                openConversation(
                    '${escapeJs(
                        username
                    )}'
                )
            "

            onkeydown="
                conversationKey(
                    event,
                    '${escapeJs(
                        username
                    )}'
                )
            "
        >


            <img
                class="conversation-picture"
                src="${escapeHtml(
                    picture
                )}"
                alt=""
                loading="lazy"

                onerror="
                    this.src='W.png';
                "
            >


            <div
                class="conversation-content"
            >

                <div
                    class="conversation-top"
                >

                    <div
                        class="conversation-name"
                    >
                        ${escapeHtml(
                            name
                        )}
                    </div>


                    <div
                        class="
                            conversation-username
                        "
                    >
                        @${escapeHtml(
                            username
                        )}
                    </div>

                </div>


                <div
                    class="
                        conversation-preview
                    "
                >
                    ${escapeHtml(
                        preview
                    )}
                </div>

            </div>


            <div
                class="conversation-right"
            >

                <div
                    class="conversation-time"
                >
                    ${escapeHtml(
                        time
                    )}
                </div>


                <div
                    class="
                        unread-badge
                        ${
                            unread > 0
                                ? ""
                                : "hidden"
                        }
                    "
                >
                    ${
                        unread > 99
                            ? "99+"
                            : unread
                    }
                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   OPEN CHAT
========================================================= */

function openConversation(
    username
) {

    const cleaned =
        normalizeUsername(
            username
        );


    if (
        !cleaned
    ) {

        return;

    }


    window.location.href =
        "chat.html?username=" +
        encodeURIComponent(
            cleaned
        );

}


function conversationKey(
    event,
    username
) {

    if (
        event.key ===
            "Enter" ||
        event.key ===
            " "
    ) {

        event.preventDefault();


        openConversation(
            username
        );

    }

}


/* =========================================================
   TOTAL UNREAD
========================================================= */

function updateUnreadTotal() {

    const badge =
        document.getElementById(
            "unreadTotal"
        );


    let total =
        0;


    conversations.forEach(
        function(
            conversation
        ) {

            const count =
                Number(
                    conversation.unreadCount ||
                    0
                );


            if (
                Number.isFinite(
                    count
                ) &&
                count > 0
            ) {

                total +=
                    count;

            }

        }
    );


    if (
        total <= 0
    ) {

        badge.textContent =
            "";

        badge.classList.add(
            "hidden"
        );

        return;

    }


    badge.classList.remove(
        "hidden"
    );


    badge.textContent =
        total > 99
            ? "99+"
            : String(
                total
            );

}


/* =========================================================
   TIME
========================================================= */

function formatConversationTime(
    timestamp
) {

    if (
        !timestamp
    ) {

        return "";

    }


    const date =
        new Date(
            timestamp
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    const now =
        new Date();


    if (
        date.toDateString() ===
        now.toDateString()
    ) {

        return date.toLocaleTimeString(
            [],
            {
                hour:
                    "numeric",

                minute:
                    "2-digit"
            }
        );

    }


    const difference =
        now.getTime() -
        date.getTime();


    const day =
        24 *
        60 *
        60 *
        1000;


    if (
        difference >= 0 &&
        difference <
            7 * day
    ) {

        return date.toLocaleDateString(
            [],
            {
                weekday:
                    "short"
            }
        );

    }


    return date.toLocaleDateString(
        [],
        {
            month:
                "short",

            day:
                "numeric"
        }
    );

}


/* =========================================================
   HELPERS
========================================================= */

function normalizeUsername(
    username
) {

    return String(
        username ||
        ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /^@/,
        ""
    );

}


function normalizeEmail(
    email
) {

    return String(
        email ||
        ""
    )
    .trim()
    .toLowerCase();

}


function escapeHtml(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeJs(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\r/g,
        "\\r"
    )
    .replace(
        /\n/g,
        "\\n"
    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
) {

    document
        .getElementById(
            "conversationList"
        )
        .innerHTML =

        `
        <div
            class="messages-error"
        >

            ${escapeHtml(
                message
            )}

            <br><br>

            <a
                href="index.html"
                class="dashboard-link"
            >
                ← Back to Dashboard
            </a>

        </div>
        `;

}

</script>

</body>

</html>
