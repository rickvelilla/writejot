<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Writejot | Profile</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f6f8fc;

    color:
        #1f2937;
}

header {
    background: white;

    border-bottom:
        1px solid #e5e7eb;

    padding:
        12px 6%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    position:
        sticky;

    top: 0;

    z-index: 50;
}

.brand {
    display:
        flex;

    align-items:
        center;

    gap: 10px;
}

.brand img {
    width: 40px;
    height: 40px;
    object-fit: contain;
}

.brand-name {
    font-size: 22px;
    font-weight: 700;
}

.back {
    color:
        #4285F4;

    text-decoration:
        none;

    font-weight:
        600;
}

main {
    width: 100%;

    max-width: 700px;

    margin:
        35px auto 60px;

    padding:
        0 16px;
}

.profile-card {
    background: white;

    border:
        1px solid #e1e6ee;

    border-radius:
        18px;

    padding:
        35px;

    box-shadow:
        0 8px 30px
        rgba(
            0,
            0,
            0,
            .04
        );

    text-align:
        center;
}

.profile-picture {
    width:
        120px;

    height:
        120px;

    border-radius:
        50%;

    object-fit:
        cover;

    border:
        3px solid #4285F4;

    background:
        #edf2f7;

    margin-bottom:
        15px;
}

.profile-name {
    margin:
        0;

    font-size:
        30px;

    font-weight:
        700;
}

.profile-username {
    margin-top:
        4px;

    color:
        #4285F4;

    font-size:
        15px;

    font-weight:
        600;
}

.profile-bio {
    max-width:
        520px;

    margin:
        18px auto 0;

    color:
        #667085;

    line-height:
        1.7;

    white-space:
        pre-wrap;

    word-break:
        break-word;
}

.profile-actions {
    display:
        flex;

    justify-content:
        center;

    gap:
        10px;

    flex-wrap:
        wrap;

    margin-top:
        25px;
}

.button {
    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        11px 17px;

    border-radius:
        9px;

    text-decoration:
        none;

    font-weight:
        600;

    border:
        1px solid #d8dee8;

    background:
        white;

    color:
        #4285F4;
}

.primary {
    border:
        none;

    background:
        #4285F4;

    color:
        white;
}

.primary:hover {
    background:
        #3367d6;
}

.button:hover {
    transform:
        translateY(-1px);
}

.loading {
    text-align:
        center;

    color:
        #718096;

    padding:
        50px;
}

.error {
    text-align:
        center;

    color:
        #dc2626;

    padding:
        40px;
}

@media (
    max-width: 600px
) {

    main {
        margin-top:
            20px;

        padding:
            0 10px;
    }

    .profile-card {
        padding:
            28px 18px;
    }

    .profile-picture {
        width:
            100px;

        height:
            100px;
    }

    .profile-name {
        font-size:
            25px;
    }

}

</style>

</head>

<body>

<header>

    <div class="brand">

        <img
            src="W.png"
            alt="Writejot"
        >

        <div class="brand-name">
            Writejot
        </div>

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Dashboard
    </a>

</header>


<main>

    <div
        id="profileContainer"
    >

        <div class="loading">
            Loading profile...
        </div>

    </div>

</main>


<script>

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


let viewedUsername =
    "";


window.addEventListener(
    "load",
    loadProfile
);


async function loadProfile() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    viewedUsername =
        String(
            params.get(
                "username"
            ) ||
            ""
        )
        .trim()
        .toLowerCase()
        .replace(
            /^@/,
            ""
        );


    const container =
        document.getElementById(
            "profileContainer"
        );


    if (
        !viewedUsername
    ) {

        showError(
            "No username was provided."
        );

        return;

    }


    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=profile&username=" +
                encodeURIComponent(
                    viewedUsername
                ),

                {
                    cache:
                        "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Server error"
            );

        }


        const result =
            await response.json();


        if (
            !result.success ||
            !result.profile
        ) {

            showError(
                "Profile not found."
            );

            return;

        }


        renderProfile(
            result.profile
        );

    }

    catch (error) {

        console.error(
            error
        );


        showError(
            "Could not load this profile."
        );

    }

}


function renderProfile(
    profile
) {

    const container =
        document.getElementById(
            "profileContainer"
        );


    const picture =
        profile.profilePicture ||
        "W.png";


    const currentUser =
        getCurrentUser();


    const isOwnProfile =
        currentUser &&
        normalizeUsername(
            currentUser.username
        ) ===
        normalizeUsername(
            profile.username
        );


    container.innerHTML =

    `
    <div class="profile-card">

        <img
            class="profile-picture"
            src="${escapeHtml(
                picture
            )}"
            alt="Profile picture"
            onerror="
                this.src='W.png'
            "
        >


        <h1
            class="profile-name"
        >
            ${escapeHtml(
                profile.name ||
                "Writejot User"
            )}
        </h1>


        <div
            class="profile-username"
        >
            @${escapeHtml(
                profile.username ||
                viewedUsername
            )}
        </div>


        ${
            profile.bio
                ? `
                    <div
                        class="profile-bio"
                    >
                        ${escapeHtml(
                            profile.bio
                        )}
                    </div>
                  `
                : ""
        }


        <div
            class="profile-actions"
        >

            ${
                isOwnProfile

                    ? `
                        <a
                            href="edit-profile.html"
                            class="button primary"
                        >
                            ⚙️ Edit Profile
                        </a>
                      `

                    : `
                        <a
                            href="
                                chat.html?username=${encodeURIComponent(
                                    normalizeUsername(
                                        profile.username
                                    )
                                )}
                            "
                            class="button primary"
                        >
                            💬 Message
                        </a>
                      `
            }

        </div>

    </div>
    `;

}


function getCurrentUser() {

    try {

        const saved =
            localStorage.getItem(
                "writejotUser"
            );


        if (!saved) {

            return null;

        }


        return JSON.parse(
            saved
        );

    }

    catch {

        return null;

    }

}


function normalizeUsername(
    username
) {

    return String(
        username ||
        ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /^@/,
        ""
    );

}


function escapeHtml(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function showError(
    message
) {

    document
        .getElementById(
            "profileContainer"
        )
        .innerHTML =

        `
        <div class="profile-card">

            <div class="error">
                ${escapeHtml(
                    message
                )}
            </div>

            <a
                href="index.html"
                class="button primary"
            >
                Back to Dashboard
            </a>

        </div>
        `;

}

</script>

</body>

</html>
