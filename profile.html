<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Writejot | Profile</title>

<style>

* {
    box-sizing:
        border-box;
}

body {
    margin:
        0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f6f8fc;

    color:
        #1f2937;
}

header {
    background:
        white;

    border-bottom:
        1px solid #e5e7eb;

    padding:
        12px 6%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;
}

.logo {
    font-size:
        22px;

    font-weight:
        700;
}

.back {
    color:
        #4285F4;

    text-decoration:
        none;

    font-weight:
        600;
}

.container {
    max-width:
        600px;

    margin:
        35px auto;

    padding:
        0 16px;
}

.card {
    background:
        white;

    border:
        1px solid #e1e6ee;

    border-radius:
        16px;

    padding:
        30px;

    box-shadow:
        0 8px 30px
        rgba(
            0,
            0,
            0,
            .04
        );
}

h1 {
    margin-top:
        0;
}

.subtitle {
    color:
        #718096;
}

.profile-picture-container {
    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    margin:
        25px 0;
}

.profile-picture {
    width:
        110px;

    height:
        110px;

    border-radius:
        50%;

    object-fit:
        cover;

    border:
        3px solid #4285F4;

    background:
        #edf2f7;
}

.upload-button {
    margin-top:
        12px;

    border:
        1px solid #d7dce3;

    background:
        white;

    color:
        #4285F4;

    padding:
        10px 15px;

    border-radius:
        9px;

    cursor:
        pointer;

    font-weight:
        600;
}

#imageInput {
    display:
        none;
}

.field {
    margin-bottom:
        17px;
}

.field label {
    display:
        block;

    font-weight:
        700;

    margin-bottom:
        7px;
}

.field input,
.field textarea {
    width:
        100%;

    padding:
        12px;

    border:
        1px solid #d8dee8;

    border-radius:
        9px;

    font-family:
        inherit;

    font-size:
        14px;

    outline:
        none;
}

.field textarea {
    min-height:
        110px;

    resize:
        vertical;
}

.field input:focus,
.field textarea:focus {
    border-color:
        #4285F4;
}

.save-button {
    width:
        100%;

    border:
        none;

    background:
        #4285F4;

    color:
        white;

    padding:
        13px;

    border-radius:
        9px;

    cursor:
        pointer;

    font-weight:
        700;
}

.save-button:disabled {
    opacity:
        .65;
}

.status {
    margin-top:
        12px;

    text-align:
        center;

    font-size:
        13px;
}

</style>

</head>


<body>


<header>

<div class="logo">
    Writejot
</div>

<a
    class="back"
    href="index.html"
>
    ← Dashboard
</a>

</header>



<main class="container">

<div class="card">

<h1>
    Edit Profile
</h1>

<p class="subtitle">
    Customize your Writejot profile.
</p>



<div
    class="profile-picture-container"
>

<img
    id="profilePicture"
    class="profile-picture"
    src="W.png"
    alt="Profile picture"
>


<button
    type="button"
    class="upload-button"
    onclick="openImagePicker()"
>
    📷 Upload Photo
</button>


<input
    id="imageInput"
    type="file"
    accept="image/*"
    onchange="handleImage(event)"
>

</div>



<div class="field">

<label>
    Display Name
</label>

<input
    id="nameInput"
    type="text"
    maxlength="80"
    placeholder="Your display name"
>

</div>



<div class="field">

<label>
    Username
</label>

<input
    id="usernameInput"
    type="text"
    maxlength="20"
    placeholder="username"
>

</div>



<div class="field">

<label>
    Bio
</label>

<textarea
    id="bioInput"
    maxlength="500"
    placeholder="Tell people a little about yourself..."
></textarea>

</div>



<button
    id="saveButton"
    class="save-button"
    type="button"
    onclick="saveProfile()"
>
    Save Changes
</button>


<div
    id="statusMessage"
    class="status"
></div>

</div>

</main>



<script>

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


let currentUser =
    null;

let originalProfile =
    null;

let selectedImage =
    null;


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    async function() {

        const saved =
            localStorage.getItem(
                "writejotUser"
            );


        if (!saved) {

            location.href =
                "index.html";

            return;

        }


        try {

            currentUser =
                JSON.parse(
                    saved
                );

        }

        catch {

            location.href =
                "index.html";

            return;

        }


        /*
         * Show locally cached user immediately.
         */

        loadLocalUser();


        /*
         * Refresh from server in background.
         */

        loadServerProfile();

    }
);



/* =========================================================
   LOCAL USER
========================================================= */

function loadLocalUser() {

    document
        .getElementById(
            "nameInput"
        )
        .value =
        currentUser.name ||
        "";


    document
        .getElementById(
            "usernameInput"
        )
        .value =
        currentUser.username ||
        "";


    document
        .getElementById(
            "bioInput"
        )
        .value =
        currentUser.bio ||
        "";


    document
        .getElementById(
            "profilePicture"
        )
        .src =
        currentUser.profilePicture ||
        "W.png";

}


/* =========================================================
   SERVER PROFILE
========================================================= */

async function loadServerProfile() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=profile&username=" +
                encodeURIComponent(
                    currentUser.username
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        if (
            !result.success ||
            !result.profile
        ) {

            return;

        }


        originalProfile =
            result.profile;


        /*
         * Only update the UI if the user
         * isn't currently editing.
         */

        document
            .getElementById(
                "nameInput"
            )
            .value =
            result.profile.name ||
            "";


        document
            .getElementById(
                "usernameInput"
            )
            .value =
            result.profile.username ||
            "";


        document
            .getElementById(
                "bioInput"
            )
            .value =
            result.profile.bio ||
            "";


        document
            .getElementById(
                "profilePicture"
            )
            .src =
            result.profile.profilePicture ||
            "W.png";

    }

    catch {

        console.log(
            "Profile refresh failed."
        );

    }

}


/* =========================================================
   IMAGE
========================================================= */

function openImagePicker() {

    document
        .getElementById(
            "imageInput"
        )
        .click();

}


function handleImage(
    event
) {

    const file =
        event.target.files &&
        event.target.files[0];


    if (!file) {
        return;
    }


    selectedImage =
        file;


    const reader =
        new FileReader();


    reader.onload =
        function() {

            /*
             * OPTIMISTIC:
             * show the image immediately.
             */

            document
                .getElementById(
                    "profilePicture"
                )
                .src =
                reader.result;

        };


    reader.readAsDataURL(
        file
    );

}


/* =========================================================
   SAVE PROFILE
========================================================= */

async function saveProfile() {

    const name =
        document
            .getElementById(
                "nameInput"
            )
            .value
            .trim();


    const username =
        document
            .getElementById(
                "usernameInput"
            )
            .value
            .trim()
            .replace(
                /^@/,
                ""
            );


    const bio =
        document
            .getElementById(
                "bioInput"
            )
            .value
            .trim();


    const button =
        document.getElementById(
            "saveButton"
        );


    const status =
        document.getElementById(
            "statusMessage"
        );


    if (!name) {

        status.textContent =
            "Enter a display name.";

        status.style.color =
            "#dc2626";

        return;

    }


    /*
     * Save the old data so we can restore
     * it if the server fails.
     */

    const oldUser =
        {
            ...currentUser
        };


    /*
     * OPTIMISTIC UPDATE
     */

    currentUser.name =
        name;


    currentUser.username =
        username;


    currentUser.bio =
        bio;


    /*
     * If an image was selected, use the
     * preview immediately.
     */

    const optimisticPicture =
        document
            .getElementById(
                "profilePicture"
            )
            .src;


    currentUser.profilePicture =
        optimisticPicture;


    localStorage.setItem(

        "writejotUser",

        JSON.stringify(
            currentUser
        )

    );


    status.textContent =
        "Saved";


    status.style.color =
        "#16834a";


    button.disabled =
        true;


    button.textContent =
        "Saving...";


    try {

        let imageData =
            "";

        let imageType =
            "";

        let imageName =
            "";


        if (
            selectedImage
        ) {

            const compressed =
                await compressImage(
                    selectedImage
                );


            imageData =
                compressed.dataUrl;

            imageType =
                compressed.mimeType;

            imageName =
                compressed.fileName;

        }


        const response =
            await fetch(

                APPS_SCRIPT_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "updateProfile",

                            email:
                                currentUser.email,

                            name:
                                name,

                            username:
                                username,

                            bio:
                                bio,

                            profileImageData:
                                imageData,

                            profileImageType:
                                imageType,

                            profileImageName:
                                imageName

                        })

                }

            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Could not update profile."
            );

        }


        /*
         * Replace optimistic image URL
         * with the actual Drive URL.
         */

        currentUser.name =
            result.name;

        currentUser.username =
            result.username;

        currentUser.bio =
            result.bio;

        currentUser.profilePicture =
            result.profilePicture;


        localStorage.setItem(

            "writejotUser",

            JSON.stringify(
                currentUser
            )

        );


        /*
         * Clear image selection.
         */

        selectedImage =
            null;


        status.textContent =
            "Changes saved.";

        status.style.color =
            "#16834a";


    }

    catch (error) {

        /*
         * Restore previous profile
         * if saving failed.
         */

        currentUser =
            oldUser;


        localStorage.setItem(

            "writejotUser",

            JSON.stringify(
                currentUser
            )

        );


        loadLocalUser();


        status.textContent =
            error.message ||
            "Could not save changes.";

        status.style.color =
            "#dc2626";

    }

    finally {

        button.disabled =
            false;

        button.textContent =
            "Save Changes";

    }

}


/* =========================================================
   COMPRESS IMAGE
========================================================= */

function compressImage(
    file
) {

    return new Promise(
        function(
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onerror =
                reject;


            reader.onload =
                function() {

                    const image =
                        new Image();


                    image.onerror =
                        reject;


                    image.onload =
                        function() {

                            const max =
                                1200;


                            let width =
                                image.width;

                            let height =
                                image.height;


                            if (
                                width >
                                max ||
                                height >
                                max
                            ) {

                                if (
                                    width >
                                    height
                                ) {

                                    height =
                                        Math.round(
                                            height *
                                            max /
                                            width
                                        );

                                    width =
                                        max;

                                }

                                else {

                                    width =
                                        Math.round(
                                            width *
                                            max /
                                            height
                                        );

                                    height =
                                        max;

                                }

                            }


                            const canvas =
                                document
                                    .createElement(
                                        "canvas"
                                    );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            canvas
                                .getContext(
                                    "2d"
                                )
                                .drawImage(
                                    image,
                                    0,
                                    0,
                                    width,
                                    height
                                );


                            resolve({

                                dataUrl:
                                    canvas.toDataURL(
                                        "image/jpeg",
                                        .82
                                    ),

                                mimeType:
                                    "image/jpeg",

                                fileName:
                                    "profile-" +
                                    Date.now() +
                                    ".jpg"

                            });

                        };


                    image.src =
                        reader.result;

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}

</script>

</body>

</html>
