<!DOCTYPE html>
<html>

<head>
    <style>
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #999;
            padding-bottom: 10px;
        }

        .header img {
            width: 70px;
        }

        .header h1 {
            margin: 0;
        }

        .welcome {
            text-align: center;
        }

        .welcome h1 {
            margin-bottom: 10px;
        }

        .welcome h2 {
            margin-top: 0;
        }

        .drive-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4285F4;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .drive-link:hover {
            background-color: #3367D6;
        }
    </style>
</head>

<body>

    <div class="header">
        <img src="W.png" alt="Writejot logo">
        <h1>Writejot</h1>
    </div>

    <div class="welcome">
        <h1>Welcome to my company</h1>
        <h2>Rick Aldrei A. Velilla</h2>

        <a class="drive-link"
           href="https://drive.google.com/drive/folders/1WG2yudtLWWiCdJ_6HlOrcxPB1vXrpD9y?usp=sharing"
           target="_blank">
            Get notes
        </a>
         <a class="drive-link"
           href="https://drive.google.com/drive/folders/1URqy6oaD9efae48E3a7nRNNbeSwm8ZC2?usp=drive_link"
           target="_blank">
            Share your notes
        </a>
    </div>

</body>

</html>
