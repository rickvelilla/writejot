<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Writejot | Messages</title>


    <style>

        * {
            box-sizing:
                border-box;
        }


        html,
        body {

            margin:
                0;

            min-height:
                100%;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f6f8fc;

            color:
                #1f2937;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            background:
                white;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                13px 6%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            position:
                sticky;

            top:
                0;

            z-index:
                20;
        }


        .brand {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;
        }


        .brand img {

            width:
                40px;

            height:
                40px;

            object-fit:
                contain;
        }


        .brand-name {

            font-size:
                22px;

            font-weight:
                700;
        }


        .back {

            color:
                #4285F4;

            text-decoration:
                none;

            font-weight:
                600;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {

            width:
                100%;

            max-width:
                850px;

            margin:
                30px auto 60px;

            padding:
                0 16px;

            height:
                auto;

            min-height:
                0;
        }


        .title-row {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

            margin-bottom:
                18px;
        }


        .title-row h1 {

            margin:
                0;
        }


        .unread-total {

            display:
                none;

            min-width:
                24px;

            height:
                24px;

            padding:
                0 7px;

            border-radius:
                999px;

            background:
                #ef4444;

            color:
                white;

            font-size:
                12px;

            font-weight:
                700;

            align-items:
                center;

            justify-content:
                center;
        }


        /* =====================================================
           CONVERSATION LIST
        ===================================================== */

        .list {

            width:
                100%;

            background:
                white;

            border:
                1px solid #e1e6ee;

            border-radius:
                15px;

            overflow:
                visible;

            height:
                auto;

            max-height:
                none;
        }


        .conversation {

            display:
                flex;

            width:
                100%;

            min-height:
                76px;

            align-items:
                center;

            gap:
                12px;

            padding:
                14px 16px;

            text-decoration:
                none;

            color:
                inherit;

            border-bottom:
                1px solid #edf0f4;

            cursor:
                pointer;

            background:
                white;

            transition:
                background .15s;
        }


        .conversation:last-child {

            border-bottom:
                none;
        }


        .conversation:hover {

            background:
                #f8faff;
        }


        .conversation.unread {

            background:
                #f5f9ff;
        }


        .avatar {

            width:
                48px;

            height:
                48px;

            border-radius:
                50%;

            object-fit:
                cover;

            flex:
                0 0 48px;

            background:
                #e8edf4;
        }


        .conversation-main {

            flex:
                1;

            min-width:
                0;
        }


        .top-line {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            margin-bottom:
                2px;

            min-width:
                0;
        }


        .name {

            font-weight:
                700;

            min-width:
                0;

            overflow:
                hidden;

            white-space:
                nowrap;

            text-overflow:
                ellipsis;
        }


        .username {

            color:
                #4285F4;

            font-size:
                12px;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }


        .preview {

            color:
                #7b8494;

            font-size:
                13px;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }


        .conversation.unread .preview {

            color:
                #344054;

            font-weight:
                600;
        }


        .conversation-side {

            display:
                flex;

            align-items:
                flex-end;

            flex-direction:
                column;

            gap:
                5px;

            flex-shrink:
                0;
        }


        .time {

            color:
                #98a2b3;

            font-size:
                10px;

            white-space:
                nowrap;
        }


        .unread {

            min-width:
                21px;

            height:
                21px;

            padding:
                0 6px;

            border-radius:
                999px;

            background:
                #4285F4;

            color:
                white;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                11px;

            font-weight:
                700;
        }


        .empty {

            padding:
                60px 25px;

            text-align:
                center;

            color:
                #8a94a6;
        }


        /* =====================================================
           LOCK SCREEN
        ===================================================== */

        .lock-screen {

            width:
                100%;

            min-height:
                100vh;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                30px;

            background:
                #f6f8fc;
        }


        .lock-card {

            max-width:
                500px;

            width:
                100%;

            background:
                white;

            border:
                1px solid #e1e6ee;

            border-radius:
                16px;

            padding:
                35px;

            text-align:
                center;

            box-shadow:
                0 8px 30px
                rgba(
                    0,
                    0,
                    0,
                    .05
                );
        }


        .lock-card p {

            color:
                #718096;

            line-height:
                1.6;
        }


        .button {

            display:
                inline-block;

            padding:
                11px 17px;

            background:
                #4285F4;

            color:
                white;

            text-decoration:
                none;

            border-radius:
                9px;

            font-weight:
                600;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (
            max-width:
            600px
        ) {

            header {

                padding:
                    10px 14px;
            }


            .brand-name {

                font-size:
                    20px;
            }


            main {

                margin-top:
                    18px;

                padding:
                    0 10px;
            }


            .conversation {

                padding:
                    12px;
            }


            .avatar {

                width:
                    44px;

                height:
                    44px;

                flex-basis:
                    44px;
            }


            .username {

                max-width:
                    100px;
            }

        }

    </style>

</head>



<body>


<!-- ========================================================
     LOCK SCREEN
========================================================= -->

<div
    id="lockScreen"
    class="lock-screen"
    style="display:none;"
>

    <div class="lock-card">

        <div
            style="
                font-size:45px;
                margin-bottom:10px;
            "
        >
            🔒
        </div>


        <h1>
            Messages unavailable
        </h1>


        <p id="lockMessage">
            Your Writejot access has expired.
            Renew your subscription to continue
            using Messages.
        </p>


        <a
            class="button"
            href="index.html"
        >
            Back to Dashboard
        </a>

    </div>

</div>



<!-- ========================================================
     MESSAGES INTERFACE
========================================================= -->

<div id="mainContent">


<header>

    <div class="brand">

        <img
            src="W.png"
            alt="Writejot"
        >


        <div class="brand-name">
            Writejot
        </div>

    </div>


    <a
        class="back"
        href="index.html"
    >
        ← Dashboard
    </a>

</header>



<main>


    <div class="title-row">

        <h1>
            Messages
        </h1>


        <div
            id="unreadTotal"
            class="unread-total"
        ></div>

    </div>


    <div
        id="conversationList"
        class="list"
    >

        <div class="empty">
            Loading conversations...
        </div>

    </div>

</main>

</div>



<script>


/* =========================================================
   CONFIG
========================================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


const ACCESS_CACHE_TIME =
    5 * 60 * 1000;


let currentUser =
    null;


let conversations =
    [];


let refreshTimer =
    null;


let lastFingerprint =
    "";



/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    async function() {

        const saved =
            localStorage.getItem(
                "writejotUser"
            );


        if (!saved) {

            location.href =
                "index.html";

            return;

        }


        try {

            currentUser =
                JSON.parse(
                    saved
                );

        }

        catch {

            localStorage.removeItem(
                "writejotUser"
            );

            location.href =
                "index.html";

            return;

        }


        /*
         * Show cached conversations immediately
         * when we have a recently verified access state.
         */

        const cachedAccess =
            getCachedAccess();


        if (
            cachedAccess &&
            cachedAccess.access === true
        ) {

            loadConversationCache();


            /*
             * Refresh quietly in background.
             */

            startBackgroundRefresh();

        }

        else {

            /*
             * Access isn't recently verified,
             * so verify before exposing cached
             * protected conversation data.
             */

            verifyAccessAndStart();

        }

    }
);



/* =========================================================
   ACCESS CACHE
========================================================= */

function accessCacheKey() {

    return (
        "writejot_access_" +
        String(
            currentUser.email
        )
        .trim()
        .toLowerCase()
    );

}


function getCachedAccess() {

    try {

        const raw =
            localStorage.getItem(
                accessCacheKey()
            );


        if (!raw) {

            return null;

        }


        const data =
            JSON.parse(
                raw
            );


        if (
            Date.now() -
            Number(
                data.checkedAt || 0
            )
            >
            ACCESS_CACHE_TIME
        ) {

            return null;

        }


        return data;

    }

    catch {

        return null;

    }

}


function saveAccessCache(
    result
) {

    try {

        localStorage.setItem(

            accessCacheKey(),

            JSON.stringify({

                access:
                    result.access === true,

                status:
                    result.status ||
                    "",

                checkedAt:
                    Date.now()

            })

        );

    }

    catch {}

}



/* =========================================================
   ACCESS VERIFICATION
========================================================= */

async function verifyAccessAndStart() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=access&email=" +
                encodeURIComponent(
                    currentUser.email
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        saveAccessCache(
            result
        );


        if (
            !result.success ||
            result.access !== true
        ) {

            showLocked(
                "Your Writejot trial or subscription has expired."
            );

            return;

        }


        loadConversationCache();


        startBackgroundRefresh();

    }

    catch {

        showLocked(
            "Writejot could not verify your account right now."
        );

    }

}



/* =========================================================
   BACKGROUND REFRESH
========================================================= */

function startBackgroundRefresh() {

    refreshConversations();


    if (
        refreshTimer
    ) {

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer =
        setInterval(
            refreshConversations,
            5000
        );

}



/* =========================================================
   CONVERSATION CACHE
========================================================= */

function conversationCacheKey() {

    return (
        "writejot_conversations_" +
        String(
            currentUser.email
        )
        .trim()
        .toLowerCase()
    );

}


function loadConversationCache() {

    try {

        const raw =
            localStorage.getItem(
                conversationCacheKey()
            );


        if (!raw) {

            return;

        }


        const parsed =
            JSON.parse(
                raw
            );


        if (
            !Array.isArray(
                parsed
            )
        ) {

            return;

        }


        conversations =
            parsed;


        lastFingerprint =
            JSON.stringify(
                parsed
            );


        renderConversations();

    }

    catch {}

}


function saveConversationCache() {

    try {

        localStorage.setItem(

            conversationCacheKey(),

            JSON.stringify(
                conversations
            )

        );

    }

    catch {}

}



/* =========================================================
   REFRESH CONVERSATIONS
========================================================= */

async function refreshConversations() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=conversations&email=" +
                encodeURIComponent(
                    currentUser.email
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        /*
         * IMPORTANT:
         * Server can revoke access while the
         * page is already open.
         */

        if (
            result.accessDenied === true ||
            result.access === false
        ) {

            saveAccessCache({

                access:
                    false,

                status:
                    result.status ||
                    "expired"

            });


            showLocked(
                result.error ||
                "Your Writejot trial or subscription has expired."
            );


            return;

        }


        if (
            !result.success
        ) {

            return;

        }


        saveAccessCache({

            access:
                true,

            status:
                result.status ||
                "active"

        });


        const next =
            result.conversations ||
            [];


        const nextFingerprint =
            JSON.stringify(
                next
            );


        /*
         * Don't rebuild the list
         * if absolutely nothing changed.
         */

        if (
            nextFingerprint ===
            lastFingerprint
        ) {

            return;

        }


        conversations =
            next;


        lastFingerprint =
            nextFingerprint;


        saveConversationCache();


        renderConversations();

    }

    catch (error) {

        console.error(
            "Conversation refresh failed:",
            error
        );

    }

}



/* =========================================================
   RENDER
========================================================= */

function renderConversations() {

    const list =
        document.getElementById(
            "conversationList"
        );


    const unreadTotal =
        document.getElementById(
            "unreadTotal"
        );


    if (
        !conversations.length
    ) {

        list.innerHTML =

            `
            <div class="empty">

                No conversations yet.

                <br><br>

                Search for a profile
                from your dashboard to
                start a conversation.

            </div>
            `;


        unreadTotal.style.display =
            "none";


        return;

    }


    let total =
        0;


    conversations.forEach(
        function(conversation) {

            total +=
                Number(
                    conversation.unreadCount ||
                    0
                );

        }
    );


    if (
        total > 0
    ) {

        unreadTotal.textContent =
            total > 99
                ? "99+"
                : total;


        unreadTotal.style.display =
            "flex";

    }

    else {

        unreadTotal.style.display =
            "none";

    }


    list.innerHTML =
        conversations
            .map(
                function(conversation) {

                    const unread =
                        Number(
                            conversation.unreadCount ||
                            0
                        );


                    return `

                    <a
                        class="
                            conversation
                            ${
                                unread > 0
                                    ? "unread"
                                    : ""
                            }
                        "
                        href="chat.html?username=${encodeURIComponent(
                            conversation.username
                        )}"
                    >

                        <img
                            class="avatar"
                            src="${escapeHtml(
                                conversation.profilePicture ||
                                "W.png"
                            )}"
                            onerror="
                                this.src='W.png'
                            "
                            alt=""
                        >


                        <div
                            class="conversation-main"
                        >

                            <div
                                class="top-line"
                            >

                                <div
                                    class="name"
                                >
                                    ${escapeHtml(
                                        conversation.name ||
                                        "Writejot User"
                                    )}
                                </div>


                                <div
                                    class="username"
                                >
                                    @${escapeHtml(
                                        conversation.username ||
                                        ""
                                    )}
                                </div>

                            </div>


                            <div
                                class="preview"
                            >

                                ${escapeHtml(
                                    conversation.lastMessage ||
                                    "No messages"
                                )}

                            </div>

                        </div>


                        <div
                            class="conversation-side"
                        >

                            <div
                                class="time"
                            >
                                ${escapeHtml(
                                    formatTime(
                                        conversation.timestamp
                                    )
                                )}
                            </div>


                            ${
                                unread > 0
                                    ? `
                                        <div class="unread">

                                            ${
                                                unread > 99
                                                    ? "99+"
                                                    : unread
                                            }

                                        </div>
                                      `
                                    : ""
                            }

                        </div>

                    </a>

                    `;

                }
            )
            .join("");

}



/* =========================================================
   LOCK
========================================================= */

function showLocked(
    message
) {

    if (
        refreshTimer
    ) {

        clearInterval(
            refreshTimer
        );

        refreshTimer =
            null;

    }


    document
        .getElementById(
            "mainContent"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "lockScreen"
        )
        .style.display =
        "flex";


    if (
        message
    ) {

        document
            .getElementById(
                "lockMessage"
            )
            .textContent =
            message;

    }

}



/* =========================================================
   HELPERS
========================================================= */

function formatTime(
    value
) {

    if (!value) {

        return "";

    }


    const date =
        new Date(
            value
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(
        [],
        {

            month:
                "short",

            day:
                "numeric",

            hour:
                "numeric",

            minute:
                "2-digit"

        }
    );

}


function escapeHtml(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

</script>


</body>

</html>
