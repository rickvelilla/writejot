<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Writejot | Calendar</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f6f8fc;

            color:
                #1f2937;
        }

        header {
            background: white;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                12px 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            position: sticky;

            top: 0;

            z-index: 100;
        }

        .brand {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .brand img {
            width:
                40px;

            height:
                40px;

            object-fit:
                contain;
        }

        .brand-name {
            font-size:
                22px;

            font-weight:
                700;
        }

        .back {
            color:
                #4285F4;

            text-decoration:
                none;

            font-weight:
                600;
        }

        main {
            max-width:
                1150px;

            margin:
                25px auto 60px;

            padding:
                0 18px;
        }

        .page-header h1 {
            margin:
                0 0 5px;
        }

        .page-header p {
            color:
                #718096;
        }

        #updateIndicator {
            display:
                none;

            color:
                #8a94a6;

            font-size:
                12px;

            margin-bottom:
                10px;
        }

        .registration-card,
        .status-card,
        .calendar-card,
        .side-card {
            background:
                white;

            border:
                1px solid #e1e6ee;

            border-radius:
                15px;
        }

        .registration-card {
            max-width:
                600px;

            margin:
                30px auto;

            padding:
                30px;
        }

        .field {
            margin-bottom:
                15px;
        }

        .field label {
            display:
                block;

            font-weight:
                600;

            margin-bottom:
                6px;
        }

        .field input,
        .event-input,
        .event-textarea {
            width:
                100%;

            padding:
                11px;

            border:
                1px solid #d8dee8;

            border-radius:
                8px;

            font-family:
                inherit;

            outline:
                none;
        }

        .event-textarea {
            resize:
                vertical;
        }

        .primary-button {
            border:
                none;

            background:
                #4285F4;

            color:
                white;

            padding:
                11px 17px;

            border-radius:
                9px;

            cursor:
                pointer;

            font-weight:
                600;
        }

        .primary-button:disabled {
            opacity:
                .6;
        }

        .form-message {
            margin-top:
                10px;

            font-size:
                13px;
        }

        .status-card {
            padding:
                20px;

            margin-bottom:
                20px;
        }

        .status-card.pending {
            background:
                #fffaf0;

            border-color:
                #f2d38a;
        }

        .status-card.approved {
            background:
                #f1fbf5;

            border-color:
                #b7dfc5;
        }

        #calendarContent {
            display:
                none;
        }

        .calendar-layout {
            display:
                grid;

            grid-template-columns:
                minmax(
                    0,
                    1fr
                )
                320px;

            gap:
                18px;
        }

        .calendar-card {
            overflow:
                hidden;
        }

        .calendar-toolbar {
            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            padding:
                15px 17px;

            border-bottom:
                1px solid #edf0f4;
        }

        .month-buttons {
            display:
                flex;

            gap:
                7px;
        }

        .month-button {
            width:
                34px;

            height:
                34px;

            border:
                1px solid #d8dee8;

            background:
                white;

            border-radius:
                8px;

            cursor:
                pointer;
        }

        .weekdays,
        .calendar-grid {
            display:
                grid;

            grid-template-columns:
                repeat(
                    7,
                    1fr
                );
        }

        .weekdays {
            border-bottom:
                1px solid #edf0f4;
        }

        .weekday {
            padding:
                9px 3px;

            text-align:
                center;

            font-size:
                11px;

            color:
                #8a94a6;

            font-weight:
                700;
        }

        .day {
            min-height:
                105px;

            padding:
                5px;

            border-right:
                1px solid #edf0f4;

            border-bottom:
                1px solid #edf0f4;

            overflow:
                hidden;

            cursor:
                pointer;
        }

        .day:nth-child(7n) {
            border-right:
                none;
        }

        .day.other-month {
            background:
                #fafbfc;

            color:
                #b3bbc7;
        }

        .day.today {
            background:
                #f2f7ff;
        }

        .day-number {
            width:
                25px;

            height:
                25px;

            border-radius:
                50%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                12px;

            margin-bottom:
                4px;
        }

        .today .day-number {
            background:
                #4285F4;

            color:
                white;

            font-weight:
                700;
        }

        .event-chip {
            display:
                block;

            width:
                100%;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;

            padding:
                4px 5px;

            margin-bottom:
                3px;

            border-radius:
                5px;

            font-size:
                9px;
        }

        .event-class {
            background:
                #eaf2ff;

            color:
                #2563eb;
        }

        .event-test {
            background:
                #fff0f0;

            color:
                #dc2626;
        }

        .event-personal {
            background:
                #eefbf2;

            color:
                #16834a;
        }

        .side-card {
            padding:
                20px;
        }

        .upcoming-event {
            padding:
                11px 0;

            border-bottom:
                1px solid #edf0f4;
        }

        .upcoming-date {
            font-size:
                12px;

            color:
                #4285F4;

            font-weight:
                700;
        }

        .upcoming-title {
            font-size:
                14px;

            font-weight:
                600;
        }

        .upcoming-meta {
            font-size:
                12px;

            color:
                #7b8494;
        }

        .add-event {
            margin-top:
                20px;

            padding-top:
                20px;

            border-top:
                1px solid #edf0f4;
        }

        .event-row {
            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                8px;
        }

        .lock-screen {
            min-height:
                70vh;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                30px;
        }

        .lock-card {
            max-width:
                500px;

            width:
                100%;

            background:
                white;

            border:
                1px solid #e1e6ee;

            border-radius:
                16px;

            padding:
                35px;

            text-align:
                center;
        }

        .lock-card p {
            color:
                #718096;

            line-height:
                1.6;
        }

        .button {
            display:
                inline-block;

            padding:
                11px 17px;

            background:
                #4285F4;

            color:
                white;

            text-decoration:
                none;

            border-radius:
                9px;

            font-weight:
                600;
        }

        @media (
            max-width: 850px
        ) {

            .calendar-layout {
                grid-template-columns:
                    1fr;
            }

        }

        @media (
            max-width: 600px
        ) {

            .day {
                min-height:
                    75px;
            }

            .event-chip {
                font-size:
                    8px;
            }

        }

    </style>

</head>

<body>

<div
    id="lockScreen"
    class="lock-screen"
    style="display:none;"
>

    <div class="lock-card">

        <div style="font-size:45px;">
            🔒
        </div>

        <h1>
            Calendar unavailable
        </h1>

        <p>
            Your Writejot access has expired.
            Renew your subscription to continue
            using Calendar.
        </p>

        <a
            class="button"
            href="index.html"
        >
            Back to Dashboard
        </a>

    </div>

</div>


<div id="calendarInterface">

<header>

    <div class="brand">

        <img
            src="W.png"
            alt="Writejot"
        >

        <div class="brand-name">
            Writejot
        </div>

    </div>


    <a
        class="back"
        href="index.html"
    >
        ← Dashboard
    </a>

</header>


<main>

    <div class="page-header">

        <h1>
            📅 Calendar
        </h1>

        <p>
            Classes, tests, and your own events.
        </p>

    </div>


    <div id="updateIndicator">
        Updating...
    </div>


    <div id="registrationArea"></div>


    <div id="calendarContent">

        <div
            id="statusCard"
            class="status-card approved"
        >

            <strong id="statusTitle">
                Class Schedule Access
            </strong>

            <div
                id="statusText"
                style="color:#667085;margin-top:5px;"
            ></div>

        </div>


        <div class="calendar-layout">

            <div class="calendar-card">

                <div class="calendar-toolbar">

                    <strong
                        id="monthTitle"
                    ></strong>


                    <div class="month-buttons">

                        <button
                            class="month-button"
                            onclick="changeMonth(-1)"
                        >
                            ←
                        </button>

                        <button
                            class="month-button"
                            onclick="goToToday()"
                        >
                            •
                        </button>

                        <button
                            class="month-button"
                            onclick="changeMonth(1)"
                        >
                            →
                        </button>

                    </div>

                </div>


                <div class="weekdays">

                    <div class="weekday">Sun</div>
                    <div class="weekday">Mon</div>
                    <div class="weekday">Tue</div>
                    <div class="weekday">Wed</div>
                    <div class="weekday">Thu</div>
                    <div class="weekday">Fri</div>
                    <div class="weekday">Sat</div>

                </div>


                <div
                    id="calendarGrid"
                    class="calendar-grid"
                ></div>

            </div>


            <div class="side-card">

                <h2>
                    Upcoming
                </h2>

                <div
                    id="upcomingEvents"
                ></div>


                <div class="add-event">

                    <h3>
                        Add Personal Event
                    </h3>


                    <input
                        id="eventTitle"
                        class="event-input"
                        type="text"
                        placeholder="Event title"
                    >


                    <input
                        id="eventDate"
                        class="event-input"
                        type="date"
                    >


                    <div class="event-row">

                        <input
                            id="eventStart"
                            class="event-input"
                            type="time"
                        >

                        <input
                            id="eventEnd"
                            class="event-input"
                            type="time"
                        >

                    </div>


                    <textarea
                        id="eventDescription"
                        class="event-textarea"
                        placeholder="Description"
                    ></textarea>


                    <button
                        id="addEventButton"
                        class="primary-button"
                        onclick="addEvent()"
                    >
                        + Add Event
                    </button>


                    <div
                        id="eventMessage"
                        class="form-message"
                    ></div>

                </div>

            </div>

        </div>

    </div>

</main>

</div>


<script>

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


const CACHE_PREFIX =
    "writejot_calendar_";


let currentUser =
    null;

let calendarData =
    null;

let displayedMonth =
    new Date();


displayedMonth.setDate(
    1
);


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    async function() {

        const saved =
            localStorage.getItem(
                "writejotUser"
            );


        if (!saved) {

            location.href =
                "index.html";

            return;

        }


        try {

            currentUser =
                JSON.parse(
                    saved
                );

        } catch {

            location.href =
                "index.html";

            return;

        }


        document
            .getElementById(
                "eventDate"
            )
            .value =
            localDateString(
                new Date()
            );


        /*
         * Access must be verified before
         * cached calendar data is shown.
         */

        const access =
            await verifyAccess();


        if (!access) {
            return;
        }


        loadCalendarCache();


        if (
            calendarData
        ) {

            renderState();

        }


        refreshCalendar();

    }
);


/* =========================================================
   ACCESS
========================================================= */

async function verifyAccess() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=access&email=" +
                encodeURIComponent(
                    currentUser.email
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        if (
            !result.success ||
            !result.access
        ) {

            showLocked();

            return false;

        }


        return true;

    }

    catch (error) {

        showLocked();

        return false;

    }

}


function showLocked() {

    document
        .getElementById(
            "calendarInterface"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "lockScreen"
        )
        .style.display =
        "flex";

}


/* =========================================================
   CACHE
========================================================= */

function cacheKey() {

    return (
        CACHE_PREFIX +
        String(
            currentUser.email
        )
        .trim()
        .toLowerCase()
    );

}


function loadCalendarCache() {

    try {

        const raw =
            localStorage.getItem(
                cacheKey()
            );


        if (!raw) {
            return;
        }


        calendarData =
            JSON.parse(
                raw
            );

    }

    catch (error) {}

}


function saveCalendarCache() {

    try {

        localStorage.setItem(

            cacheKey(),

            JSON.stringify(
                calendarData
            )

        );

    }

    catch (error) {}

}


/* =========================================================
   REFRESH
========================================================= */

async function refreshCalendar() {

    try {

        if (
            calendarData
        ) {

            document
                .getElementById(
                    "updateIndicator"
                )
                .style.display =
                "block";

        }


        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=calendarStatus&email=" +
                encodeURIComponent(
                    currentUser.email
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        if (
            result.accessDenied
        ) {

            showLocked();

            return;

        }


        if (
            !result.success
        ) {

            return;

        }


        calendarData =
            result;


        saveCalendarCache();

        renderState();

    }

    catch (error) {

        console.error(
            error
        );

    }

    finally {

        document
            .getElementById(
                "updateIndicator"
            )
            .style.display =
            "none";

    }

}


/* =========================================================
   STATE
========================================================= */

function renderState() {

    if (
        !calendarData
    ) {

        return;

    }


    const registrationArea =
        document.getElementById(
            "registrationArea"
        );


    const content =
        document.getElementById(
            "calendarContent"
        );


    if (
        !calendarData.registered
    ) {

        content.style.display =
            "none";


        registrationArea.innerHTML =

            `
            <div class="registration-card">

                <h2>
                    Register for your class
                </h2>

                <p
                    style="
                        color:#718096;
                        margin-bottom:20px;
                    "
                >
                    Enter your name and section to
                    access your official class schedule
                    and tests.
                </p>


                <div class="field">

                    <label>
                        Name
                    </label>

                    <input
                        id="registrationName"
                        type="text"
                        value="${escapeHtml(
                            currentUser.name ||
                            ""
                        )}"
                        placeholder="Your full name"
                    >

                </div>


                <div class="field">

                    <label>
                        Section
                    </label>

                    <input
                        id="registrationSection"
                        type="text"
                        placeholder="Example: 10-A"
                    >

                </div>


                <button
                    id="registerButton"
                    class="primary-button"
                    onclick="submitRegistration()"
                >
                    Register Class
                </button>


                <div
                    id="registrationMessage"
                    class="form-message"
                ></div>

            </div>
            `;


        return;

    }


    registrationArea.innerHTML =
        "";


    content.style.display =
        "block";


    if (
        !calendarData.approved
    ) {

        document
            .getElementById(
                "statusCard"
            )
            .className =
            "status-card pending";


        document
            .getElementById(
                "statusTitle"
            )
            .textContent =
            "⏳ Registration pending";


        document
            .getElementById(
                "statusText"
            )
            .innerHTML =

            `
            Your registration for
            <strong>
                ${escapeHtml(
                    calendarData.registration.section
                )}
            </strong>
            is waiting for approval.
            `;

    }

    else {

        document
            .getElementById(
                "statusCard"
            )
            .className =
            "status-card approved";


        document
            .getElementById(
                "statusTitle"
            )
            .textContent =
            "✅ Class schedule unlocked";


        document
            .getElementById(
                "statusText"
            )
            .innerHTML =

            `
            You are registered in
            <strong>
                ${escapeHtml(
                    calendarData.registration.section
                )}
            </strong>.
            `;

    }


    renderCalendar();

}


/* =========================================================
   CALENDAR
========================================================= */

function renderCalendar() {

    const grid =
        document.getElementById(
            "calendarGrid"
        );


    const year =
        displayedMonth.getFullYear();


    const month =
        displayedMonth.getMonth();


    document
        .getElementById(
            "monthTitle"
        )
        .textContent =
        displayedMonth.toLocaleDateString(
            undefined,
            {
                month:
                    "long",
                year:
                    "numeric"
            }
        );


    grid.innerHTML =
        "";


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    const total =
        Math.ceil(
            (
                firstDay +
                daysInMonth
            ) / 7
        ) * 7;


    for (
        let i = 0;
        i < total;
        i++
    ) {

        let date;


        const day =
            i -
            firstDay +
            1;


        if (day < 1) {

            date =
                new Date(
                    year,
                    month,
                    day
                );

        }

        else if (
            day >
            daysInMonth
        ) {

            date =
                new Date(
                    year,
                    month,
                    day
                );

        }

        else {

            date =
                new Date(
                    year,
                    month,
                    day
                );

        }


        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day";


        if (
            date.getMonth() !==
            month
        ) {

            cell.classList.add(
                "other-month"
            );

        }


        const dateString =
            localDateString(
                date
            );


        if (
            dateString ===
            localDateString(
                new Date()
            )
        ) {

            cell.classList.add(
                "today"
            );

        }


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "day-number";


        number.textContent =
            date.getDate();


        cell.appendChild(
            number
        );


        if (
            calendarData.approved
        ) {

            getClassesForDate(
                date
            )
            .forEach(
                function(event) {

                    cell.appendChild(
                        makeChip(
                            event
                        )
                    );

                }
            );


            getTestsForDate(
                dateString
            )
            .forEach(
                function(test) {

                    cell.appendChild(
                        makeChip({

                            type:
                                "test",

                            title:
                                test.title,

                            time:
                                test.startTime

                        })
                    );

                }
            );

        }


        (
            calendarData.personalEvents ||
            []
        )
        .filter(
            function(event) {

                return (
                    event.date ===
                    dateString
                );

            }
        )
        .forEach(
            function(event) {

                cell.appendChild(
                    makeChip({

                        type:
                            "personal",

                        title:
                            event.title,

                        time:
                            event.startTime

                    })
                );

            }
        );


        cell.addEventListener(
            "click",
            function() {

                document
                    .getElementById(
                        "eventDate"
                    )
                    .value =
                    dateString;


                document
                    .getElementById(
                        "eventTitle"
                    )
                    .focus();

            }
        );


        grid.appendChild(
            cell
        );

    }


    renderUpcoming();

}


function getClassesForDate(
    date
) {

    const names = [

        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"

    ];


    const day =
        names[
            date.getDay()
        ];


    return (
        calendarData.schedule ||
        []
    )
    .filter(
        function(event) {

            return (
                String(
                    event.day ||
                    ""
                )
                .trim()
                .toLowerCase()
                ===
                day.toLowerCase()
            );

        }
    )
    .map(
        function(event) {

            return {

                type:
                    "class",

                title:
                    event.subject,

                time:
                    event.startTime

            };

        }
    );

}


function getTestsForDate(
    date
) {

    return (
        calendarData.tests ||
        []
    )
    .filter(
        function(test) {

            return (
                test.date ===
                date
            );

        }
    );

}


function makeChip(
    event
) {

    const chip =
        document.createElement(
            "div"
        );


    chip.className =
        "event-chip " +
        (
            event.type ===
                "test"
                ? "event-test"
                : event.type ===
                    "personal"
                    ? "event-personal"
                    : "event-class"
        );


    chip.textContent =
        (
            event.time
                ? event.time + " "
                : ""
        ) +
        event.title;


    return chip;

}


/* =========================================================
   UPCOMING
========================================================= */

function renderUpcoming() {

    const box =
        document.getElementById(
            "upcomingEvents"
        );


    const items =
        [];


    const today =
        localDateString(
            new Date()
        );


    if (
        calendarData.approved
    ) {

        (
            calendarData.tests ||
            []
        )
        .filter(
            function(test) {

                return (
                    test.date >=
                    today
                );

            }
        )
        .slice(
            0,
            5
        )
        .forEach(
            function(test) {

                items.push({

                    date:
                        test.date,

                    title:
                        test.title,

                    meta:
                        test.subject,

                    color:
                        "#dc2626"

                });

            }
        );

    }


    (
        calendarData.personalEvents ||
        []
    )
    .filter(
        function(event) {

            return (
                event.date >=
                today
            );

        }
    )
    .slice(
        0,
        5
    )
    .forEach(
        function(event) {

            items.push({

                date:
                    event.date,

                title:
                    event.title,

                meta:
                    event.startTime,

                color:
                    "#16834a"

            });

        }
    );


    items.sort(
        function(a, b) {

            return (
                a.date.localeCompare(
                    b.date
                )
            );

        }
    );


    if (!items.length) {

        box.innerHTML =
            `
            <div
                style="color:#8a94a6;font-size:13px;"
            >
                Nothing upcoming.
            </div>
            `;

        return;

    }


    box.innerHTML =
        items
            .slice(
                0,
                8
            )
            .map(
                function(item) {

                    return `

                        <div class="upcoming-event">

                            <div class="upcoming-date">
                                ${escapeHtml(
                                    prettyDate(
                                        item.date
                                    )
                                )}
                            </div>

                            <div
                                class="upcoming-title"
                                style="
                                    color:${item.color};
                                "
                            >
                                ${escapeHtml(
                                    item.title
                                )}
                            </div>

                            <div class="upcoming-meta">
                                ${escapeHtml(
                                    item.meta || ""
                                )}
                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}


/* =========================================================
   REGISTRATION
========================================================= */

async function submitRegistration() {

    const name =
        document
            .getElementById(
                "registrationName"
            )
            .value
            .trim();


    const section =
        document
            .getElementById(
                "registrationSection"
            )
            .value
            .trim();


    const message =
        document.getElementById(
            "registrationMessage"
        );


    const button =
        document.getElementById(
            "registerButton"
        );


    if (
        !name ||
        !section
    ) {

        message.textContent =
            "Enter your name and section.";

        message.style.color =
            "#dc2626";

        return;

    }


    button.disabled =
        true;


    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "registerClass",

                            email:
                                currentUser.email,

                            name:
                                name,

                            section:
                                section

                        })

                }

            );


        const result =
            await response.json();


        if (
            result.accessDenied
        ) {

            showLocked();

            return;

        }


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Registration failed."
            );

        }


        await refreshCalendar();

    }

    catch (error) {

        message.textContent =
            error.message;

        message.style.color =
            "#dc2626";

    }

    finally {

        button.disabled =
            false;

    }

}

========================================================= */

function changeMonth(
    amount
) {

    displayedMonth.setMonth(
        displayedMonth.getMonth() +
        amount
    );


    renderCalendar();

}


function goToToday() {

    displayedMonth =
        new Date();


    displayedMonth.setDate(
        1
    );


    renderCalendar();

}


/* =========================================================
   HELPERS
========================================================= */

function localDateString(
    date
) {

    return [
        date.getFullYear(),

        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        ),

        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        )

    ].join("-");

}


function prettyDate(
    value
) {

    const date =
        new Date(
            value + "T00:00:00"
        );


    return date.toLocaleDateString(
        undefined,
        {
            weekday:
                "short",

            month:
                "short",

            day:
                "numeric"
        }
    );

}


function escapeHtml(
    value
) {

    return String(
        value ||
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
