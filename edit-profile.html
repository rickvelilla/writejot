<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Writejot | Edit Profile</title>


<style>

* {
    box-sizing:
        border-box;
}


html,
body {
    margin:
        0;

    min-height:
        100%;
}


body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f6f8fc;

    color:
        #1f2937;
}


/* =========================================================
   HEADER
========================================================= */

header {

    background:
        rgba(
            255,
            255,
            255,
            .97
        );

    border-bottom:
        1px solid #e5e7eb;

    padding:
        12px 6%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    position:
        sticky;

    top:
        0;

    z-index:
        20;
}


.brand {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;
}


.brand img {

    width:
        40px;

    height:
        40px;

    object-fit:
        contain;
}


.brand-name {

    font-size:
        22px;

    font-weight:
        700;
}


.back {

    color:
        #4285F4;

    text-decoration:
        none;

    font-weight:
        600;
}


/* =========================================================
   PAGE
========================================================= */

main {

    width:
        100%;

    max-width:
        650px;

    margin:
        35px auto 60px;

    padding:
        0 16px;
}


.card {

    background:
        white;

    border:
        1px solid #e1e6ee;

    border-radius:
        16px;

    padding:
        30px;

    box-shadow:
        0 8px 30px
        rgba(
            0,
            0,
            0,
            .04
        );
}


.card h1 {

    margin:
        0 0 6px;
}


.subtitle {

    color:
        #718096;

    margin:
        0 0 25px;
}


/* =========================================================
   PROFILE PREVIEW
========================================================= */

.preview {

    display:
        flex;

    align-items:
        center;

    gap:
        15px;

    padding:
        15px;

    background:
        #f8fafc;

    border:
        1px solid #edf0f4;

    border-radius:
        12px;

    margin-bottom:
        25px;
}


.preview img {

    width:
        70px;

    height:
        70px;

    border-radius:
        50%;

    object-fit:
        cover;

    border:
        2px solid #4285F4;

    background:
        #edf2f7;
}


.preview-name {

    font-weight:
        700;

    font-size:
        17px;
}


.preview-username {

    color:
        #4285F4;

    font-size:
        13px;
}


.preview-bio {

    color:
        #718096;

    font-size:
        13px;

    margin-top:
        3px;

    word-break:
        break-word;
}


/* =========================================================
   PHOTO
========================================================= */

.photo-area {

    text-align:
        center;

    margin-bottom:
        25px;
}


.photo {

    width:
        110px;

    height:
        110px;

    border-radius:
        50%;

    object-fit:
        cover;

    border:
        3px solid #4285F4;

    background:
        #edf2f7;
}


.upload-button {

    display:
        inline-block;

    margin-top:
        12px;

    padding:
        10px 15px;

    border:
        1px solid #d7dce3;

    border-radius:
        9px;

    background:
        white;

    color:
        #4285F4;

    font-weight:
        600;

    cursor:
        pointer;
}


.upload-button:hover {

    background:
        #f6f9ff;
}


#imageInput {

    display:
        none;
}


/* =========================================================
   FIELDS
========================================================= */

.field {

    margin-bottom:
        18px;
}


.field label {

    display:
        block;

    margin-bottom:
        7px;

    font-weight:
        700;
}


.field input,
.field textarea {

    width:
        100%;

    padding:
        12px 13px;

    border:
        1px solid #d8dee8;

    border-radius:
        9px;

    background:
        white;

    color:
        #1f2937;

    font-family:
        inherit;

    font-size:
        14px;

    outline:
        none;
}


.field input:focus,
.field textarea:focus {

    border-color:
        #4285F4;

    box-shadow:
        0 0 0 3px
        rgba(
            66,
            133,
            244,
            .08
        );
}


.field textarea {

    min-height:
        115px;

    resize:
        vertical;
}


/* =========================================================
   SAVE
========================================================= */

#saveButton {

    width:
        100%;

    padding:
        13px;

    border:
        none;

    border-radius:
        9px;

    background:
        #4285F4;

    color:
        white;

    font-weight:
        700;

    cursor:
        pointer;

    font-size:
        14px;
}


#saveButton:hover {

    background:
        #3367d6;
}


#saveButton:disabled {

    opacity:
        .65;

    cursor:
        not-allowed;
}


/* =========================================================
   STATUS
========================================================= */

#statusMessage {

    min-height:
        22px;

    margin-top:
        12px;

    text-align:
        center;

    font-size:
        13px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (
    max-width:
    600px
) {

    header {

        padding:
            10px 14px;
    }


    .brand-name {

        font-size:
            20px;
    }


    main {

        margin-top:
            20px;

        padding:
            0 10px;
    }


    .card {

        padding:
            22px 17px;
    }


    .preview img {

        width:
            58px;

        height:
            58px;
    }


    .photo {

        width:
            95px;

        height:
            95px;
    }

}

</style>

</head>



<body>


<header>

    <div class="brand">

        <img
            src="W.png"
            alt="Writejot"
        >


        <div class="brand-name">
            Writejot
        </div>

    </div>


    <a
        class="back"
        href="index.html"
    >
        ← Dashboard
    </a>

</header>



<main>

<div class="card">


<h1>
    Edit Profile
</h1>


<p class="subtitle">
    Update your Writejot profile.
</p>



<!-- =====================================================
     LIVE PREVIEW
====================================================== -->

<div class="preview">

    <img
        id="previewPicture"
        src="W.png"
        alt="Profile picture"
    >


    <div
        style="
            min-width:0;
        "
    >

        <div
            id="previewName"
            class="preview-name"
        >
            Your Name
        </div>


        <div
            id="previewUsername"
            class="preview-username"
        >
            @username
        </div>


        <div
            id="previewBio"
            class="preview-bio"
        >
            Your bio
        </div>

    </div>

</div>



<!-- =====================================================
     PROFILE PICTURE
====================================================== -->

<div class="photo-area">

    <img
        id="profilePicture"
        class="photo"
        src="W.png"
        alt="Profile picture"
    >


    <br>


    <button
        type="button"
        class="upload-button"
        onclick="openImagePicker()"
    >
        📷 Upload Profile Picture
    </button>


    <input
        id="imageInput"
        type="file"
        accept="image/*"
        onchange="handleImageSelection(event)"
    >

</div>



<!-- =====================================================
     NAME
====================================================== -->

<div class="field">

    <label
        for="nameInput"
    >
        Display Name
    </label>


    <input
        id="nameInput"
        type="text"
        maxlength="80"
        placeholder="Your name"
    >

</div>



<!-- =====================================================
     USERNAME
====================================================== -->

<div class="field">

    <label
        for="usernameInput"
    >
        Username
    </label>


    <input
        id="usernameInput"
        type="text"
        maxlength="20"
        placeholder="username"
    >

</div>



<!-- =====================================================
     BIO
====================================================== -->

<div class="field">

    <label
        for="bioInput"
    >
        Bio
    </label>


    <textarea
        id="bioInput"
        maxlength="500"
        placeholder="Tell people a little about yourself..."
    ></textarea>

</div>



<!-- =====================================================
     SAVE
====================================================== -->

<button
    id="saveButton"
    type="button"
    onclick="saveProfile()"
>
    Save Changes
</button>


<div
    id="statusMessage"
></div>


</div>

</main>



<script>


/* =========================================================
   CONFIG
========================================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


let currentUser =
    null;


let selectedImage =
    null;


let oldProfile =
    null;


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    function() {

        const saved =
            localStorage.getItem(
                "writejotUser"
            );


        if (!saved) {

            location.href =
                "index.html";

            return;

        }


        try {

            currentUser =
                JSON.parse(
                    saved
                );

        }

        catch {

            location.href =
                "index.html";

            return;

        }


        /*
         * Show cached/local information instantly.
         */

        loadLocalProfile();


        /*
         * Refresh profile from server
         * in the background.
         */

        refreshProfile();

    }
);


/* =========================================================
   LOAD LOCAL PROFILE
========================================================= */

function loadLocalProfile() {

    const picture =
        currentUser.profilePicture ||
        currentUser.picture ||
        "W.png";


    document
        .getElementById(
            "profilePicture"
        )
        .src =
        picture;


    document
        .getElementById(
            "previewPicture"
        )
        .src =
        picture;


    document
        .getElementById(
            "nameInput"
        )
        .value =
        currentUser.name ||
        "";


    document
        .getElementById(
            "usernameInput"
        )
        .value =
        currentUser.username ||
        "";


    document
        .getElementById(
            "bioInput"
        )
        .value =
        currentUser.bio ||
        "";


    updatePreview();

}



/* =========================================================
   BACKGROUND REFRESH
========================================================= */

async function refreshProfile() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=profile&username=" +
                encodeURIComponent(
                    currentUser.username
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        if (
            !result.success ||
            !result.profile
        ) {

            return;

        }


        const profile =
            result.profile;


        oldProfile =
            {
                ...profile
            };


        /*
         * Only update the form with server data
         * if the user hasn't started changing it.
         */

        if (
            !selectedImage
        ) {

            document
                .getElementById(
                    "nameInput"
                )
                .value =
                profile.name ||
                "";


            document
                .getElementById(
                    "usernameInput"
                )
                .value =
                profile.username ||
                "";


            document
                .getElementById(
                    "bioInput"
                )
                .value =
                profile.bio ||
                "";


            document
                .getElementById(
                    "profilePicture"
                )
                .src =
                profile.profilePicture ||
                "W.png";


            document
                .getElementById(
                    "previewPicture"
                )
                .src =
                profile.profilePicture ||
                "W.png";


            updatePreview();

        }

    }

    catch {

        console.log(
            "Profile refresh failed."
        );

    }

}



/* =========================================================
   LIVE PREVIEW
========================================================= */

document.addEventListener(
    "input",
    function(event) {

        if (
            event.target.id ===
                "nameInput" ||
            event.target.id ===
                "usernameInput" ||
            event.target.id ===
                "bioInput"
        ) {

            updatePreview();

        }

    }
);


function updatePreview() {

    const name =
        document
            .getElementById(
                "nameInput"
            )
            .value
            .trim();


    const username =
        document
            .getElementById(
                "usernameInput"
            )
            .value
            .trim()
            .replace(
                /^@/,
                ""
            );


    const bio =
        document
            .getElementById(
                "bioInput"
            )
            .value
            .trim();


    document
        .getElementById(
            "previewName"
        )
        .textContent =
        name ||
        "Your Name";


    document
        .getElementById(
            "previewUsername"
        )
        .textContent =
        "@" +
        (
            username ||
            "username"
        );


    document
        .getElementById(
            "previewBio"
        )
        .textContent =
        bio ||
        "Your bio";

}



/* =========================================================
   IMAGE PICKER
========================================================= */

function openImagePicker() {

    document
        .getElementById(
            "imageInput"
        )
        .click();

}


function handleImageSelection(
    event
) {

    const file =
        event.target.files &&
        event.target.files[0];


    if (!file) {

        return;

    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Please choose an image."
        );

        event.target.value =
            "";

        return;

    }


    if (
        file.size >
        10 * 1024 * 1024
    ) {

        alert(
            "Please choose an image smaller than 10 MB."
        );

        event.target.value =
            "";

        return;

    }


    selectedImage =
        file;


    /*
     * Show the selected picture
     * immediately.
     */

    const reader =
        new FileReader();


    reader.onload =
        function() {

            document
                .getElementById(
                    "profilePicture"
                )
                .src =
                reader.result;


            document
                .getElementById(
                    "previewPicture"
                )
                .src =
                reader.result;

        };


    reader.readAsDataURL(
        file
    );

}



/* =========================================================
   SAVE PROFILE
========================================================= */

async function saveProfile() {

    const name =
        document
            .getElementById(
                "nameInput"
            )
            .value
            .trim();


    const username =
        document
            .getElementById(
                "usernameInput"
            )
            .value
            .trim()
            .toLowerCase()
            .replace(
                /^@/,
                ""
            );


    const bio =
        document
            .getElementById(
                "bioInput"
            )
            .value
            .trim();


    const button =
        document.getElementById(
            "saveButton"
        );


    const status =
        document.getElementById(
            "statusMessage"
        );


    if (!name) {

        status.textContent =
            "Please enter a display name.";

        status.style.color =
            "#dc2626";

        return;

    }


    if (
        username.length <
            3 ||
        username.length >
            20
    ) {

        status.textContent =
            "Username must be 3–20 characters.";

        status.style.color =
            "#dc2626";

        return;

    }


    if (
        !/^[a-z0-9_]+$/i.test(
            username
        )
    ) {

        status.textContent =
            "Username can only contain letters, numbers, and underscores.";

        status.style.color =
            "#dc2626";

        return;

    }


    /*
     * Store previous profile for rollback.
     */

    const previousUser =
        {
            ...currentUser
        };


    /*
     * =====================================================
     * OPTIMISTIC UPDATE
     * =====================================================
     */

    currentUser.name =
        name;


    currentUser.username =
        username;


    currentUser.bio =
        bio;


    /*
     * Keep the image preview instantly.
     *
     * It will be replaced with the real
     * Google Drive URL after upload.
     */

    if (
        !selectedImage
    ) {

        currentUser.profilePicture =
            currentUser.profilePicture ||
            currentUser.picture ||
            "W.png";

    }


    localStorage.setItem(

        "writejotUser",

        JSON.stringify(
            currentUser
        )

    );


    /*
     * Give instant feedback.
     */

    status.textContent =
        "Changes applied.";

    status.style.color =
        "#16834a";


    button.disabled =
        true;

    button.textContent =
        "Saving...";


    try {

        let imageData =
            "";

        let imageType =
            "";

        let imageName =
            "";


        /*
         * Compress/upload picture only
         * if a new picture was selected.
         */

        if (
            selectedImage
        ) {

            const compressed =
                await compressImage(
                    selectedImage
                );


            imageData =
                compressed.dataUrl;


            imageType =
                compressed.mimeType;


            imageName =
                compressed.fileName;

        }


        const response =
            await fetch(

                APPS_SCRIPT_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "updateProfile",

                            email:
                                currentUser.email,

                            name:
                                name,

                            username:
                                username,

                            bio:
                                bio,

                            profileImageData:
                                imageData,

                            profileImageType:
                                imageType,

                            profileImageName:
                                imageName

                        })

                }

            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Could not save profile."
            );

        }


        /*
         * Server confirmed everything.
         */

        currentUser.name =
            result.name ||
            name;


        currentUser.username =
            result.username ||
            username;


        currentUser.bio =
            result.bio ||
            bio;


        currentUser.profilePicture =
            result.profilePicture ||
            currentUser.profilePicture ||
            "W.png";


        localStorage.setItem(

            "writejotUser",

            JSON.stringify(
                currentUser
            )

        );


        /*
         * Update actual saved image.
         */

        document
            .getElementById(
                "profilePicture"
            )
            .src =
            currentUser.profilePicture;


        document
            .getElementById(
                "previewPicture"
            )
            .src =
            currentUser.profilePicture;


        updatePreview();


        selectedImage =
            null;


        /*
         * Clear file input.
         */

        document
            .getElementById(
                "imageInput"
            )
            .value =
            "";


        status.textContent =
            "Changes saved.";

        status.style.color =
            "#16834a";


        /*
         * Small delay only before navigating,
         * so the user gets visible confirmation.
         */

        setTimeout(
            function() {

                window.location.href =
                    "index.html";

            },
            350
        );

    }

    catch (error) {

        /*
         * ROLLBACK
         */

        currentUser =
            previousUser;


        localStorage.setItem(

            "writejotUser",

            JSON.stringify(
                currentUser
            )

        );


        loadLocalProfile();


        selectedImage =
            null;


        document
            .getElementById(
                "imageInput"
            )
            .value =
            "";


        status.textContent =
            error.message ||
            "Could not save changes.";

        status.style.color =
            "#dc2626";

    }

    finally {

        button.disabled =
            false;

        button.textContent =
            "Save Changes";

    }

}



/* =========================================================
   IMAGE COMPRESSION
========================================================= */

function compressImage(
    file
) {

    return new Promise(
        function(
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onerror =
                reject;


            reader.onload =
                function() {

                    const image =
                        new Image();


                    image.onerror =
                        reject;


                    image.onload =
                        function() {

                            const maxSize =
                                1200;


                            let width =
                                image.width;


                            let height =
                                image.height;


                            if (
                                width >
                                maxSize ||
                                height >
                                maxSize
                            ) {

                                if (
                                    width >
                                    height
                                ) {

                                    height =
                                        Math.round(
                                            height *
                                            maxSize /
                                            width
                                        );

                                    width =
                                        maxSize;

                                }

                                else {

                                    width =
                                        Math.round(
                                            width *
                                            maxSize /
                                            height
                                        );

                                    height =
                                        maxSize;

                                }

                            }


                            const canvas =
                                document
                                    .createElement(
                                        "canvas"
                                    );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const context =
                                canvas
                                    .getContext(
                                        "2d"
                                    );


                            context.drawImage(

                                image,

                                0,
                                0,

                                width,
                                height

                            );


                            resolve({

                                dataUrl:
                                    canvas.toDataURL(
                                        "image/jpeg",
                                        .82
                                    ),

                                mimeType:
                                    "image/jpeg",

                                fileName:
                                    "profile-" +
                                    Date.now() +
                                    ".jpg"

                            });

                        };


                    image.src =
                        reader.result;

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}

</script>


</body>

</html>
