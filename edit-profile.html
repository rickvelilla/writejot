<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Writejot | Edit Profile</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            min-height: 100%;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f6f8fc;

            color:
                #1f2937;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {
            background:
                rgba(
                    255,
                    255,
                    255,
                    .97
                );

            border-bottom:
                1px solid #e5e7eb;

            padding:
                12px 6%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            position:
                sticky;

            top:
                0;

            z-index:
                20;
        }


        .brand {
            display:
                flex;

            align-items:
                center;

            gap:
                10px;
        }


        .brand img {
            width:
                40px;

            height:
                40px;

            object-fit:
                contain;
        }


        .brand-name {
            font-size:
                22px;

            font-weight:
                700;
        }


        .back {
            color:
                #4285F4;

            text-decoration:
                none;

            font-weight:
                600;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        main {
            width:
                100%;

            max-width:
                650px;

            margin:
                35px auto 60px;

            padding:
                0 16px;
        }


        .card {
            background:
                white;

            border:
                1px solid #e1e6ee;

            border-radius:
                16px;

            padding:
                30px;

            box-shadow:
                0 8px 30px
                rgba(
                    0,
                    0,
                    0,
                    .04
                );
        }


        .card h1 {
            margin:
                0 0 6px;
        }


        .subtitle {
            color:
                #718096;

            margin:
                0 0 25px;
        }


        /* =====================================================
           LIVE PREVIEW
        ===================================================== */

        .preview {
            display:
                flex;

            align-items:
                center;

            gap:
                15px;

            padding:
                15px;

            background:
                #f8fafc;

            border:
                1px solid #edf0f4;

            border-radius:
                12px;

            margin-bottom:
                25px;
        }


        .preview img {
            width:
                70px;

            height:
                70px;

            border-radius:
                50%;

            object-fit:
                cover;

            border:
                2px solid #4285F4;

            background:
                #edf2f7;

            flex-shrink:
                0;
        }


        .preview-info {
            min-width:
                0;

            flex:
                1;
        }


        .preview-name {
            font-weight:
                700;

            font-size:
                17px;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }


        .preview-username {
            color:
                #4285F4;

            font-size:
                13px;
        }


        .preview-bio {
            color:
                #718096;

            font-size:
                13px;

            margin-top:
                3px;

            word-break:
                break-word;
        }


        /* =====================================================
           PHOTO
        ===================================================== */

        .photo-area {
            text-align:
                center;

            margin-bottom:
                25px;
        }


        .photo {
            width:
                110px;

            height:
                110px;

            border-radius:
                50%;

            object-fit:
                cover;

            border:
                3px solid #4285F4;

            background:
                #edf2f7;
        }


        .upload-button {
            display:
                inline-block;

            margin-top:
                12px;

            padding:
                10px 15px;

            border:
                1px solid #d7dce3;

            border-radius:
                9px;

            background:
                white;

            color:
                #4285F4;

            font-weight:
                600;

            cursor:
                pointer;
        }


        .upload-button:hover {
            background:
                #f6f9ff;
        }


        #imageInput {
            display:
                none;
        }


        /* =====================================================
           FIELDS
        ===================================================== */

        .field {
            margin-bottom:
                18px;
        }


        .field label {
            display:
                block;

            margin-bottom:
                7px;

            font-weight:
                700;
        }


        .field input,
        .field textarea {
            width:
                100%;

            padding:
                12px 13px;

            border:
                1px solid #d8dee8;

            border-radius:
                9px;

            background:
                white;

            color:
                #1f2937;

            font-family:
                inherit;

            font-size:
                14px;

            outline:
                none;
        }


        .field input:focus,
        .field textarea:focus {
            border-color:
                #4285F4;

            box-shadow:
                0 0 0 3px
                rgba(
                    66,
                    133,
                    244,
                    .08
                );
        }


        .field textarea {
            min-height:
                115px;

            resize:
                vertical;
        }


        /* =====================================================
           USERNAME STATUS
        ===================================================== */

        #usernameStatus {
            min-height:
                19px;

            margin-top:
                6px;

            font-size:
                12px;
        }


        /* =====================================================
           SAVE
        ===================================================== */

        #saveButton {
            width:
                100%;

            padding:
                13px;

            border:
                none;

            border-radius:
                9px;

            background:
                #4285F4;

            color:
                white;

            font-weight:
                700;

            cursor:
                pointer;

            font-size:
                14px;
        }


        #saveButton:hover {
            background:
                #3367d6;
        }


        #saveButton:disabled {
            opacity:
                .65;

            cursor:
                not-allowed;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        #statusMessage {
            min-height:
                22px;

            margin-top:
                12px;

            text-align:
                center;

            font-size:
                13px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (
            max-width:
            600px
        ) {

            header {
                padding:
                    10px 14px;
            }


            .brand-name {
                font-size:
                    20px;
            }


            main {
                margin-top:
                    20px;

                padding:
                    0 10px;
            }


            .card {
                padding:
                    22px 17px;
            }


            .preview img {
                width:
                    58px;

                height:
                    58px;
            }


            .photo {
                width:
                    95px;

                height:
                    95px;
            }

        }

    </style>

</head>



<body>


<!-- ========================================================
     HEADER
========================================================= -->

<header>

    <div class="brand">

        <img
            src="W.png"
            alt="Writejot"
        >


        <div class="brand-name">
            Writejot
        </div>

    </div>


    <a
        class="back"
        href="index.html"
    >
        ← Dashboard
    </a>

</header>



<!-- ========================================================
     PAGE
========================================================= -->

<main>

<div class="card">


    <h1>
        Edit Profile
    </h1>


    <p class="subtitle">
        Update your Writejot profile.
    </p>



    <!-- =====================================================
         LIVE PREVIEW
    ====================================================== -->

    <div class="preview">

        <img
            id="previewPicture"
            src="W.png"
            alt="Profile picture"
        >


        <div
            class="preview-info"
        >

            <div
                id="previewName"
                class="preview-name"
            >
                Your Name
            </div>


            <div
                id="previewUsername"
                class="preview-username"
            >
                @username
            </div>


            <div
                id="previewBio"
                class="preview-bio"
            >
                Your bio
            </div>

        </div>

    </div>



    <!-- =====================================================
         PROFILE PICTURE
    ====================================================== -->

    <div class="photo-area">

        <img
            id="profilePicture"
            class="photo"
            src="W.png"
            alt="Profile picture"
        >


        <br>


        <button
            type="button"
            class="upload-button"
            onclick="openImagePicker()"
        >
            📷 Upload Profile Picture
        </button>


        <input
            id="imageInput"
            type="file"
            accept="image/*"
            onchange="handleImageSelection(event)"
        >

    </div>



    <!-- =====================================================
         DISPLAY NAME
    ====================================================== -->

    <div class="field">

        <label
            for="nameInput"
        >
            Display Name
        </label>


        <input
            id="nameInput"
            type="text"
            maxlength="80"
            placeholder="Your name"
        >

    </div>



    <!-- =====================================================
         USERNAME
    ====================================================== -->

    <div class="field">

        <label
            for="usernameInput"
        >
            Username
        </label>


        <input
            id="usernameInput"
            type="text"
            maxlength="20"
            placeholder="username"
            autocomplete="off"
        >


        <div
            id="usernameStatus"
        ></div>

    </div>



    <!-- =====================================================
         BIO
    ====================================================== -->

    <div class="field">

        <label
            for="bioInput"
        >
            Bio
        </label>


        <textarea
            id="bioInput"
            maxlength="500"
            placeholder="Tell people a little about yourself..."
        ></textarea>

    </div>



    <!-- =====================================================
         SAVE
    ====================================================== -->

    <button
        id="saveButton"
        type="button"
        onclick="saveProfile()"
    >
        Save Changes
    </button>


    <div
        id="statusMessage"
    ></div>


</div>

</main>



<script>


/* =========================================================
   CONFIG
========================================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


const USERNAME_CHECK_DELAY =
    300;


let currentUser =
    null;


let originalProfile =
    null;


let selectedImage =
    null;


let usernameTimer =
    null;


let usernameCheckNumber =
    0;


let usernameAvailable =
    true;


let lastCheckedUsername =
    "";


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    function() {

        const saved =
            localStorage.getItem(
                "writejotUser"
            );


        if (!saved) {

            location.href =
                "index.html";

            return;

        }


        try {

            currentUser =
                JSON.parse(
                    saved
                );

        }

        catch {

            localStorage.removeItem(
                "writejotUser"
            );

            location.href =
                "index.html";

            return;

        }


        /*
         * Show local information immediately.
         */

        loadLocalProfile();


        /*
         * Check the current username so
         * the save button starts in a
         * known state.
         */

        checkUsernameAvailability(
            document
                .getElementById(
                    "usernameInput"
                )
                .value
                .trim()
        );


        /*
         * Refresh from server in background.
         */

        refreshProfile();

    }
);


/* =========================================================
   LOAD LOCAL PROFILE
========================================================= */

function loadLocalProfile() {

    const picture =
        currentUser.profilePicture ||
        currentUser.picture ||
        "W.png";


    document
        .getElementById(
            "profilePicture"
        )
        .src =
        picture;


    document
        .getElementById(
            "previewPicture"
        )
        .src =
        picture;


    document
        .getElementById(
            "nameInput"
        )
        .value =
        currentUser.name ||
        "";


    document
        .getElementById(
            "usernameInput"
        )
        .value =
        currentUser.username ||
        "";


    document
        .getElementById(
            "bioInput"
        )
        .value =
        currentUser.bio ||
        "";


    updatePreview();

}



/* =========================================================
   BACKGROUND PROFILE REFRESH
========================================================= */

async function refreshProfile() {

    try {

        /*
         * We use the local username first.
         */

        const username =
            String(
                currentUser.username ||
                ""
            )
            .trim()
            .replace(
                /^@/,
                ""
            );


        if (!username) {
            return;
        }


        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=profile&username=" +
                encodeURIComponent(
                    username
                ),

                {
                    cache:
                        "no-store"
                }

            );


        if (
            !response.ok
        ) {

            return;

        }


        const result =
            await response.json();


        if (
            !result.success ||
            !result.profile
        ) {

            return;

        }


        originalProfile =
            {
                ...result.profile
            };


        /*
         * Refresh the saved user object
         * with authoritative data.
         */

        currentUser.name =
            result.profile.name ||
            currentUser.name ||
            "";


        currentUser.username =
            result.profile.username ||
            currentUser.username ||
            "";


        currentUser.bio =
            result.profile.bio ||
            currentUser.bio ||
            "";


        currentUser.profilePicture =
            result.profile.profilePicture ||
            currentUser.profilePicture ||
            "W.png";


        localStorage.setItem(

            "writejotUser",

            JSON.stringify(
                currentUser
            )

        );


        /*
         * Don't overwrite active edits.
         */

        if (
            !hasUnsavedChanges()
        ) {

            loadLocalProfile();

        }

    }

    catch (error) {

        console.log(
            "Profile refresh failed."
        );

    }

}



/* =========================================================
   LIVE PREVIEW
========================================================= */

document.addEventListener(
    "input",
    function(event) {

        if (
            event.target.id ===
                "nameInput" ||

            event.target.id ===
                "usernameInput" ||

            event.target.id ===
                "bioInput"
        ) {

            updatePreview();

        }


        if (
            event.target.id ===
            "usernameInput"
        ) {

            queueUsernameCheck();

        }

    }
);


function updatePreview() {

    const name =
        document
            .getElementById(
                "nameInput"
            )
            .value
            .trim();


    const username =
        document
            .getElementById(
                "usernameInput"
            )
            .value
            .trim()
            .replace(
                /^@/,
                ""
            );


    const bio =
        document
            .getElementById(
                "bioInput"
            )
            .value
            .trim();


    document
        .getElementById(
            "previewName"
        )
        .textContent =
        name ||
        "Your Name";


    document
        .getElementById(
            "previewUsername"
        )
        .textContent =
        "@" +
        (
            username ||
            "username"
        );


    document
        .getElementById(
            "previewBio"
        )
        .textContent =
        bio ||
        "Your bio";

}



/* =========================================================
   USERNAME CHECK
========================================================= */

function queueUsernameCheck() {

    clearTimeout(
        usernameTimer
    );


    const username =
        document
            .getElementById(
                "usernameInput"
            )
            .value
            .trim()
            .toLowerCase()
            .replace(
                /^@/,
                ""
            );


    /*
     * Empty username.
     */

    if (!username) {

        setUsernameStatus(
            "Enter a username.",
            "#dc2626"
        );


        usernameAvailable =
            false;


        lastCheckedUsername =
            "";


        return;

    }


    /*
     * Basic validation before
     * making a server request.
     */

    if (
        username.length <
            3 ||
        username.length >
            20
    ) {

        setUsernameStatus(
            "Username must be 3–20 characters.",
            "#dc2626"
        );


        usernameAvailable =
            false;


        lastCheckedUsername =
            "";


        return;

    }


    if (
        !/^[a-z0-9_]+$/i.test(
            username
        )
    ) {

        setUsernameStatus(
            "Use only letters, numbers, and underscores.",
            "#dc2626"
        );


        usernameAvailable =
            false;


        lastCheckedUsername =
            "";


        return;

    }


    /*
     * If the username hasn't changed from
     * the saved username, it's automatically okay.
     */

    const originalUsername =
        String(
            currentUser.username ||
            ""
        )
        .trim()
        .toLowerCase()
        .replace(
            /^@/,
            ""
        );


    if (
        username ===
        originalUsername
    ) {

        usernameAvailable =
            true;


        lastCheckedUsername =
            username;


        setUsernameStatus(
            "✓ Current username",
            "#16834a"
        );


        return;

    }


    usernameAvailable =
        false;


    lastCheckedUsername =
        "";


    setUsernameStatus(
        "Checking username...",
        "#718096"
    );


    usernameTimer =
        setTimeout(
            function() {

                checkUsernameAvailability(
                    username
                );

            },
            USERNAME_CHECK_DELAY
        );

}


async function checkUsernameAvailability(
    username
) {

    const cleaned =
        String(
            username ||
            ""
        )
        .trim()
        .toLowerCase()
        .replace(
            /^@/,
            ""
        );


    const requestId =
        ++usernameCheckNumber;


    if (!cleaned) {

        usernameAvailable =
            false;

        return;

    }


    const originalUsername =
        String(
            currentUser.username ||
            ""
        )
        .trim()
        .toLowerCase()
        .replace(
            /^@/,
            ""
        );


    if (
        cleaned ===
        originalUsername
    ) {

        usernameAvailable =
            true;


        lastCheckedUsername =
            cleaned;


        setUsernameStatus(
            "✓ Current username",
            "#16834a"
        );


        return;

    }


    setUsernameStatus(
        "Checking username...",
        "#718096"
    );


    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=usernameAvailable" +
                "&username=" +
                encodeURIComponent(
                    cleaned
                ) +
                "&email=" +
                encodeURIComponent(
                    currentUser.email
                ),

                {
                    cache:
                        "no-store"
                }

            );


        const result =
            await response.json();


        /*
         * Ignore an old request.
         */

        if (
            requestId !==
            usernameCheckNumber
        ) {

            return;

        }


        /*
         * Make sure the user hasn't changed
         * the field while the request was running.
         */

        const currentValue =
            document
                .getElementById(
                    "usernameInput"
                )
                .value
                .trim()
                .toLowerCase()
                .replace(
                    /^@/,
                    ""
                );


        if (
            currentValue !==
            cleaned
        ) {

            return;

        }


        if (
            result.success &&
            result.available === true
        ) {

            usernameAvailable =
                true;


            lastCheckedUsername =
                cleaned;


            setUsernameStatus(
                "✓ Username available",
                "#16834a"
            );

        }

        else {

            usernameAvailable =
                false;


            lastCheckedUsername =
                cleaned;


            setUsernameStatus(
                result.error ||
                "✗ Username is already taken",
                "#dc2626"
            );

        }

    }

    catch {

        /*
         * Don't assume availability if
         * the server couldn't be reached.
         */

        usernameAvailable =
            false;


        lastCheckedUsername =
            "";


        setUsernameStatus(
            "Couldn't check username. Try again.",
            "#dc2626"
        );

    }

}


function setUsernameStatus(
    text,
    color
) {

    const element =
        document.getElementById(
            "usernameStatus"
        );


    element.textContent =
        text;


    element.style.color =
        color;

}



/* =========================================================
   IMAGE PICKER
========================================================= */

function openImagePicker() {

    document
        .getElementById(
            "imageInput"
        )
        .click();

}


function handleImageSelection(
    event
) {

    const file =
        event.target.files &&
        event.target.files[0];


    if (!file) {

        return;

    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Please choose an image."
        );

        event.target.value =
            "";

        return;

    }


    if (
        file.size >
        10 * 1024 * 1024
    ) {

        alert(
            "Please choose an image smaller than 10 MB."
        );

        event.target.value =
            "";

        return;

    }


    selectedImage =
        file;


    /*
     * Show photo immediately.
     */

    const reader =
        new FileReader();


    reader.onload =
        function() {

            document
                .getElementById(
                    "profilePicture"
                )
                .src =
                reader.result;


            document
                .getElementById(
                    "previewPicture"
                )
                .src =
                reader.result;

        };


    reader.readAsDataURL(
        file
    );

}



/* =========================================================
   SAVE PROFILE
========================================================= */

async function saveProfile() {

    const name =
        document
            .getElementById(
                "nameInput"
            )
            .value
            .trim();


    const username =
        document
            .getElementById(
                "usernameInput"
            )
            .value
            .trim()
            .toLowerCase()
            .replace(
                /^@/,
                ""
            );


    const bio =
        document
            .getElementById(
                "bioInput"
            )
            .value
            .trim();


    const button =
        document.getElementById(
            "saveButton"
        );


    const status =
        document.getElementById(
            "statusMessage"
        );


    /*
     * Basic validation.
     */

    if (!name) {

        status.textContent =
            "Please enter a display name.";

        status.style.color =
            "#dc2626";

        return;

    }


    if (
        username.length <
            3 ||
        username.length >
            20
    ) {

        status.textContent =
            "Username must be 3–20 characters.";

        status.style.color =
            "#dc2626";

        return;

    }


    if (
        !/^[a-z0-9_]+$/i.test(
            username
        )
    ) {

        status.textContent =
            "Username can only contain letters, numbers, and underscores.";

        status.style.color =
            "#dc2626";

        return;

    }


    /*
     * =====================================================
     * IMPORTANT:
     *
     * CHECK USERNAME BEFORE OPTIMISTIC UPDATE
     * =====================================================
     */

    const originalUsername =
        String(
            currentUser.username ||
            ""
        )
        .trim()
        .toLowerCase()
        .replace(
            /^@/,
            ""
        );


    if (
        username !==
        originalUsername
    ) {

        /*
         * If this exact username hasn't
         * been confirmed yet, check it now.
         */

        if (
            !usernameAvailable ||
            lastCheckedUsername !==
                username
        ) {

            button.disabled =
                true;


            button.textContent =
                "Checking...";


            setUsernameStatus(
                "Checking username...",
                "#718096"
            );


            try {

                const response =
                    await fetch(

                        APPS_SCRIPT_URL +
                        "?action=usernameAvailable" +
                        "&username=" +
                        encodeURIComponent(
                            username
                        ) +
                        "&email=" +
                        encodeURIComponent(
                            currentUser.email
                        ),

                        {
                            cache:
                                "no-store"
                        }

                    );


                const result =
                    await response.json();


                if (
                    !result.success ||
                    result.available !== true
                ) {

                    usernameAvailable =
                        false;


                    lastCheckedUsername =
                        username;


                    setUsernameStatus(
                        result.error ||
                        "Username is already taken.",
                        "#dc2626"
                    );


                    status.textContent =
                        result.error ||
                        "Username is already taken.";

                    status.style.color =
                        "#dc2626";


                    button.disabled =
                        false;

                    button.textContent =
                        "Save Changes";


                    return;

                }


                usernameAvailable =
                    true;


                lastCheckedUsername =
                    username;


                setUsernameStatus(
                    "✓ Username available",
                    "#16834a"
                );

            }

            catch {

                usernameAvailable =
                    false;


                lastCheckedUsername =
                    "";


                setUsernameStatus(
                    "Couldn't check username. Try again.",
                    "#dc2626"
                );


                status.textContent =
                    "Couldn't verify username.";

                status.style.color =
                    "#dc2626";


                button.disabled =
                    false;

                button.textContent =
                    "Save Changes";


                return;

            }

            finally {

                if (
                    button.textContent ===
                    "Checking..."
                ) {

                    button.disabled =
                        false;

                    button.textContent =
                        "Save Changes";

                }

            }

        }


        /*
         * Final local check.
         */

        if (
            !usernameAvailable ||
            lastCheckedUsername !==
                username
        ) {

            status.textContent =
                "Username is already taken or couldn't be verified.";

            status.style.color =
                "#dc2626";

            return;

        }

    }


    /*
     * =====================================================
     * STORE OLD PROFILE FOR ROLLBACK
     * =====================================================
     */

    const previousUser =
        {
            ...currentUser
        };


    /*
     * =====================================================
     * OPTIMISTIC UPDATE
     * =====================================================
     */

    currentUser.name =
        name;


    currentUser.username =
        username;


    currentUser.bio =
        bio;


    /*
     * Keep existing picture until
     * new picture gets uploaded.
     */

    if (
        !selectedImage
    ) {

        currentUser.profilePicture =
            currentUser.profilePicture ||
            currentUser.picture ||
            "W.png";

    }


    /*
     * Update local storage immediately.
     */

    localStorage.setItem(

        "writejotUser",

        JSON.stringify(
            currentUser
        )

    );


    /*
     * Show immediate feedback.
     */

    status.textContent =
        "Changes applied.";

    status.style.color =
        "#16834a";


    button.disabled =
        true;

    button.textContent =
        "Saving...";


    try {

        let imageData =
            "";

        let imageType =
            "";

        let imageName =
            "";


        /*
         * Compress the selected photo
         * before sending it to Drive.
         */

        if (
            selectedImage
        ) {

            const compressed =
                await compressImage(
                    selectedImage
                );


            imageData =
                compressed.dataUrl;


            imageType =
                compressed.mimeType;


            imageName =
                compressed.fileName;

        }


        /*
         * Save profile.
         */

        const response =
            await fetch(

                APPS_SCRIPT_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "updateProfile",

                            email:
                                currentUser.email,

                            name:
                                name,

                            username:
                                username,

                            bio:
                                bio,

                            profileImageData:
                                imageData,

                            profileImageType:
                                imageType,

                            profileImageName:
                                imageName

                        })

                }

            );


        const result =
            await response.json();


        /*
         * The server still gets the
         * final say.
         */

        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Could not save profile."
            );

        }


        /*
         * Server confirmed the change.
         */

        currentUser.name =
            result.name ||
            name;


        currentUser.username =
            result.username ||
            username;


        currentUser.bio =
            result.bio ||
            bio;


        currentUser.profilePicture =
            result.profilePicture ||
            currentUser.profilePicture ||
            "W.png";


        localStorage.setItem(

            "writejotUser",

            JSON.stringify(
                currentUser
            )

        );


        /*
         * Replace local image preview
         * with the real Drive image.
         */

        document
            .getElementById(
                "profilePicture"
            )
            .src =
            currentUser.profilePicture;


        document
            .getElementById(
                "previewPicture"
            )
            .src =
            currentUser.profilePicture;


        updatePreview();


        selectedImage =
            null;


        document
            .getElementById(
                "imageInput"
            )
            .value =
            "";


        status.textContent =
            "Changes saved.";

        status.style.color =
            "#16834a";


        /*
         * Go back to dashboard after
         * confirmation.
         */

        setTimeout(
            function() {

                window.location.href =
                    "index.html";

            },
            350
        );

    }

    catch (error) {

        /*
         * =================================================
         * ROLLBACK
         * =================================================
         */

        currentUser =
            previousUser;


        localStorage.setItem(

            "writejotUser",

            JSON.stringify(
                currentUser
            )

        );


        loadLocalProfile();


        selectedImage =
            null;


        document
            .getElementById(
                "imageInput"
            )
            .value =
            "";


        status.textContent =
            error.message ||
            "Could not save changes.";

        status.style.color =
            "#dc2626";

    }

    finally {

        button.disabled =
            false;

        button.textContent =
            "Save Changes";

    }

}



/* =========================================================
   COMPRESS IMAGE
========================================================= */

function compressImage(
    file
) {

    return new Promise(
        function(
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onerror =
                reject;


            reader.onload =
                function() {

                    const image =
                        new Image();


                    image.onerror =
                        reject;


                    image.onload =
                        function() {

                            const maxSize =
                                1200;


                            let width =
                                image.width;


                            let height =
                                image.height;


                            if (
                                width >
                                maxSize ||
                                height >
                                maxSize
                            ) {

                                if (
                                    width >
                                    height
                                ) {

                                    height =
                                        Math.round(
                                            height *
                                            maxSize /
                                            width
                                        );


                                    width =
                                        maxSize;

                                }

                                else {

                                    width =
                                        Math.round(
                                            width *
                                            maxSize /
                                            height
                                        );


                                    height =
                                        maxSize;

                                }

                            }


                            const canvas =
                                document
                                    .createElement(
                                        "canvas"
                                    );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const context =
                                canvas
                                    .getContext(
                                        "2d"
                                    );


                            context.drawImage(

                                image,

                                0,
                                0,

                                width,
                                height

                            );


                            resolve({

                                dataUrl:
                                    canvas.toDataURL(
                                        "image/jpeg",
                                        .82
                                    ),

                                mimeType:
                                    "image/jpeg",

                                fileName:
                                    "profile-" +
                                    Date.now() +
                                    ".jpg"

                            });

                        };


                    image.src =
                        reader.result;

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}



/* =========================================================
   UNSAVED CHANGE DETECTION
========================================================= */

function hasUnsavedChanges() {

    const name =
        document
            .getElementById(
                "nameInput"
            )
            .value
            .trim();


    const username =
        document
            .getElementById(
                "usernameInput"
            )
            .value
            .trim()
            .toLowerCase()
            .replace(
                /^@/,
                ""
            );


    const bio =
        document
            .getElementById(
                "bioInput"
            )
            .value
            .trim();


    return (

        name !==
            String(
                currentUser.name ||
                ""
            ).trim()

        ||

        username !==
            String(
                currentUser.username ||
                ""
            )
            .trim()
            .toLowerCase()
            .replace(
                /^@/,
                ""
            )

        ||

        bio !==
            String(
                currentUser.bio ||
                ""
            ).trim()

        ||

        !!selectedImage

    );

}
