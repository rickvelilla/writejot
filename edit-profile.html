<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Writejot | Edit Profile</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f6f8fc;

            color: #1f2937;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: white;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                12px 6%;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            position: sticky;

            top: 0;

            z-index: 100;
        }

        .brand {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;

            object-fit: contain;
        }

        .brand-name {
            font-size: 23px;
            font-weight: 700;

            color: #111827;
        }

        .back {
            color: #4285F4;

            text-decoration: none;

            font-weight: 600;
        }

        .back:hover {
            color: #3367d6;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 650px;

            margin:
                45px auto;

            padding:
                0 20px;
        }

        .card {
            background: white;

            border:
                1px solid #e1e6ee;

            border-radius: 16px;

            padding: 30px;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,0.04);
        }

        h1 {
            margin:
                0 0 6px;
        }

        .intro {
            color: #718096;

            margin-bottom:
                28px;
        }

        /* =========================
           PROFILE PHOTO
        ========================= */

        .preview {
            display: flex;

            flex-direction:
                column;

            align-items:
                center;

            margin-bottom:
                28px;
        }

        #photoPreview {
            width: 110px;
            height: 110px;

            border-radius: 50%;

            object-fit: cover;

            border:
                3px solid #4285F4;

            background:
                #eef4ff;

            margin-bottom:
                13px;
        }

        #photoInput {
            display: none;
        }

        .upload-button {
            display: inline-flex;

            align-items: center;

            justify-content:
                center;

            padding:
                10px 16px;

            border:
                1px solid #d7e3fb;

            border-radius:
                8px;

            background:
                white;

            color:
                #2563eb;

            font-weight:
                600;

            cursor:
                pointer;
        }

        .upload-button:hover {
            background:
                #f7faff;
        }

        .photo-hint {
            margin-top: 8px;

            color:
                #8a94a6;

            font-size:
                12px;

            text-align:
                center;
        }

        /* =========================
           FORM
        ========================= */

        .field {
            margin-bottom:
                20px;
        }

        label {
            display: block;

            font-weight: 600;

            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;

            padding: 13px;

            border:
                1px solid #d8dee8;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            font-family: inherit;

            background: white;
        }

        input:focus,
        textarea:focus {
            border-color:
                #4285F4;

            box-shadow:
                0 0 0 3px
                rgba(66,133,244,0.08);
        }

        textarea {
            min-height: 110px;

            resize:
                vertical;
        }

        /* =========================
           USERNAME
        ========================= */

        .username-wrapper {
            display: flex;

            align-items:
                center;

            border:
                1px solid #d8dee8;

            border-radius:
                8px;

            background:
                #f8fafc;
        }

        .username-prefix {
            padding-left: 14px;

            color:
                #6b7280;

            font-weight:
                600;
        }

        #username {
            border: none;

            background:
                transparent;

            outline:
                none;
        }

        /* =========================
           BUTTONS
        ========================= */

        .actions {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 10px;
        }

        button {
            padding:
                11px 18px;

            border-radius:
                8px;

            border:
                1px solid transparent;

            cursor:
                pointer;

            font-weight:
                600;

            font-size:
                14px;
        }

        button:disabled {
            opacity: 0.6;

            cursor:
                not-allowed;
        }

        .save {
            background:
                #4285F4;

            color:
                white;
        }

        .save:hover {
            background:
                #3367d6;
        }

        .cancel {
            background:
                white;

            color:
                #2563eb;

            border-color:
                #d7e3fb;
        }

        .cancel:hover {
            background:
                #f7faff;
        }

        /* =========================
           MESSAGE
        ========================= */

        #message {
            min-height:
                24px;

            margin-top:
                15px;

            font-size:
                14px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding:
                    11px 18px;
            }

            .brand-name {
                font-size:
                    20px;
            }

            .brand-logo {
                width: 38px;
                height: 38px;
            }

            .card {
                padding:
                    22px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="brand">

        <img
            class="brand-logo"
            src="W.png"
            alt="Writejot logo"
        >

        <div class="brand-name">
            Writejot
        </div>

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Dashboard
    </a>

</header>



<!-- =========================
     EDIT PROFILE
========================= -->

<main>

    <div class="card">

        <h1>
            Edit Profile
        </h1>

        <p class="intro">
            Customize your Writejot profile.
        </p>


        <!-- =========================
             PHOTO
        ========================= -->

        <div class="preview">

            <img
                id="photoPreview"
                src="W.png"
                alt="Profile picture"
            >


            <label
                class="upload-button"
                for="photoInput"
            >
                📷 Upload Photo
            </label>


            <input
                id="photoInput"
                type="file"
                accept="image/*"
            >


            <div class="photo-hint">
                JPG, PNG, or other image files
            </div>

        </div>



        <!-- =========================
             DISPLAY NAME
        ========================= -->

        <div class="field">

            <label for="displayName">
                Display Name
            </label>


            <input
                id="displayName"
                type="text"
                maxlength="50"
                placeholder="Your display name"
            >

        </div>



        <!-- =========================
             USERNAME
        ========================= -->

        <div class="field">

            <label for="username">
                Username
            </label>


            <div class="username-wrapper">

                <span
                    class="username-prefix"
                >
                    @
                </span>


                <input
                    id="username"
                    type="text"
                    maxlength="20"
                    placeholder="username"
                >

            </div>

        </div>



        <!-- =========================
             BIO
        ========================= -->

        <div class="field">

            <label for="bio">
                Bio
            </label>


            <textarea
                id="bio"
                maxlength="160"
                placeholder="Tell people a little about yourself..."
            ></textarea>

        </div>



        <!-- =========================
             ACTIONS
        ========================= -->

        <div class="actions">

            <button
                id="saveButton"
                class="save"
                onclick="saveProfile()"
            >
                Save Changes
            </button>


            <button
                class="cancel"
                onclick="window.location.href='index.html'"
            >
                Cancel
            </button>

        </div>


        <p id="message"></p>

    </div>

</main>



<script>


/* =========================================
   APPS SCRIPT
========================================= */

const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzm5LpGtEla7cszMG0OIxZqf_pwuxJnOSmpEwUkqsiz886ql12hDFBHdxFBCWYyVYxf/exec";


let currentUser = null;

let selectedImageData = "";

let selectedImageType = "image/jpeg";

let selectedImageName = "profile.jpg";


/* =========================================
   LOAD PROFILE IMMEDIATELY
========================================= */

window.onload = async function () {

    const savedUser =
        localStorage.getItem(
            "writejotUser"
        );


    /*
     * No local account means
     * return to dashboard.
     */

    if (!savedUser) {

        window.location.href =
            "index.html";

        return;

    }


    try {

        currentUser =
            JSON.parse(
                savedUser
            );

    }

    catch (error) {

        localStorage.removeItem(
            "writejotUser"
        );

        window.location.href =
            "index.html";

        return;

    }


    /*
     * Populate the page immediately
     * from the saved local account.
     */

    populateProfile(
        currentUser
    );


    /*
     * Then refresh from the database.
     */

    await refreshProfile();

};


/* =========================================
   POPULATE PROFILE
========================================= */

function populateProfile(
    user
) {

    document
        .getElementById(
            "displayName"
        )
        .value =
        user.name ||
        "";


    document
        .getElementById(
            "username"
        )
        .value =
        user.username ||
        "";


    document
        .getElementById(
            "bio"
        )
        .value =
        user.bio ||
        "";


    /*
     * Use custom picture first,
     * then Google's picture,
     * then the logo only as a final fallback.
     */

    const picture =
        user.profilePicture ||
        user.picture ||
        "W.png";


    document
        .getElementById(
            "photoPreview"
        )
        .src =
        picture;


    /*
     * If an image fails to load,
     * fall back to the logo.
     */

    document
        .getElementById(
            "photoPreview"
        )
        .onerror =
        function () {

            this.src =
                "W.png";

        };

}


/* =========================================
   REFRESH PROFILE FROM DATABASE
========================================= */

async function refreshProfile() {

    try {

        const response =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=account&email=" +
                encodeURIComponent(
                    currentUser.email
                )

            );


        const result =
            await response.json();


        if (
            result.success
        ) {

            currentUser = {

                ...currentUser,

                name:
                    result.name ||
                    currentUser.name ||
                    "",

                username:
                    result.username ||
                    currentUser.username ||
                    "",

                bio:
                    result.bio ||
                    "",

                profilePicture:
                    result.profilePicture ||
                    currentUser.profilePicture ||
                    ""

            };


            localStorage.setItem(

                "writejotUser",

                JSON.stringify(
                    currentUser
                )

            );


            populateProfile(
                currentUser
            );

        }

    }

    catch (error) {

        console.log(
            "Could not refresh profile:",
            error
        );

        /*
         * The local profile is still shown,
         * so the page remains usable.
         */

    }

}


/* =========================================
   PHOTO SELECTION
========================================= */

document
    .getElementById(
        "photoInput"
    )
    .addEventListener(
        "change",
        function (event) {

            const file =
                event.target.files[0];


            if (!file) {
                return;
            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                alert(
                    "Please choose an image file."
                );

                return;

            }


            selectedImageType =
                file.type;

            selectedImageName =
                file.name;


            /*
             * Read selected photo.
             */

            const reader =
                new FileReader();


            reader.onload =
                function () {

                    const image =
                        new Image();


                    image.onload =
                        function () {

                            const maxSize =
                                600;


                            let width =
                                image.width;

                            let height =
                                image.height;


                            if (
                                width >
                                height
                            ) {

                                if (
                                    width >
                                    maxSize
                                ) {

                                    height =
                                        height *
                                        maxSize /
                                        width;

                                    width =
                                        maxSize;

                                }

                            }
                            else {

                                if (
                                    height >
                                    maxSize
                                ) {

                                    width =
                                        width *
                                        maxSize /
                                        height;

                                    height =
                                        maxSize;

                                }

                            }


                            const canvas =
                                document
                                    .createElement(
                                        "canvas"
                                    );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                image,
                                0,
                                0,
                                width,
                                height
                            );


                            selectedImageData =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.82
                                );


                            selectedImageType =
                                "image/jpeg";

                            selectedImageName =
                                "profile.jpg";


                            document
                                .getElementById(
                                    "photoPreview"
                                )
                                .src =
                                selectedImageData;

                        };


                    image.src =
                        reader.result;

                };


            reader.readAsDataURL(
                file
            );

        }
    );


/* =========================================
   SAVE PROFILE
========================================= */

async function saveProfile() {

    const message =
        document.getElementById(
            "message"
        );


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    const name =
        document
            .getElementById(
                "displayName"
            )
            .value
            .trim();


    const username =
        document
            .getElementById(
                "username"
            )
            .value
            .trim()
            .toLowerCase()
            .replace(
                /^@/,
                ""
            );


    const bio =
        document
            .getElementById(
                "bio"
            )
            .value
            .trim();


    /*
     * Validate username.
     */

    if (
        username.length < 3 ||
        username.length > 20
    ) {

        message.textContent =
            "Username must be 3–20 characters.";

        message.style.color =
            "#dc2626";

        return;

    }


    if (
        !/^[a-z0-9_]+$/i.test(
            username
        )
    ) {

        message.textContent =
            "Username can only contain letters, numbers, and underscores.";

        message.style.color =
            "#dc2626";

        return;

    }


    saveButton.disabled =
        true;


    message.textContent =
        "Checking username...";

    message.style.color =
        "#667085";


    try {

        /*
         * Check username availability.
         */

        const availabilityResponse =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=usernameAvailable" +
                "&username=" +
                encodeURIComponent(
                    username
                ) +
                "&email=" +
                encodeURIComponent(
                    currentUser.email
                )

            );


        const availability =
            await availabilityResponse.json();


        if (
            !availability.available
        ) {

            message.textContent =
                availability.error ||
                "That username is already taken.";

            message.style.color =
                "#dc2626";

            saveButton.disabled =
                false;

            return;

        }


        message.textContent =
            selectedImageData
                ? "Uploading photo and saving profile..."
                : "Saving profile...";


        /*
         * Build request.
         */

        const payload = {

            action:
                "updateProfile",

            email:
                currentUser.email,

            name:
                name,

            username:
                username,

            bio:
                bio

        };


        /*
         * Only send image data when
         * a new image was selected.
         */

        if (
            selectedImageData
        ) {

            payload.profileImageData =
                selectedImageData;

            payload.profileImageType =
                selectedImageType;

            payload.profileImageName =
                selectedImageName;

        }


        /*
         * Send to Apps Script.
         */

        await fetch(

            APPS_SCRIPT_URL,

            {

                method:
                    "POST",

                mode:
                    "no-cors",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify(
                        payload
                    )

            }

        );


        /*
         * Give the backend a moment.
         */

        await sleep(
            1200
        );


        /*
         * Verify the saved profile.
         */

        const verifyResponse =
            await fetch(

                APPS_SCRIPT_URL +
                "?action=account&email=" +
                encodeURIComponent(
                    currentUser.email
                )

            );


        const result =
            await verifyResponse.json();


        if (
            !result.success
        ) {

            throw new Error(
                "Profile update could not be verified."
            );

        }


        /*
         * Update local account.
         */

        currentUser = {

            ...currentUser,

            name:
                result.name ||
                name,

            username:
                result.username ||
                username,

            bio:
                result.bio ||
                "",

            profilePicture:
                result.profilePicture ||
                currentUser.profilePicture ||
                ""

        };


        localStorage.setItem(

            "writejotUser",

            JSON.stringify(
                currentUser
            )

        );


        message.textContent =
            "Profile saved successfully!";

        message.style.color =
            "#15803d";


        /*
         * Go back to dashboard.
         */

        setTimeout(
            function () {

                window.location.href =
                    "index.html";

            },
            900
        );

    }


    catch (error) {

        console.error(
            "Profile save error:",
            error
        );


        message.textContent =
            "Could not save your profile. Please try again.";

        message.style.color =
            "#dc2626";

        saveButton.disabled =
            false;

    }

}


/* =========================================
   HELPER
========================================= */

function sleep(
    milliseconds
) {

    return new Promise(
        function (resolve) {

            setTimeout(
                resolve,
                milliseconds
            );

        }
    );

}

</script>


</body>

</html>
